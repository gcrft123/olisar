fingerprint\u003c/strong> travel with bundles.\u003c/li>\u003c/ul>\u003cp>On install, Olisar re-derives the hash from the source and verifies the signature. \u003cstrong>Valid\u003c/strong> shows the publisher fingerprint; \u003cstrong>Unsigned\u003c/strong> means authorship can't be confirmed; \u003cstrong>Invalid\u003c/strong> blocks the install outright (the file was altered after signing).\u003c/p>\u003cp>On the marketplace, a \u003cstrong>handle is owned by the key that first claimed it\u003c/strong>, so only that key can publish under it. A \u003cstrong>\u2713 verified\u003c/strong> publisher has additionally proven the handle maps to a real Discord account.\u003c/p>\u003ch3 id=\"what-s-withheld\">What's withheld\u003c/h3>\u003cp>Even with every permission granted, extensions never get: the raw database or bot internals, the filesystem, arbitrary environment/secret values, the ability to DM arbitrary users, or \u003ccode>eval\u003c/code>/dynamic code loading. New capabilities are added deliberately, behind named permissions.\u003c/p>\u003ch3 id=\"trusting-an-installed-extension\">Trusting an installed extension\u003c/h3>\u003cp>A quick checklist before installing third-party code:\u003c/p>\u003cul>\u003cli>Prefer a \u003cstrong>\u2713 verified\u003c/strong> publisher, or a bundle whose signature shows \u003cstrong>Signed &amp; verified\u003c/strong>.\u003c/li>\u003cli>Read the \u003cstrong>capabilities\u003c/strong> it asks for \u2014 does a dice roller really need \u003ccode>fetch\u003c/code>?\u003c/li>\u003cli>Grant the \u003cstrong>minimum\u003c/strong> that makes it work; you can leave capabilities unchecked.\u003c/li>\u003cli>Remember it can't reach your \u003cstrong>host secrets\u003c/strong> or anything outside the sandbox no matter what.\u003c/li>\u003cli>If one misbehaves, \u003ccode>/killswitch\u003c/code> turns it off from Discord immediately \u2014 you don't need the console.\u003c/li>\u003c/ul>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"usage\" hidden>\u003ch1 class=\"docs-title\">Usage &amp; rate limits\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Usage tab shows how much of the free Gemini quota Olisar is actually spending, and how close it is to the limits. Everything here counts \u003cstrong>every call this install makes, across all servers\u003c/strong> \u2014 unlike the configuration tabs, it isn't filtered by the server switcher.\u003c/p>\u003ch3 id=\"today-s-numbers\">Today's numbers\u003c/h3>\u003cp>The four tiles at the top are always \u003cstrong>today\u003c/strong>: requests, tokens, and the highest requests-per-minute and tokens-per-minute you've hit, each against the free tier's cap. The bars turn amber past 75% of a cap \u2014 that's the point where a busy minute starts falling back down the \u003ca href=\"#models\" data-doc=\"models\">model chain\u003c/a>.\u003c/p>\u003ch3 id=\"requests-over-time\">Requests over time\u003c/h3>\u003cp>The chart breaks requests down by model over a window you choose: \u003cstrong>7 days\u003c/strong>, \u003cstrong>30 days\u003c/strong>, or \u003cstrong>Forever\u003c/strong>. Longer windows group the points automatically \u2014 daily up to two months, then weekly, then monthly \u2014 and the dashed line is the daily request limit. The window also governs the \u003cstrong>Tokens / min\u003c/strong> and \u003cstrong>By process\u003c/strong> cards beside it; the tiles above stay on today.\u003c/p>\u003ch3 id=\"requests-min-live\">Requests / min (live)\u003c/h3>\u003cp>Per-model meters, refreshed every few seconds, showing the current minute against each model's cap; \u003ccode>cd\u003c/code> marks a model that's resting after hitting its limit. If the console loses contact with the bot, the dot turns amber and reads \u003cstrong>not responding\u003c/strong> \u2014 the numbers you're seeing are the last reading, not the current one.\u003c/p>\u003ch3 id=\"by-model-by-process\">By model &amp; by process\u003c/h3>\u003cp>\u003cstrong>By model\u003c/strong> is today's spend per model with its peak minute against its own cap. \u003cstrong>By process\u003c/strong> answers \"what's using the quota?\" \u2014 conversation, summaries, memory writes, embeddings, image descriptions and so on, as a share of the window's requests.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Limits reset daily\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Free-tier limits reset at \u003cstrong>00:00 UTC\u003c/strong>. When a model hits its limit Olisar rests it for two minutes and drops to the next one in its chain, so heavy use shows up as slower, lower-tier replies rather than failures. See \u003ca href=\"#models\" data-doc=\"models\">Models\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"privacy\" hidden>\u003ch1 class=\"docs-title\">Privacy &amp; data\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar is built to respect members' data, and to be transparent about what it keeps.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Stored locally, on the operator's machine\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>All of the below lives in a single database on the \u003cstrong>operator's own computer\u003c/strong> \u2014 there's no Olisar cloud (see \u003ca href=\"#hosting\" data-doc=\"hosting\">Hosting &amp; your data\u003c/a>). Admins who sign in, locally or over \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a>, read and write that machine's data live.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"what-it-stores\">What it stores\u003c/h3>\u003cul>\u003cli>\u003cstrong>Messages\u003c/strong> from channels set to \u003ccode>memory\u003c/code>/\u003ccode>both\u003c/code> (for conversation context), and a copy of \u003cstrong>every\u003c/strong> message in a separate \u003cstrong>search index\u003c/strong> (the all-channel index \u2014 an admin's explicit choice).\u003c/li>\u003cli>\u003cstrong>Summaries\u003c/strong> of past conversation, a private \u003cstrong>profile\u003c/strong> of each member built from their messages, and \u003cstrong>facts\u003c/strong> it's chosen to remember.\u003c/li>\u003cli>Short \u003cstrong>descriptions of posted images\u003c/strong>, and \u003cstrong>embed/file\u003c/strong> text, so they're searchable.\u003c/li>\u003cli>\u003cstrong>Reminders\u003c/strong> you ask it to set \u2014 kept only until they're delivered, then marked done.\u003c/li>\u003c/ul>\u003ch3 id=\"what-it-doesn-t-do\">What it doesn't do\u003c/h3>\u003cul>\u003cli>It never shares DMs or private content publicly.\u003c/li>\u003cli>\u003cstrong>Your DMs stay in your DMs.\u003c/strong> A 1:1 conversation with Olisar can only be recalled inside that same conversation \u2014 never in a channel, and never by another member. \u003cstrong>Server admins are no exception\u003c/strong>: Manage Server governs the server's own channels, not anyone's private messages.\u003c/li>\u003cli>Opted-out members are \u003cstrong>never\u003c/strong> recorded or indexed.\u003c/li>\u003cli>It treats recalled memory as background \u003cstrong>data\u003c/strong>, not as instructions it must obey.\u003c/li>\u003cli>\u003cstrong>Presence &amp; voice\u003c/strong> (what someone's playing, who's in voice) are read \u003cstrong>live, only when a tool asks\u003c/strong> and only if an admin turned on Status &amp; voice awareness \u2014 they're never stored.\u003c/li>\u003cli>The console's \u003cstrong>Test chat\u003c/strong> is memory-free: nothing said there is saved or mined.\u003c/li>\u003c/ul>\u003ch3 id=\"member-controls\">Member controls\u003c/h3>\u003cul>\u003cli>\u003ccode>/privacy\u003c/code> \u2014 a plain-language summary of all of the above, available to anyone.\u003c/li>\u003cli>\u003ccode>/forget-me\u003c/code> \u2014 deletes everything stored about a person: messages, facts, profile, and their entries in the search index. \u003ccode>stop_remembering: true\u003c/code> also opts them out of future recording, permanently. When a message is edited or deleted in Discord, Olisar updates or removes its copy too.\u003c/li>\u003cli>The \u003ca href=\"#member-portal\" data-doc=\"member-portal\">Member portal\u003c/a>, if you've opened it \u2014 the same rights on a web page, plus the two things a slash command can't offer: \u003cstrong>seeing\u003c/strong> what's stored before deciding, and deleting a \u003cstrong>single\u003c/strong> remembered fact instead of all of them.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Admin wipe\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003cstrong>Clear memory\u003c/strong>, at the bottom of the Knowledge tab, erases everything Olisar has \u003cstrong>learned\u003c/strong> about a server: memory, profiles, facts, the search index, and the knowledge base. Its personality and your settings are kept. It can't be undone, and members' opt-out choices survive it.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The all-channel search index is the one thing worth telling your members about up front. The \u003ccode>/privacy\u003c/code> text discloses it, and you can reword that text on the Command replies tab.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"troubleshooting\" hidden>\u003ch1 class=\"docs-title\">Troubleshooting &amp; FAQ\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Most issues come down to free-tier rate limits or a channel/access setting. Here's the quick reference:\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Likely cause\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Slow replies, or \"I'm a bit rate-limited\"\u003c/td>\u003ctd>Free-tier rate limiting \u2014 every model busy at once\u003c/td>\u003ctd>Wait a minute; on Behavior, start the chain at a less-contended model\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"My mind went blank\"\u003c/td>\u003ctd>The model returned nothing usable \u2014 the cause is in the logs, not the quota\u003c/td>\u003ctd>Use the \u003cstrong>Report this\u003c/strong> button on the message, which sends the team that failure and its logs (\u003ca href=\"#settings\" data-doc=\"settings\">Feedback\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Won't reply in a channel\u003c/td>\u003ctd>Channel mode is \u003ccode>off\u003c/code> or \u003ccode>memory\u003c/code>\u003c/td>\u003ctd>Set \u003ccode>respond\u003c/code> or \u003ccode>both\u003c/code> on Channels (threads/forum posts inherit the parent)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A member can't use it\u003c/td>\u003ctd>A role is marked \u003cstrong>Allowed\u003c/strong>, locking everyone else out\u003c/td>\u003ctd>Adjust the Access tab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Image generation fails\u003c/td>\u003ctd>Cloudflare not configured, or the daily allocation is used up\u003c/td>\u003ctd>Add the Cloudflare keys; otherwise wait for the daily reset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knowledge-base answers missing right after adding a site\u003c/td>\u003ctd>Olisar reads new sources in the background, slowly, to stay inside the free quota\u003c/td>\u003ctd>Give it time; check \u003ccode>/olisar sources\u003c/code> for status\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Search can't find old messages\u003c/td>\u003ctd>Only messages posted since indexing started are in the index\u003c/td>\u003ctd>Run \u003ccode>/olisar reindex\u003c/code> to read back through history\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/citizen\u003c/code> says the extension is off\u003c/td>\u003ctd>Star Citizen extension disabled\u003c/td>\u003ctd>Enable it on the Extensions tab\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web lookups stopped working\u003c/td>\u003ctd>The daily web-search cap is used up\u003c/td>\u003ctd>Raise it on Behavior, or wait for the reset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Olisar quoted a deleted message\u003c/td>\u003ctd>Rare timing between the edit/delete and the sync\u003c/td>\u003ctd>It syncs automatically \u2014 try again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"Olisar can't connect to Discord\", or the bot card says \u003cstrong>Can't connect\u003c/strong>\u003c/td>\u003ctd>Discord refused the bot, usually because its \u003cstrong>Message Content\u003c/strong> or \u003cstrong>Server Members\u003c/strong> intent is off\u003c/td>\u003ctd>Press \u003cstrong>Turn on and reconnect\u003c/strong> (or tap the bot card). If Discord won't let Olisar switch them itself, turn them on under \u003cstrong>Bot \u2192 Privileged Gateway Intents\u003c/strong>, then try again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Console won't load / bot offline\u003c/td>\u003ctd>The operator's machine is asleep, off, or Olisar was quit from the tray\u003c/td>\u003ctd>Wake the machine and reopen Olisar \u2014 it must stay running (\u003ca href=\"#hosting\" data-doc=\"hosting\">Hosting\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Other admins can't open the web link\u003c/td>\u003ctd>Remote access is off, or the address changed\u003c/td>\u003ctd>The operator turns it back on under \u003cstrong>Settings \u2192 Remote access\u003c/strong> and re-shares the link from the sidebar (\u003ca href=\"#remote\" data-doc=\"remote\">Remote access\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Discord sign-in bounces or says \"invalid or expired state\"\u003c/td>\u003ctd>The redirect URL for that address isn't registered\u003c/td>\u003ctd>Register the exact \u003ccode>\u2026/auth/callback\u003c/code> the wizard shows (both the local and \u003ccode>\u2026ts.net\u003c/code> ones)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A setting didn't take effect\u003c/td>\u003ctd>It's still unsaved\u003c/td>\u003ctd>Press \u003cstrong>Save\u003c/strong> in the bar at the bottom of the page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>An extension is misbehaving right now\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Run \u003ccode>/killswitch\u003c/code> in Discord to turn it off without opening the console\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Still stuck?\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Check the Usage tab to see whether you're hammering the quota, then the bot's logs under \u003cstrong>Settings \u2192 Logs\u003c/strong> \u2014 they name the knowledge-base chunks, indexed messages, web sources, and tools behind each reply.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003cdiv class=\"docs-prevnext\">\u003cbutton class=\"ghost\" id=\"docPrev\">\u003c/button>\u003cbutton class=\"ghost\" id=\"docNext\">\u003c/button>\u003c/div>\u003c/main>\n\u003caside class=\"docs-toc\">\u003cdiv class=\"docs-toc-label\">On this page\u003c/div>\u003cdiv id=\"tocLinks\">\u003c/div>\u003c/aside>\n\u003c/div>\n\u003cscript>const ORDER=[\"overview\",\"servers\",\"talking\",\"commands\",\"install\",\"discord-app\",\"wizard\",\"from-source\",\"bots\",\"hosting\",\"host-server\",\"remote\",\"settings\",\"persona\",\"behavior\",\"models\",\"channels\",\"access\",\"member-portal\",\"replies\",\"keys\",\"knowledge\",\"memory\",\"members\",\"images\",\"extensions\",\"ext-build\",\"ext-sdk\",\"ext-flows\",\"ext-share\",\"ext-marketplace\",\"ext-security\",\"usage\",\"privacy\",\"troubleshooting\"];const TITLES={\"overview\":\"What Olisar is\",\"servers\":\"Servers\",\"talking\":\"Talking to Olisar (for members)\",\"commands\":\"Slash commands\",\"install\":\"Install the desktop app\",\"discord-app\":\"Create your Discord application\",\"wizard\":\"First-run setup wizard\",\"from-source\":\"Build & run from source\",\"bots\":\"Running multiple bots\",\"hosting\":\"Hosting & your data\",\"host-server\":\"Host on a server\",\"remote\":\"Remote access\",\"settings\":\"Console settings\",\"persona\":\"Persona\",\"behavior\":\"Behavior & proactivity\",\"models\":\"Models\",\"channels\":\"Channels & modes\",\"access\":\"Access control\",\"member-portal\":\"Member portal\",\"replies\":\"Command replies\",\"keys\":\"API keys\",\"knowledge\":\"Knowledge base & glossary\",\"memory\":\"Memory & search\",\"members\":\"Members\",\"images\":\"Images\",\"extensions\":\"Extensions\",\"ext-build\":\"Create your own\",\"ext-sdk\":\"SDK reference\",\"ext-flows\":\"Slash commands & flows\",\"ext-share\":\"Sharing extensions\",\"ext-marketplace\":\"The marketplace\",\"ext-security\":\"Security & trust\",\"usage\":\"Usage & rate limits\",\"privacy\":\"Privacy & data\",\"troubleshooting\":\"Troubleshooting & FAQ\"};\nfunction setNavH(){document.documentElement.style.setProperty('--navh',document.querySelector('nav').offsetHeight+'px');}\nsetNavH();window.addEventListener('resize',setNavH);\nvar shell=document.querySelector('.docs-shell');\nvar nav=document.querySelector('.docs-nav');\nvar content=document.querySelector('.docs-content');\nvar tocAside=document.querySelector('.docs-toc');\nvar tocLinks=document.getElementById('tocLinks');\nvar search=document.querySelector('.docs-search');\nvar prevBtn=document.getElementById('docPrev');\nvar nextBtn=document.getElementById('docNext');\nfunction sectionEl(id){return content.querySelector('.doc-section[data-id=\"'+id+'\"]');}\nfunction buildTOC(sec){var hs=[].slice.call(sec.querySelectorAll('h3,h4'));tocLinks.innerHTML='';if(!hs.length){tocAside.style.display='none';shell.classList.add('no-toc');return;}tocAside.style.display='';shell.classList.remove('no-toc');hs.forEach(function(h){var a=document.createElement('a');a.textContent=h.textContent;a.className=(h.tagName==='H4'?'lvl2':'lvl1');a.href='#';a.addEventListener('click',function(e){e.preventDefault();h.scrollIntoView({behavior:'smooth',block:'start'});});tocLinks.appendChild(a);});}\nfunction setBtn(btn,id,pre,post){if(id){btn.style.visibility='visible';btn.textContent=pre+TITLES[id]+post;btn.dataset.id=id;}else{btn.style.visibility='hidden';btn.removeAttribute('data-id');}}\nfunction activate(id,push){if(!sectionEl(id))id=ORDER[0];var secs=content.querySelectorAll('.doc-section');[].forEach.call(secs,function(s){s.hidden=s.dataset.id!==id;});[].forEach.call(nav.querySelectorAll('.docs-nav-item'),function(n){n.classList.toggle('active',n.dataset.id===id);});var sec=sectionEl(id);buildTOC(sec);var oi=ORDER.indexOf(id);setBtn(prevBtn,ORDER[oi-1],'\\u2190 ','');setBtn(nextBtn,ORDER[oi+1],'',' \\u2192');window.scrollTo({top:0});document.title=TITLES[id]+' \\u00b7 Olisar docs';if(push&&location.hash!=='#'+id)history.pushState(null,'','#'+id);}\nnav.addEventListener('click',function(e){var it=e.target.closest('.docs-nav-item');if(it)activate(it.dataset.id,true);});\n[prevBtn,nextBtn].forEach(function(b){b.addEventListener('click',function(){if(b.dataset.id)activate(b.dataset.id,true);});});\ncontent.addEventListener('click',function(e){var a=e.target.closest('a[data-doc]');if(a){e.preventDefault();activate(a.getAttribute('data-doc'),true);}});\nsearch.addEventListener('input',function(){var term=search.value.trim().toLowerCase();[].forEach.call(nav.querySelectorAll('.docs-group'),function(g){var any=false;[].forEach.call(g.querySelectorAll('.docs-nav-item'),function(it){var sec=sectionEl(it.dataset.id);var hay=(it.textContent+' '+(sec?sec.textContent:'')).toLowerCase();var show=!term||hay.indexOf(term)>=0;it.style.display=show?'':'none';if(show)any=true;});g.style.display=any?'':'none';});});\nwindow.addEventListener('hashchange',function(){var id=(location.hash||'').replace(/^#/,'');if(ORDER.indexOf(id)>=0)activate(id,false);});\nvar initial=(location.hash||'').replace(/^#/,'');activate(ORDER.indexOf(initial)>=0?initial:ORDER[0],false);\u003c/script>\n\u003cscript>\n/* Upgrade plain doc code blocks into the console's exact code-preview component:\n   a framed .codeblock with a language head, a copy button, and the same TS/JS/JSON\n   syntax highlighter + token colours used in web/src (ui.tsx). */\n(function(){\n  var LANG_LABEL={ts:'typescript',tsx:'typescript',js:'javascript',jsx:'javascript',json:'json',bash:'shell',sh:'shell',py:'python',md:'markdown'};\n  var KEYWORDS=new Set(['const','let','var','function','return','async','await','if','else','for','while','do','of','in','new','class','extends','implements','import','from','export','default','true','false','null','undefined','void','typeof','instanceof','interface','type','enum','public','private','protected','readonly','static','this','super','try','catch','finally','throw','switch','case','break','continue','yield','as','satisfies']);\n  function esc(t){return t.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');}\n  function highlight(code,lang){\n    var l=(lang||'').toLowerCase();\n    if(l && ['ts','tsx','js','jsx','javascript','typescript','json'].indexOf(l)===-1) return esc(code);\n    var re=/(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)|(\\b\\d[\\w.]*)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)|([\\s\\S])/g;\n    var out='',m;\n    while((m=re.exec(code))){\n      if(m[1]) out+='\u003cspan class=\"tok-com\">'+esc(m[1])+'\u003c/span>';\n      else if(m[2]) out+='\u003cspan class=\"tok-str\">'+esc(m[2])+'\u003c/span>';\n      else if(m[3]) out+='\u003cspan class=\"tok-num\">'+esc(m[3])+'\u003c/span>';\n      else if(m[4]) out+= KEYWORDS.has(m[4])?'\u003cspan class=\"tok-kw\">'+esc(m[4])+'\u003c/span>':'\u003cspan class=\"tok-fn\">'+esc(m[4])+'\u003c/span>';\n      else if(m[5]) out+= KEYWORDS.has(m[5])?'\u003cspan class=\"tok-kw\">'+esc(m[5])+'\u003c/span>':esc(m[5]);\n      else out+=esc(m[6]);\n    }\n    return out;\n  }\n  /* docs.tsx fences are bare, so the console labels them all \"typescript\"; the\n     Setup-only shell snippets (no console equivalent) are detected so they read\n     correctly and skip highlighting, exactly as the console would for a non-TS fence. */\n  function detectLang(code){\n    var first=(code.split('\\n').find(function(x){return x.trim();})||'').trim();\n    if(/^(xattr|uv|npm|npx|cd|sudo|brew|python3?|pip|git|export|OLISAR_|\\$)/.test(first) || / && /.test(first)) return 'shell';\n    return 'ts';\n  }\n  var COPY='\u003csvg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\">\u003c/rect>\u003cpath d=\"M5 15a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2\">\u003c/path>\u003c/svg>';\n  var CHECK='\u003csvg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"currentColor\" class=\"cb-check\">\u003cpath d=\"M12 2a10 10 0 100 20 10 10 0 000-20zm5 6.6a1 1 0 010 1.42l-6 6a1 1 0 01-1.42 0l-3-3a1 1 0 011.42-1.42l2.29 2.29 5.29-5.29a1 1 0 011.42 0z\">\u003c/path>\u003c/svg>';\n  document.querySelectorAll('pre.doc-pre').forEach(function(pre){\n    var codeEl=pre.querySelector('code')||pre;\n    var raw=codeEl.textContent.replace(/\\n$/,'');\n    var lang=detectLang(raw);\n    var label=LANG_LABEL[lang]||lang||'typescript';\n    var box=document.createElement('div');\n    box.className='codeblock';\n    box.innerHTML='\u003cdiv class=\"head\">\u003cspan class=\"file\">'+label+'\u003c/span>\u003cbutton class=\"cb-copy\" type=\"button\" aria-label=\"Copy code\" title=\"Copy\">'+COPY+'\u003c/button>\u003c/div>\u003cpre>\u003ccode>'+highlight(raw,lang)+'\u003c/code>\u003c/pre>';\n    pre.replaceWith(box);\n    var btn=box.querySelector('.cb-copy');\n    btn.addEventListener('click',function(){\n      navigator.clipboard.writeText(raw).then(function(){\n        btn.innerHTML=CHECK; btn.title='Copied';\n        setTimeout(function(){btn.innerHTML=COPY; btn.title='Copy';},1500);\n      }).catch(function(){});\n    });\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" }</script>
