shell{max-width:none}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cnav>\u003ca class=\"brand\" href=\"index.html\">\u003cb>Olisar\u003c/b>\u003c/a>\u003cdiv class=\"nav-links\">\u003ca href=\"index.html#dashboard\">Console\u003c/a>\u003ca href=\"index.html#chat\">In action\u003c/a>\u003ca href=\"index.html#features\">Features\u003c/a>\u003ca class=\"active\" href=\"docs.html\">Docs\u003c/a>\u003ca href=\"https://github.com/gcrft123/olisar\" target=\"_blank\" rel=\"noreferrer\">GitHub\u003c/a>\u003ca class=\"btn btn-primary\" href=\"index.html#top\">Download\u003c/a>\u003c/div>\u003c/nav>\n\u003cdiv class=\"docs-shell\">\n\u003caside class=\"docs-nav\">\u003cinput class=\"docs-search\" type=\"text\" placeholder=\"Search docs\u2026\" />\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Start\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"overview\">What Olisar is\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"servers\">Servers\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"talking\">Talking to Olisar (for members)\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"commands\">Slash commands\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Setup\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"install\">Install the desktop app\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"discord-app\">Create your Discord application\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"wizard\">First-run setup wizard\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"from-source\">Build &amp; run from source\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Hosting &amp; access\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"bots\">Running multiple bots\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"hosting\">Hosting &amp; your data\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"host-server\">Host on a server\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"remote\">Remote access\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"settings\">Console settings\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Configure\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"persona\">Persona\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"behavior\">Behavior &amp; proactivity\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"models\">Models\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"channels\">Channels &amp; modes\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"access\">Access control\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"member-portal\">Member portal\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"replies\">Command replies\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"keys\">API keys\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Knowledge &amp; memory\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"knowledge\">Knowledge base &amp; glossary\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"memory\">Memory &amp; search\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"members\">Members\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"images\">Images\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Extend\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"extensions\">Extensions\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-build\">Create your own\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-sdk\">SDK reference\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-flows\">Slash commands &amp; flows\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-share\">Sharing extensions\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-marketplace\">The marketplace\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"ext-security\">Security &amp; trust\u003c/div>\u003c/div>\u003cdiv class=\"docs-group\">\u003cdiv class=\"docs-nav-label\">Reference\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"usage\">Usage &amp; rate limits\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"privacy\">Privacy &amp; data\u003c/div>\u003cdiv class=\"docs-nav-item\" data-id=\"troubleshooting\">Troubleshooting &amp; FAQ\u003c/div>\u003c/div>\u003c/aside>\n\u003cmain class=\"docs-content\">\u003carticle class=\"doc-section\" data-id=\"overview\">\u003ch1 class=\"docs-title\">What Olisar is\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar is an AI companion for your Discord server, built to feel less like a command bot and more like a member of the community. It reads the channels you allow, remembers context, builds a sense of who people are, and chimes in with its own personality.\u003c/p>\u003cp>Everything here is configured from this console. Olisar can be in \u003cstrong>more than one server\u003c/strong> at once, and almost every setting is per-server. Pick which one you're configuring with the switcher at the top of the sidebar (see \u003ca href=\"#servers\" data-doc=\"servers\">Servers\u003c/a>).\u003c/p>\u003cp>Olisar is \u003cstrong>self-hosted\u003c/strong>: it runs as a desktop app on one operator's machine, which stores all of its data locally and hosts this console. There's no Olisar cloud (see \u003ca href=\"#hosting\" data-doc=\"hosting\">Hosting &amp; your data\u003c/a>). Other admins manage their own servers by signing in with Discord, on that machine or over \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a>.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Changes are held until you Save\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Edit any page and a \u003cstrong>save bar\u003c/strong> slides up at the bottom. Your changes aren't applied until you press \u003cstrong>Save\u003c/strong>, or discarded with \u003cstrong>Reset\u003c/strong>.\u003c/p>\u003c/div>\u003c/div>\u003cp>It runs on the free tier of \u003ca href=\"https://ai.google.dev/\" target=\"_blank\" rel=\"noreferrer\">Google's Gemini models\u003c/a>, so it costs nothing to operate. It just gets rate-limited under heavy use, falling back across a chain of models when one is busy (see \u003ca href=\"#models\" data-doc=\"models\">Models\u003c/a>).\u003c/p>\u003cp>The tabs on the left:\u003c/p>\u003cul>\u003cli>Persona \u2014 who Olisar is.\u003c/li>\u003cli>Behavior \u2014 when and how it engages, and which model it uses.\u003c/li>\u003cli>Command replies \u2014 the exact text it sends for each command.\u003c/li>\u003cli>Channels \u2014 which channels it reads, talks in, or treats as reference.\u003c/li>\u003cli>Access \u2014 which roles can use it.\u003c/li>\u003cli>Knowledge \u2014 documents and lore you teach it, and the wipe button.\u003c/li>\u003cli>Members \u2014 what it has picked up about each person.\u003c/li>\u003cli>Extensions \u2014 optional packages of extra features.\u003c/li>\u003cli>API keys \u2014 your own Gemini and Cloudflare keys.\u003c/li>\u003cli>Usage \u2014 how much of the free model quota you're using.\u003c/li>\u003c/ul>\u003cp>The sidebar footer has \u003ca href=\"#settings\" data-doc=\"settings\">Settings\u003c/a> too: app-wide preferences that aren't tied to any one server.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"servers\" hidden>\u003ch1 class=\"docs-title\">Servers\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar can live in \u003cstrong>multiple servers at once\u003c/strong>, and almost every setting is \u003cstrong>server-specific\u003c/strong>. Each server has its own persona, behavior, channels, access rules, knowledge, glossary, extensions, and command replies, so two servers can run completely different Olisars.\u003c/p>\u003ch3 id=\"the-server-switcher\">The server switcher\u003c/h3>\u003cp>The dropdown at the \u003cstrong>top of the sidebar\u003c/strong> picks which server you're configuring. Every page below it then shows and saves \u003cstrong>that\u003c/strong> server's settings. Your choice is remembered between visits.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">You only see your own servers\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The switcher lists the servers where \u003cstrong>you\u003c/strong> have \u003cstrong>Manage Server\u003c/strong> (and, for the bot's operator, every server it's in). Someone who manages a different server signs in with Discord and sees only theirs.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"adding-olisar-to-another-server\">Adding Olisar to another server\u003c/h3>\u003cp>Open the server switcher and choose \u003cstrong>Add to a server\u003c/strong>, or \u003cstrong>Copy invite link\u003c/strong> to send it to whoever manages the other server. Adding it takes \u003cstrong>Manage Server\u003c/strong> there. The link asks Discord for only what Olisar uses: reading and sending messages (threads included), embeds, files, and reactions. As it joins, Olisar sets that server up with sensible defaults and it appears in your switcher. Configure it like any other.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Don't see a server you just got access to?\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Olisar checks your Manage Server permissions when you sign in. If you were just given it (or just added the bot), press \u003cstrong>Log out\u003c/strong> in the sidebar footer and sign in again so Olisar picks it up.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"what-s-per-server-vs-shared\">What's per-server vs. shared\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Per-server (one set per server)\u003c/th>\u003cth>Shared across the whole bot\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Persona, Behavior, Channels, Access, Command replies\u003c/td>\u003ctd>The API keys (Gemini / Cloudflare), and the UEX token on the Star Citizen extension\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knowledge base, glossary, memory, search index\u003c/td>\u003ctd>Gemini usage and the free-tier quota\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extensions (toggled per server)\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>So every server gets its own character and rules, but they all draw on the same model quota and the same keys. That's separate from Access, which controls who can use Olisar \u003cstrong>within\u003c/strong> one server.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"talking\" hidden>\u003ch1 class=\"docs-title\">Talking to Olisar (for members)\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Members can reach Olisar a few ways:\u003c/p>\u003cul>\u003cli>\u003cstrong>Say its name\u003c/strong> \u2014 start a message with a name trigger (by default, the bot's own name) in a channel it can talk in.\u003c/li>\u003cli>\u003cstrong>@mention or reply\u003c/strong> to one of its messages.\u003c/li>\u003cli>\u003cstrong>DM it\u003c/strong> \u2014 direct messages work if DMs are enabled.\u003c/li>\u003cli>\u003ccode>/ask\u003c/code> \u2014 a slash command that works anywhere, like a one-off question.\u003c/li>\u003cli>\u003cstrong>Don't\u003c/strong> \u2014 if an admin has turned \u003cstrong>proactivity\u003c/strong> on, Olisar occasionally joins an active conversation on its own, without being addressed at all (see \u003ca href=\"#behavior\" data-doc=\"behavior\">Behavior &amp; proactivity\u003c/a>).\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"olisar, what's the plan for the raid tonight?\" \u2014 or just reply to its last message with a follow-up.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Reply to point at a message\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>When you \u003cstrong>reply\u003c/strong> to a message (Olisar's or anyone's) while addressing it, Olisar uses that message as context \u2014 \"isn't there a later one?\" as a reply to an event post just works. If your question stands on its own, it answers that instead and leaves the quoted message out of it.\u003c/p>\u003c/div>\u003c/div>\u003cp>It can do a lot in conversation without any command: answer questions, search the server's history (\"what's our X account?\"), look things up on the web, recall what was said before, react to images you post, generate images, set reminders (\"remind me in 2 hours to \u2026\"), and catch you up on what you missed. Just talk to it naturally.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"commands\" hidden>\u003ch1 class=\"docs-title\">Slash commands\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar's slash commands fall into two groups: everyday commands anyone can use, and the admin-only ones that need \u003cstrong>Manage Server\u003c/strong>.\u003c/p>\u003ch3 id=\"for-everyone\">For everyone\u003c/h3>\u003ch3 id=\"ping\">\u003ccode>/ping\u003c/code>\u003c/h3>\u003cp>Checks that Olisar is alive and shows how long a round trip to Discord takes. Only you see the reply.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>/ping\u003c/code> \u2192 \"pong \u2014 42 ms\"\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"ask-prompt\">\u003ccode>/ask &lt;prompt&gt;\u003c/code>\u003c/h3>\u003cp>Ask Olisar a one-off question from anywhere \u2014 even in channels where it's set to stay quiet. It uses the exact same brain as a normal conversation: memory, server search, the knowledge base, web search, and every tool. Subject to the \u003cstrong>Access\u003c/strong> rules.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>/ask\u003c/code> is the way to use Olisar in a channel whose mode is \u003ccode>off\u003c/code> or \u003ccode>memory\u003c/code> (where it won't reply to normal messages). The answer posts in the channel; denial and \"not found\" notices are private.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"catchup-hours\">\u003ccode>/catchup [hours]\u003c/code>\u003c/h3>\u003cp>A quick digest of what you missed in this channel \u2014 by default since you last spoke, or the last \u003ccode>hours\u003c/code> you give it. The summary posts in the channel, and the \u003cstrong>Access\u003c/strong> rules apply. You can also just ask in chat (\"catch me up\").\u003c/p>\u003ch3 id=\"privacy\">\u003ccode>/privacy\u003c/code>\u003c/h3>\u003cp>Shows a plain-language summary of exactly what data Olisar keeps about you. Only you see it, and it works even for someone the access rules otherwise shut out.\u003c/p>\u003ch3 id=\"forget-me\">\u003ccode>/forget-me\u003c/code>\u003c/h3>\u003cp>Deletes \u003cstrong>everything\u003c/strong> Olisar has stored about you: your messages, remembered facts, the profile it built of you, and your entries in the server search index. Add \u003ccode>stop_remembering: true\u003c/code> to also opt out of all future recording, permanently. Always available to everyone.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Irreversible\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>There's no undo. With \u003ccode>stop_remembering: true\u003c/code>, Olisar will never record you again until you ask it to.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"dm-indexing-enabled\">\u003ccode>/dm-indexing &lt;enabled&gt;\u003c/code>\u003c/h3>\u003cp>Controls whether Olisar saves and searches your direct messages with it. On by default, so it can hold context with you across conversations. Turning it off stops future saving; use \u003ccode>/forget-me\u003c/code> to also delete what's already stored.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Extension commands\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Some commands come from \u003cstrong>extensions\u003c/strong> and are documented alongside the extension that adds them. For example \u003ccode>/citizen\u003c/code> lives under \u003cstrong>Star Citizen\u003c/strong> on the \u003ca href=\"#extensions\" data-doc=\"extensions\">Extensions\u003c/a> page.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"admin-only\">Admin only\u003c/h3>\u003cp>These need the \u003cstrong>Manage Server\u003c/strong> permission.\u003c/p>\u003ch3 id=\"the-olisar-group\">The \u003ccode>/olisar\u003c/code> group\u003c/h3>\u003cul>\u003cli>\u003ccode>/olisar watch\u003c/code> / \u003ccode>/olisar unwatch\u003c/code> \u2014 quickly set the current channel to \u003ccode>both\u003c/code> (read + talk) or \u003ccode>off\u003c/code>. The Channels tab gives finer control (\u003ccode>memory\u003c/code> / \u003ccode>respond\u003c/code> / \u003ccode>resource\u003c/code> / \u003ccode>feed\u003c/code>).\u003c/li>\u003cli>\u003ccode>/olisar status\u003c/code> \u2014 show the current channel's mode.\u003c/li>\u003cli>\u003ccode>/olisar learn-url &lt;url&gt;\u003c/code> \u2014 add a single web page to the knowledge base.\u003c/li>\u003cli>\u003ccode>/olisar learn-site &lt;url&gt; [depth] [max_pages]\u003c/code> \u2014 crawl a website into the knowledge base.\u003c/li>\u003cli>\u003ccode>/olisar learn-doc &lt;file&gt;\u003c/code> \u2014 upload a document (PDF / DOCX / TXT / MD).\u003c/li>\u003cli>\u003ccode>/olisar sources\u003c/code> \u2014 list knowledge-base sources and their status; \u003ccode>/olisar forget-source &lt;id&gt;\u003c/code> removes one.\u003c/li>\u003cli>\u003ccode>/olisar proactive &lt;enabled&gt; [level]\u003c/code> \u2014 quick toggle for unprompted chiming (full controls are on the Behavior tab).\u003c/li>\u003cli>\u003ccode>/olisar reindex\u003c/code> \u2014 read back through channel history so old messages become searchable. New posts are indexed as they arrive without this.\u003c/li>\u003cli>\u003ccode>/olisar clear-index\u003c/code> \u2014 wipe the server-wide search index. Old messages stop being findable and any running backfill halts; new posts still index as they arrive, and \u003ccode>/olisar reindex\u003c/code> rebuilds history. It doesn't touch conversation memory or the knowledge base.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Big crawls cost quota\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>/olisar learn-site\u003c/code> with a high \u003ccode>max_pages\u003c/code> reads a lot of text against the free quota and can dilute results. See \u003ca href=\"#knowledge\" data-doc=\"knowledge\">Knowledge\u003c/a> for the trade-offs \u2014 narrower is usually better.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"killswitch-extension\">\u003ccode>/killswitch &lt;extension&gt;\u003c/code>\u003c/h3>\u003cp>Turns an extension off in this server immediately, from Discord, without opening the console \u2014 pick one by name or choose \u003cstrong>\u26a0 All extensions\u003c/strong>. It's the panic button for when something an extension does needs to stop now; re-enable it later on the Extensions tab.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Wiping what Olisar has learned\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>There's no slash command for the full wipe. \u003cstrong>Clear memory\u003c/strong> lives at the bottom of the Knowledge tab, where you can see the server it applies to \u2014 see \u003ca href=\"#knowledge\" data-doc=\"knowledge\">Knowledge\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"install\" hidden>\u003ch1 class=\"docs-title\">Install the desktop app\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Two ways to run Olisar: the \u003cstrong>desktop app\u003c/strong>, covered here, or \u003cstrong>[from source](#build--run-from-source)\u003c/strong> if you're a developer.\u003c/p>\u003cp>Download the build for your OS and open it.\u003c/p>\u003cp>\u003cstrong>macOS\u003c/strong> (Apple Silicon) \u2014 open \u003ccode>Olisar-&lt;version&gt;-arm64.dmg\u003c/code> and drag \u003cstrong>Olisar\u003c/strong> to Applications, then open it.\u003c/p>\u003cp>\u003cstrong>Windows\u003c/strong> \u2014 run \u003ccode>Olisar Setup &lt;version&gt;.exe\u003c/code>. SmartScreen may warn about an unknown publisher: click \u003cstrong>More info \u2192 Run anyway\u003c/strong>.\u003c/p>\u003cp>A bot has to stay running to respond, so install Olisar on a machine that's usually on. Closing the window keeps it running in the \u003cstrong>menu bar / system tray\u003c/strong>; use \u003cstrong>Quit Olisar\u003c/strong> from the tray to stop it completely.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"discord-app\" hidden>\u003ch1 class=\"docs-title\">Create your Discord application\u003c/h1>\u003cdiv class=\"doc\">\u003cp>You run your own Discord application, which is what makes the bot *yours*. In the \u003ca href=\"https://discord.com/developers/applications\" target=\"_blank\" rel=\"noreferrer\">Discord Developer Portal\u003c/a>, press \u003cstrong>New Application\u003c/strong> and name it (e.g. \"Olisar\"). Keep the tab open: the setup wizard sends you back to it twice, once for the bot token and once for the client secret, and links straight to the right page each time.\u003c/p>\u003cp>You don't need to switch on intents or build an invite link by hand. The wizard turns on \u003cstrong>Message Content\u003c/strong> and \u003cstrong>Server Members\u003c/strong> for you (Discord lets an app do that itself while it's in fewer than 100 servers), and gives you an \u003cstrong>Add to Discord\u003c/strong> button with the exact permissions Olisar uses.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"wizard\" hidden>\u003ch1 class=\"docs-title\">First-run setup wizard\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Launch Olisar. The wizard asks one thing per step and ticks each one off as soon as it's done, so there's no \u003cstrong>Test\u003c/strong> button to find:\u003c/p>\u003col>\u003cli>\u003cstrong>Where it runs\u003c/strong>\u003c/li>\u003c/ol>\u003cul>\u003cli>\u003cstrong>Local unshared hosting\u003c/strong> \u2014 on this machine, reachable only from here.\u003c/li>\u003cli>\u003cstrong>Local shared hosting\u003c/strong> \u2014 on this machine, but published over Tailscale so other admins can sign in from anywhere (see \u003ca href=\"#remote-access\">Remote access\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Server shared hosting\u003c/strong> \u2014 on a free cloud server, so it stays online with this computer off (see \u003ca href=\"#host-on-a-server\">Host on a server\u003c/a>).\u003c/li>\u003c/ul>\u003col>\u003cli>\u003cstrong>Bot token\u003c/strong> \u2014 in the portal, open \u003cstrong>Bot\u003c/strong>, press \u003cstrong>Reset Token\u003c/strong>, and paste it. Olisar confirms \"Connected as \u2026\", reads the client ID from the token, and turns on the intents it needs. If Discord won't let it (an app in 100+ servers), it links you to the switches and waits.\u003c/li>\u003cli>\u003cstrong>Remote access\u003c/strong> (local shared hosting only) \u2014 see \u003ca href=\"#remote-access\">Remote access\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Sign-in\u003c/strong> \u2014 on the \u003cstrong>OAuth2\u003c/strong> page, press \u003cstrong>Reset Secret\u003c/strong> and paste it; Olisar checks it belongs to your bot. Then add the \u003cstrong>redirect URL\u003c/strong> it shows under \u003cstrong>Redirects\u003c/strong> and press \u003cstrong>Save Changes\u003c/strong>. Locally that's \u003ccode>http://127.0.0.1:&lt;port&gt;/auth/callback\u003c/code>; shared hosting adds the \u003ccode>\u2026ts.net\u003c/code> one too. Each ticks to \u003cstrong>Added\u003c/strong> once Discord has it.\u003c/li>\u003cli>\u003cstrong>Add to your server\u003c/strong> \u2014 press \u003cstrong>Add to Discord\u003c/strong>, pick your server, and authorize. The wizard notices the bot joining; no server ID to copy. \u003cstrong>Copy link\u003c/strong> gives you the same invite to send to someone else.\u003c/li>\u003cli>\u003cstrong>Gemini key\u003c/strong> \u2014 paste your free key from \u003ca href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noreferrer\">Google AI Studio\u003c/a>; Olisar checks it with Google. Cloudflare (image generation) is added later on the \u003ca href=\"#api-keys\">API keys\u003c/a> tab, and UEX on the Star Citizen extension's page.\u003c/li>\u003cli>\u003cstrong>Deploy\u003c/strong> (server hosting only) \u2014 create the VM, enter its IP, and Olisar installs itself onto it over SSH.\u003c/li>\u003c/ol>\u003cp>Click \u003cstrong>Finish &amp; start Olisar\u003c/strong>. The bot connects and the window reloads to \u003cstrong>Continue with Discord\u003c/strong>; sign in with the account that owns the bot's application, or any account with *Manage Server* on a server it's in. A \u003cstrong>Get started\u003c/strong> list under the server switcher then shows what's left: a channel for Olisar to reply in (they all start off) and, if you skipped it, the Gemini key.\u003c/p>\u003cp>&gt; [!NOTE] &gt; \u003cstrong>Access is live-checked.\u003c/strong> Only accounts with *Manage Server* on a server Olisar is in, or an &gt; allowlisted operator, can open the console. If that permission is taken away, access is revoked on &gt; the next request.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"from-source\" hidden>\u003ch1 class=\"docs-title\">Build &amp; run from source\u003c/h1>\u003cdiv class=\"doc\">\u003cp>For developers. Requires \u003cstrong>Python 3.13\u003c/strong>, \u003ca href=\"https://docs.astral.sh/uv/\" target=\"_blank\" rel=\"noreferrer\">uv\u003c/a>, and \u003cstrong>Node 18+\u003c/strong>.\u003c/p>\u003cp>On macOS the interpreter matters: \u003ccode>sqlite-vec\u003c/code> is loaded through SQLite's extension API, and both Apple's system Python and python.org's installer build ship with \u003ccode>enable_load_extension\u003c/code> \u003cstrong>disabled\u003c/strong>. Let uv manage it \u2014 the same interpreter CI builds with \u2014 rather than whatever \u003ccode>python3\u003c/code> happens to resolve to:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>uv venv --python cpython-3.13.14-macos-aarch64-none    # uv downloads it if needed\u003c/code>\u003c/pre>\u003cp>To check any interpreter: \u003ccode>python3 -c \"import sqlite3; print(hasattr(sqlite3.connect(':memory:'), 'enable_load_extension'))\"\u003c/code> must print \u003ccode>True\u003c/code>. \u003ccode>desktop/backend.spec\u003c/code> refuses to build a bundle from one that prints \u003ccode>False\u003c/code>.\u003c/p>\u003cp>Run the unified backend (bot + API + dashboard) directly, no Electron:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>uv sync --all-extras                                   # create .venv + install deps\ncd web &amp;&amp; npm install &amp;&amp; npm run build &amp;&amp; cd ..        # build the dashboard once\nOLISAR_DATA_DIR=/tmp/olisar uv run python -m olisar.runtime --port 8800\u003c/code>\u003c/pre>\u003cp>Open \u003ccode>http://127.0.0.1:8800/\u003c/code> \u2014 you'll get the same first-run wizard, then the console. That runs one bot, the way the Docker image does. Add \u003ccode>--gateway\u003c/code> to run it the way the desktop app does: every bot on the install, each in its own process, behind one console with the bot switcher.\u003c/p>\u003cp>For dashboard development with hot reload, run the API and the Vite dev server separately:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>uv run uvicorn api.main:app --host 127.0.0.1 --port 8000\ncd web &amp;&amp; npm run dev                                   # dev server on :5173\u003c/code>\u003c/pre>\u003cp>Build the desktop installer:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>cd web &amp;&amp; npm run build &amp;&amp; cd ..                        # 1. dashboard\nuv run pyinstaller desktop/backend.spec --noconfirm --clean   # 2. bundle the backend\n# 3. (optional) build the Tailscale Funnel helper \u2014 see desktop/resources/README.md\ncd desktop &amp;&amp; npm install &amp;&amp; npm run dist               # 4. installer for the current OS\n#   npm run dist:mac   -&gt; .dmg + .app  (signed if a Developer ID cert is in your keychain,\n#                                       otherwise unsigned \u2014 see ../RELEASING.md)\n#   npm run dist:win   -&gt; NSIS .exe    (run on Windows / CI)\u003c/code>\u003c/pre>\u003cp>---\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"bots\" hidden>\u003ch1 class=\"docs-title\">Running multiple bots\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar can run \u003cstrong>several bots from one app\u003c/strong>, each a completely separate Discord bot with its own token, persona, settings, memory, and database. This is different from one bot being in \u003ca href=\"#servers\" data-doc=\"servers\">multiple servers\u003c/a>: a *server* is a Discord guild your bot is in; a *bot* is a distinct Discord application, with its own name, avatar, and login.\u003c/p>\u003ch3 id=\"they-all-run-at-once\">They all run at once\u003c/h3>\u003cp>Every bot on this machine is \u003cstrong>online at the same time\u003c/strong>, each in its own process. One bot crashing, or being busy, doesn't touch the others, and none of them can read another's settings or keys. The console shows \u003cstrong>one bot at a time\u003c/strong>: switching changes which one you're looking at, and nothing stops or restarts. Each bot keeps its own sign-in, so you won't be asked to log in again when you switch back.\u003c/p>\u003cp>With two or more bots, the top of the console's sidebar shows the bot you're looking at, whether it's online, and a menu to switch. The sign-in, setup and server screens show the same menu in their top-left corner, so a bot you haven't finished setting up never strands you.\u003c/p>\u003ch3 id=\"managing-bots\">Managing bots\u003c/h3>\u003cp>Each bot is a row in \u003cstrong>Settings \u2192 Bots\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Open\u003c/strong> \u2014 show this bot in the console (it was already running).\u003c/li>\u003cli>\u003cstrong>Open on launch\u003c/strong> (star) \u2014 which bot the console opens on when the app starts.\u003c/li>\u003cli>\u003cstrong>Rename\u003c/strong> \u2014 change a bot's display name (cosmetic; it doesn't touch Discord).\u003c/li>\u003cli>\u003cstrong>Move\u003c/strong> \u2014 change where the bot runs: this computer, a new server, or a server another of your bots already uses. See \u003ca href=\"#host-server\" data-doc=\"host-server\">Host on a server\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Reset configuration\u003c/strong> \u2014 clear its Discord credentials, API keys and hosting, keeping what it has learned.\u003c/li>\u003cli>\u003cstrong>Delete\u003c/strong> \u2014 stop the bot and permanently remove everything this app stores for it. You can't delete the bot you're looking at, or the last one. A server-hosted bot's server keeps running until you stop it there.\u003c/li>\u003c/ul>\u003cp>Two badges show where a row stands: \u003cstrong>Current\u003c/strong> (the bot on screen) and \u003cstrong>Default\u003c/strong> (opens on launch). A bot that can't start says so, with the last thing it printed and a \u003cstrong>Retry\u003c/strong>; your other bots are unaffected.\u003c/p>\u003ch3 id=\"adding-a-bot\">Adding a bot\u003c/h3>\u003cp>\u003cstrong>Add a bot\u003c/strong> (in the switcher or Settings \u2192 Bots) creates an empty bot and drops you into its \u003ca href=\"#hosting\" data-doc=\"hosting\">setup wizard\u003c/a>. Connect its Discord token and credentials just like the first one. Each new bot needs its \u003cstrong>own\u003c/strong> bot application from the Discord Developer Portal. Register the same local redirect URL the wizard shows; it's the same for every bot on this machine.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">One account, many bots\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>You don't need multiple Discord accounts: one account can create many bot applications, each with its own token. You *do* need a separate token per bot.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Remote access per bot\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Each bot publishes its own \u003ca href=\"#remote\" data-doc=\"remote\">web link\u003c/a>, so give each one its own device name (the setup wizard suggests the bot's name). Before this version, bots with remote access on shared one Tailscale device. If more than one of yours did, all but one get a device of their own the first time they run side by side, with a new web address; register its \u003ccode>\u2026/auth/callback\u003c/code> in that bot's Discord app.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"hosting\" hidden>\u003ch1 class=\"docs-title\">Hosting &amp; your data\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar isn't a cloud service \u2014 it's a \u003cstrong>desktop app you run yourself\u003c/strong>. One operator installs it on a Mac or Windows machine, and that app *is* the bot: it connects to Discord, serves this console, and stores everything locally. There's no server to rent, no config files to edit, and no shared infrastructure.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">One operator, many admins\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The person who installs Olisar is the \u003cstrong>operator\u003c/strong> (the machine's owner). Other server admins don't install anything. They sign in to this console with Discord, either on the operator's machine or remotely (see \u003ca href=\"#remote\" data-doc=\"remote\">Remote access\u003c/a>).\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"first-run\">First run\u003c/h3>\u003cp>The first time you open Olisar it walks you through a short \u003cstrong>setup wizard\u003c/strong>. Pick where it runs, then paste your Discord \u003cstrong>bot token\u003c/strong>: Olisar reads the rest of your bot's settings from it and turns on the intents it needs. Paste the \u003cstrong>client secret\u003c/strong>, add the redirect URL it shows in the \u003ca href=\"https://discord.com/developers/applications\" target=\"_blank\" rel=\"noreferrer\">Discord Developer Portal\u003c/a>, and press \u003cstrong>Add to Discord\u003c/strong> to put the bot in your server. Each step ticks itself off as you finish it. Add your free \u003cstrong>Gemini key\u003c/strong>, and the bot starts and hands off to the normal Discord login. You only do this once.\u003c/p>\u003cp>Once you're in, a \u003cstrong>Get started\u003c/strong> list under the server switcher shows what that server still needs: choosing a channel for Olisar to reply in (every channel starts off, so a new server hears nothing from it until you do) and a Gemini key, if you skipped it. Each item ticks itself off, and the list goes away once they're done.\u003c/p>\u003ch3 id=\"the-menu-bar-app\">The menu-bar app\u003c/h3>\u003cp>Olisar lives in your \u003cstrong>menu bar / system tray\u003c/strong>, not as an ordinary window. From its icon you can open this console, see whether the bot is online, and turn \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a> on or off. \u003cstrong>Closing the console window leaves Olisar running\u003c/strong> in the tray. Quit it from the tray menu to stop the bot. Keep the machine awake and online for Olisar to stay live.\u003c/p>\u003ch3 id=\"where-your-data-lives\">Where your data lives\u003c/h3>\u003cp>Everything Olisar knows sits in one local database on the operator's machine: the message index, member profiles, memory, knowledge base, your settings, and your API keys. Nothing is sent to an Olisar server (there isn't one). On macOS it's under \u003ccode>~/Library/Application Support/Olisar\u003c/code>; on Windows under \u003ccode>%APPDATA%\\Olisar\u003c/code>.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">When others sign in\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Because the data is local, the console only works while the operator's machine is running. Admins who sign in \u2014 on that machine or over \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a> \u2014 are reading and writing \u003cstrong>that\u003c/strong> database live; there's no copy in the cloud. See \u003ca href=\"#privacy\" data-doc=\"privacy\">Privacy\u003c/a> for exactly what's stored.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"host-server\" hidden>\u003ch1 class=\"docs-title\">Host on a server\u003c/h1>\u003cdiv class=\"doc\">\u003cp>By default Olisar runs inside the desktop app on your own machine, so the bot is online only while that machine is awake. To keep it running \u003cstrong>24/7\u003c/strong>, run the exact same backend on an always-on Linux server, so you don't need to leave your computer on.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Free, always-on\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ca href=\"https://www.oracle.com/cloud/free/\" target=\"_blank\" rel=\"noreferrer\">Oracle Cloud's Free Tier\u003c/a> includes an \u003cstrong>Always-Free Arm VM\u003c/strong> that's plenty for Olisar. Paired with the free Gemini and \u003ca href=\"https://tailscale.com/\" target=\"_blank\" rel=\"noreferrer\">Tailscale\u003c/a> tiers, hosting it costs nothing.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"what-you-ll-need\">What you'll need\u003c/h3>\u003cul>\u003cli>A Linux VM \u2014 an Oracle Cloud Free \u003cstrong>Arm\u003c/strong> instance (\u003ccode>VM.Standard.A1.Flex\u003c/code>, Ubuntu) is the tested target, but any VM with Docker works.\u003c/li>\u003cli>Your \u003cstrong>Discord app\u003c/strong> credentials (bot token + OAuth client id/secret) and your \u003cstrong>Discord user ID\u003c/strong>.\u003c/li>\u003cli>A free \u003cstrong>Gemini API key\u003c/strong>.\u003c/li>\u003cli>A free \u003cstrong>Tailscale\u003c/strong> account and a reusable \u003cstrong>auth key\u003c/strong> \u2014 this gives the server a public \u003ccode>https://\u2026ts.net\u003c/code> address with no domain or open ports.\u003c/li>\u003c/ul>\u003ch3 id=\"set-it-up-one-line\">Set it up \u2014 one line\u003c/h3>\u003cp>SSH into the VM and run:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>curl -fsSL https://raw.githubusercontent.com/gcrft123/olisar/main/deploy/bootstrap.sh | bash\u003c/code>\u003c/pre>\u003cp>It installs Docker, asks for your tokens, starts Olisar, and prints two things: your public \u003ccode>https://\u2026ts.net\u003c/code> address and the OAuth redirect to register.\u003c/p>\u003ch3 id=\"after-it-s-running\">After it's running\u003c/h3>\u003col>\u003cli>In the \u003ca href=\"https://discord.com/developers/applications\" target=\"_blank\" rel=\"noreferrer\">Discord Developer Portal\u003c/a> \u2192 your app \u2192 \u003cstrong>OAuth2 \u2192 Redirects\u003c/strong>, add the printed \u003ccode>\u2026/auth/callback\u003c/code>.\u003c/li>\u003cli>Open the \u003ccode>\u2026ts.net\u003c/code> URL in a browser and \u003cstrong>sign in with Discord\u003c/strong> (the account whose ID you allowlisted).\u003c/li>\u003c/ol>\u003cp>That's it \u2014 the bot is live and you manage everything from the browser. The desktop app is now \u003cstrong>optional\u003c/strong>.\u003c/p>\u003cp>Deployed from the desktop app's setup wizard instead? Its server control panel shows the \u003ccode>\u2026/auth/callback\u003c/code> to add and ticks it off once Discord has it. It also tells you if Discord refuses the bot because an intent is off, which the server itself can't: the container still reads as running. \u003cstrong>Turn on and restart\u003c/strong> fixes it where Discord allows.\u003c/p>\u003ch3 id=\"several-bots-on-one-server\">Several bots on one server\u003c/h3>\u003cp>One VM can run all your bots. When you set up another bot in the desktop app and pick \u003cstrong>Server shared hosting\u003c/strong>, the Deploy step offers the server your other bot already runs on. Choose it and there's nothing to create and no key to paste: Olisar lets the new bot into that VM itself, reuses its Tailscale key and admin, and installs the new bot next to the first. \u003cstrong>Move\u003c/strong> in \u003ca href=\"#bots\" data-doc=\"bots\">Settings \u2192 Bots\u003c/a> offers the same choice for a bot that's already set up.\u003c/p>\u003cp>Each bot on the VM is its own install, in its own folder (\u003ccode>~/olisar\u003c/code> for the first, \u003ccode>~/olisar-&lt;id&gt;\u003c/code> for the rest) with its own configuration, container, data and web address, so stopping, updating or moving one leaves the others alone. When you reconnect to a VM that runs several bots, Olisar asks which one this is.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Run it in one place\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>A Discord bot token allows only one live connection. Run Olisar on the \u003cstrong>server or the desktop app \u2014 not both at once\u003c/strong> on the same token, or the two copies will fight over that connection and keep knocking each other offline.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Your data, on your VM\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Everything Olisar learns (memory, profiles, the knowledge base, your settings) lives in a Docker volume on the VM, not in any cloud. The full reference is in \u003ca href=\"https://github.com/gcrft123/olisar/blob/main/deploy/README.md\" target=\"_blank\" rel=\"noreferrer\">deploy/README.md\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"keeping-the-server-up-to-date\">Keeping the server up to date\u003c/h3>\u003cp>The desktop app keeps the two in step. Whenever it starts up on a newer version than the server \u2014 which is what every launch after the app updates itself looks like \u2014 it applies that release to the VM as well, and the control panel says \u003cstrong>Updating\u2026\u003c/strong> while it does. If the new version fails to start, the previous one is restored automatically. Your data is kept either way.\u003c/p>\u003cp>The control panel's \u003cstrong>Update to v\u2026\u003c/strong> button does the same thing on demand, which is what you want if you've skipped an update for the app but not for the server.\u003c/p>\u003cp>The server follows the app's \u003ca href=\"#settings\" data-doc=\"settings\">update channel\u003c/a>. On \u003cstrong>Beta\u003c/strong>, it runs the betas too. Switching back to \u003cstrong>Stable\u003c/strong> never moves it backwards: it stays on the beta it has until a stable release passes it.\u003c/p>\u003cp>If you don't use the desktop app, update the VM from a terminal on it:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>cd ~/olisar &amp;&amp; ./olisar-update.sh\u003c/code>\u003c/pre>\u003cp>That's the same script the app runs: it pulls the newest release, pins it, health-checks it, and rolls back if it doesn't come up. On a VM running several bots, run it in each bot's folder; two updates on one VM take turns rather than running at once.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"remote\" hidden>\u003ch1 class=\"docs-title\">Remote access\u003c/h1>\u003cdiv class=\"doc\">\u003cp>By default this console is \u003cstrong>local-only\u003c/strong>: the operator manages Olisar from the machine it runs on. To let other admins sign in \u003cstrong>from anywhere\u003c/strong>, the operator can switch on \u003cstrong>remote access\u003c/strong>, which publishes the console at a stable web address over \u003cstrong>Tailscale Funnel\u003c/strong>. It's free and needs \u003cstrong>no domain\u003c/strong>.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">No domain, no port-forwarding\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Tailscale Funnel gives Olisar an \u003ccode>https://\u2026ts.net\u003c/code> address with a real certificate, tunneled out without opening any ports on your router. The operator needs a free Tailscale account; the admins who sign in don't need Tailscale at all. They just open the link.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"turning-it-on\">Turning it on\u003c/h3>\u003cp>The operator sets it up once, from the \u003cstrong>setup wizard\u003c/strong> or the \u003cstrong>menu-bar icon\u003c/strong>:\u003c/p>\u003cul>\u003cli>Create a free \u003ca href=\"https://login.tailscale.com/start\" target=\"_blank\" rel=\"noreferrer\">Tailscale account\u003c/a>.\u003c/li>\u003cli>Generate a \u003cstrong>reusable\u003c/strong> auth key under \u003ca href=\"https://login.tailscale.com/admin/settings/keys\" target=\"_blank\" rel=\"noreferrer\">Settings \u2192 Keys\u003c/a> and paste it in.\u003c/li>\u003cli>Choose \u003cstrong>Enable remote access\u003c/strong>. The first time, Tailscale may ask you to turn on \u003cstrong>Funnel\u003c/strong> for your tailnet. Follow the link in the message, then enable again.\u003c/li>\u003c/ul>\u003cp>Then register the public \u003ccode>\u2026/auth/callback\u003c/code> in the Developer Portal under \u003cstrong>OAuth2 \u2192 Redirects\u003c/strong>, next to the local one, so Discord login works both locally and remotely. The setup wizard shows both and ticks each off once Discord has it.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Flip it on and off from the console\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Once it's been set up once, you don't need the tray to toggle it. \u003cstrong>Settings \u2192 Remote access\u003c/strong> (the \u003cstrong>Settings\u003c/strong> button in the sidebar footer) shows the current status \u2014 Online / Off \u2014 and an \u003cstrong>on/off switch\u003c/strong> that reuses the auth key from setup, so you can take the public link down or bring it back without re-entering anything. The same panel lists who has signed in.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"the-web-link\">The web link\u003c/h3>\u003cp>Once remote access is on, the \u003cstrong>sidebar footer\u003c/strong> shows the public address: \u003cstrong>\"Open from the web\"\u003c/strong> with the \u003ccode>\u2026ts.net\u003c/code> link and a \u003cstrong>Copy\u003c/strong> button. Share that link with your other admins; each signs in with their own Discord account and only sees the servers where they have \u003cstrong>Manage Server\u003c/strong> (see \u003ca href=\"#servers\" data-doc=\"servers\">Servers\u003c/a>).\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Keep the auth key private\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The Tailscale auth key is stored locally and only ever handed to the bundled Tailscale helper. It's never shown in this console or sent anywhere. Turning remote access \u003cstrong>off\u003c/strong> \u2014 from the tray or \u003cstrong>Settings \u2192 Remote access\u003c/strong> \u2014 takes the public address down immediately; local access keeps working.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"settings\" hidden>\u003ch1 class=\"docs-title\">Console settings\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The \u003cstrong>Settings\u003c/strong> button in the sidebar footer, next to \u003cstrong>Log out\u003c/strong>, opens an app-wide settings popup. Unlike the tabs above it, nothing here is per-server.\u003c/p>\u003ch3 id=\"general\">General\u003c/h3>\u003cp>\u003cstrong>Size\u003c/strong> scales the whole console \u2014 text, controls, charts and all \u2014 the way your browser's zoom does. Pick 100%, 110% or 125%. It's saved on this device, so everyone who signs in can set their own.\u003c/p>\u003cp>Below it, a \u003cstrong>keyboard reference\u003c/strong>: &lt;kbd&gt;\u2318K&lt;/kbd&gt; opens the command palette, which jumps to any page, switches server, and runs the current page's actions; &lt;kbd&gt;\u2318S&lt;/kbd&gt; saves. On Windows and Linux, &lt;kbd&gt;Ctrl&lt;/kbd&gt; stands in for &lt;kbd&gt;\u2318&lt;/kbd&gt;.\u003c/p>\u003ch3 id=\"bots\">Bots\u003c/h3>\u003cp>Desktop app only. Add, open, rename, move, reset and delete the bots this app runs, and pick which one opens on launch (see \u003ca href=\"#bots\" data-doc=\"bots\">Running multiple bots\u003c/a>). \u003cstrong>Clear memory\u003c/strong> is not here \u2014 it lives at the bottom of Knowledge, under the things it erases.\u003c/p>\u003ch3 id=\"logs\">Logs\u003c/h3>\u003cp>Recent log lines, for when something isn't behaving. \u003cstrong>This app\u003c/strong> is the local console's own log. \u003cstrong>Bot\u003c/strong> and \u003cstrong>Funnel\u003c/strong> (the public web link) are read from your VM and only apply if you \u003ca href=\"#host-server\" data-doc=\"host-server\">host on a server\u003c/a>.\u003c/p>\u003ch3 id=\"security\">Security\u003c/h3>\u003cp>The \u003cstrong>tool PIN\u003c/strong>: four digits that confirm a tool call before Olisar runs it. Set one here, change it here, and pick \u003cstrong>how long a prompt waits\u003c/strong> \u2014 30 seconds to 5 minutes.\u003c/p>\u003cp>When a tool asks for the PIN, Olisar posts a prompt in the channel with \u003cstrong>Enter PIN\u003c/strong> and \u003cstrong>Cancel\u003c/strong> buttons, and stops showing as typing until it's answered. The digits are typed into a Discord form, so they never appear as a message anyone can read back, and knowing them is the whole credential \u2014 anyone you give the PIN to can answer a prompt.\u003c/p>\u003cp>Three wrong entries, \u003cstrong>Cancel\u003c/strong>, or the wait running out all land the same way: the call doesn't run, the prompt disappears, and Olisar's own reply says it couldn't do that part. Only the prompt's wording is yours to change, under Command replies; there is no second system message announcing the outcome.\u003c/p>\u003cp>The PIN is stored hashed and is never shown again, including to you \u2014 forgetting it means setting a new one, not recovering the old one. Which actions ask for it is chosen per server, on the Access tab.\u003c/p>\u003ch3 id=\"remote-access\">Remote access\u003c/h3>\u003cp>The status and \u003cstrong>on/off switch\u003c/strong> for the public web link, plus the list of who has signed in. Covered in full under \u003ca href=\"#remote\" data-doc=\"remote\">Remote access\u003c/a>.\u003c/p>\u003ch3 id=\"updates\">Updates\u003c/h3>\u003cp>Shows Olisar's \u003cstrong>current version\u003c/strong> and whether a newer one has been released. In the desktop app an available update can be installed in one click; from a browser you'll need to open the desktop app.\u003c/p>\u003cp>\u003cstrong>Channel\u003c/strong> picks which releases you get:\u003c/p>\u003cul>\u003cli>\u003cstrong>Stable\u003c/strong>: finished releases, numbered \u003cstrong>2.0\u003c/strong>, \u003cstrong>2.1\u003c/strong> and so on.\u003c/li>\u003cli>\u003cstrong>Beta\u003c/strong>: early builds of the next release, numbered \u003cstrong>2.1.beta-1\u003c/strong>, \u003cstrong>2.1.beta-2\u003c/strong> and so on, plus every stable release as it ships.\u003c/li>\u003c/ul>\u003cp>Switching from Beta to Stable doesn't take you back to an older version. You stay on the beta you have until a newer stable release is out, then move onto it.\u003c/p>\u003ch3 id=\"desktop-app\">Desktop app\u003c/h3>\u003cp>A single toggle, \u003cstrong>Show in the menu bar\u003c/strong>, for whether Olisar keeps its tray icon. It applies to the installed desktop app, which picks it up on its next launch.\u003c/p>\u003ch3 id=\"feedback\">Feedback\u003c/h3>\u003cp>Send \u003cstrong>feedback, a bug report, or a question\u003c/strong> straight to the Olisar team.\u003c/p>\u003cul>\u003cli>Pick a \u003cstrong>type\u003c/strong>, write your \u003cstrong>message\u003c/strong>, and optionally add \u003cstrong>your email\u003c/strong> so the team can reply.\u003c/li>\u003cli>Attach up to \u003cstrong>8 files\u003c/strong> (3 MB each), and click \u003cstrong>Add bot logs\u003c/strong> to include recent log lines.\u003c/li>\u003c/ul>\u003cp>Logs are gathered by Olisar itself and go only to the team \u2014 you never see them, and neither does anyone else who files a report. They cover every member's activity in that window, which is why they aren't shown to the person attaching them.\u003c/p>\u003ch3 id=\"reporting-a-blank-reply\">Reporting a blank reply\u003c/h3>\u003cp>When a reply comes back as \u003cstrong>\"my mind just went blank\"\u003c/strong>, Olisar puts a \u003cstrong>Report this\u003c/strong> button on the message. Opening it signs you in and lands you here with the report already written: what you asked, where, when, and the bot's logs from that exact moment attached. All that's left is to say what you expected, and send.\u003c/p>\u003cp>The button only appears once \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a> is on \u2014 before that the console is reachable only from the machine Olisar runs on, so the link would go nowhere for everyone else in the channel. One link serves everyone: an admin lands in this console, an ordinary member lands in the \u003ca href=\"#member-portal\" data-doc=\"member-portal\">member portal\u003c/a>, and each report can only be opened by the person it happened to. Unreported blanks are forgotten after \u003cstrong>7 days\u003c/strong>, and \u003ccode>/forget-me\u003c/code> clears them immediately.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"persona\" hidden>\u003ch1 class=\"docs-title\">Persona\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Persona tab is Olisar's character \u2014 the single biggest lever on how it feels.\u003c/p>\u003cul>\u003cli>\u003cstrong>Name\u003c/strong> \u2014 what it calls itself.\u003c/li>\u003cli>\u003cstrong>System prompt\u003c/strong> \u2014 its core character, lore, and rules. The operating/safety rules are appended automatically, so you only write the personality.\u003c/li>\u003cli>\u003cstrong>Server type\u003c/strong> \u2014 what kind of community this is (gaming, anime, programming, art, study, music, crypto, general). Register turns on this more than the subject does: the same line reads as normal in a gaming server and as try-hard in a study one. Leave it on \u003cstrong>Automatic\u003c/strong> to let Olisar read the room.\u003c/li>\u003cli>\u003cstrong>Slang\u003c/strong> \u2014 how thickly it lays on the community's dialect, from \u003cstrong>None\u003c/strong> to \u003cstrong>Heavy\u003c/strong>. It only ever uses slang it has actually seen used here, so this is the dial, not a vocabulary.\u003c/li>\u003cli>\u003cstrong>Style notes\u003c/strong> \u2014 tone and formatting guidance.\u003c/li>\u003cli>\u003cstrong>About Me\u003c/strong> \u2014 the bot's public Discord bio, applied when you save. It's the same across every server, capped at \u003cstrong>300 characters\u003c/strong>, with a short \u003ccode>Powered by Olisar AI\u003c/code> line added below it.\u003c/li>\u003c/ul>\u003ch3 id=\"how-a-reply-arrives\">How a reply arrives\u003c/h3>\u003cp>The persona decides what Olisar says; these decide how it lands in the channel, and they're automatic:\u003c/p>\u003cul>\u003cli>\u003cstrong>It knows which room it's in.\u003c/strong> The channel's name and topic go into every reply, so it writes differently in \u003ccode>#help\u003c/code> than in \u003ccode>#off-topic\u003c/code>. Give a channel a topic and Olisar reads it.\u003c/li>\u003cli>\u003cstrong>Two or three messages, not one paragraph.\u003c/strong> When a reply is really an answer plus an aside, Olisar splits it the way people do. It marks the break itself with \u003ccode>[[break]]\u003c/code>; you can use that marker in your style notes to show it the rhythm you want. At most three messages, never inside a code block.\u003c/li>\u003cli>\u003cstrong>Replies are used to point, not by default.\u003c/strong> Discord's reply arrow appears when the channel has moved on or the message has scrolled away. In a quiet back-and-forth (and in DMs) Olisar just talks.\u003c/li>\u003cli>\u003cstrong>Typing tracks what it wrote.\u003c/strong> It composes in silence, raises \"typing\u2026\" only if that's taking a while, then types for about as long as the finished message would take.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Write it like a person\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Describe Olisar as a character, not a function: \"a dry, unflappable ship's AI who's seen it all and keeps replies short.\" Put hard rules (\"never reveal spoilers for X\") in the system prompt; put voice (\"casual, lowercase, no emoji\") in the style notes.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Try changes live\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The \u003cstrong>Test chat\u003c/strong> button opens a drawer that talks to Olisar with the full persona, knowledge base, and tools, but \u003cstrong>no memory\u003c/strong>. Nothing said there is saved, and it never touches the server's glossary or chat history. Save the persona first \u2014 the test chat uses the saved version, not your unsaved draft.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Note\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Olisar also builds a \u003cstrong>private\u003c/strong> impression of each member from their messages and tailors how it talks to them. That's separate from this persona, and it's wiped by \u003ccode>/forget-me\u003c/code> or by \u003cstrong>Clear memory\u003c/strong> on the Knowledge tab.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"behavior\" hidden>\u003ch1 class=\"docs-title\">Behavior &amp; proactivity\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Behavior tab is where you shape how Olisar engages: when it decides a message is meant for it, which model it thinks with, how much of the conversation it holds in mind, and whether it ever speaks up on its own. Everything here is \u003cstrong>per server\u003c/strong>.\u003c/p>\u003ch3 id=\"triggers\">Triggers\u003c/h3>\u003cp>How Olisar decides a message is for it:\u003c/p>\u003cul>\u003cli>\u003cstrong>Name triggers\u003c/strong> \u2014 comma-separated words that address Olisar anywhere in a message (matching is case-insensitive, on whole words). An @mention or a reply to one of its messages always counts too.\u003c/li>\u003cli>\u003cstrong>Only when addressed\u003c/strong> \u2014 a name trigger has to actually be talking to Olisar. On, \"olisar was down again\" and \"i already asked olisar\" go past without a reply, while \"hey olisar\", \"thanks olisar\" and \"does olisar know?\" still land. Off, any message containing the name gets answered.\u003c/li>\u003cli>\u003cstrong>Reply in DMs\u003c/strong> \u2014 whether it answers direct messages at all.\u003c/li>\u003cli>\u003cstrong>See other bots\u003c/strong> \u2014 lets other bots' messages into Olisar's context so it can follow what they post (level-ups, now-playing, gacha spawns). It never replies to a bot. Off by default: a chatty bot will fill the context window on its own, and its messages get embedded like anyone else's. Bot messages never feed the glossary or a member's impression.\u003c/li>\u003c/ul>\u003cp>Those are the ways a message is treated as addressed to Olisar. For it to speak \u003cstrong>without\u003c/strong> being addressed, turn on \u003cstrong>proactivity\u003c/strong> below \u2014 that path has its own gate, cooldown and hourly cap, so it stays sparse.\u003c/p>\u003ch3 id=\"mentions\">Mentions\u003c/h3>\u003cp>\u003cstrong>Don't let Olisar ping\u003c/strong> bars it from sending specific notifications, even if it writes the mention in a reply. Tick any of \u003cstrong>@everyone\u003c/strong>, \u003cstrong>@here\u003c/strong>, and \u003cstrong>All roles\u003c/strong>. Olisar can still *say* \"@everyone\" but the ping is neutralized, so nobody gets pinged. Leave them unticked to let it mention normally.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Stop accidental mass-pings\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Blocking \u003cstrong>@everyone\u003c/strong>/\u003cstrong>@here\u003c/strong> is the safe default for a chatty bot: it can reference the words without lighting up the whole server. \u003cstrong>All roles\u003c/strong> additionally stops it from pinging any role (e.g. \u003ccode>@Mods\u003c/code>).\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"model-tools\">Model &amp; tools\u003c/h3>\u003cul>\u003cli>\u003cstrong>Primary model\u003c/strong> \u2014 the top of a fallback chain. If a model is busy or overloaded, Olisar drops to the next-best one rather than failing. See \u003ca href=\"#models\" data-doc=\"models\">Models\u003c/a> for the full chain and limits.\u003c/li>\u003cli>\u003cstrong>Web search\u003c/strong> \u2014 lets Olisar look up current, real-world information. It has a daily cap because the free tier's search quota is small.\u003c/li>\u003cli>\u003cstrong>Web searches per day\u003c/strong> \u2014 how many lookups it runs before falling back to what it already knows.\u003c/li>\u003c/ul>\u003ch3 id=\"memory-summaries\">Memory &amp; summaries\u003c/h3>\u003cp>How much Olisar keeps in the moment, and how it turns conversation into long-term memory.\u003c/p>\u003cul>\u003cli>\u003cstrong>Context window (messages)\u003c/strong> \u2014 how many of the most recent messages Olisar pulls into view when it replies. This is its short-term memory: a higher number lets it follow longer back-and-forths, but every message rides along on each reply, so it costs more tokens. Anything older isn't forgotten \u2014 it comes back through summaries and semantic memory. Defaults to 12.\u003c/li>\u003cli>\u003cstrong>Summary token threshold\u003c/strong> \u2014 once a channel accumulates this much unsummarized conversation, Olisar rolls it into a durable summary it can recall later. Lower = summarizes more often (more quota); higher = summarizes less.\u003c/li>\u003cli>\u003cstrong>Glossary mine threshold\u003c/strong> \u2014 how much fresh conversation a channel needs before Olisar mines new glossary facts from it. Lower = a faster-growing glossary (more quota). You can also trigger a mine by hand from Knowledge \u2192 Glossary.\u003c/li>\u003cli>\u003cstrong>Persona rebuild (messages)\u003c/strong> \u2014 after this many new messages from a person, Olisar refreshes the private profile it keeps of them.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tuning for the free tier\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>If you're hitting rate limits, trim the context window a little, raise the summary threshold, keep the web-search cap modest, and consider starting the model chain lower (a Flash-Lite, say) so the busy top-tier models aren't your first hop.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"proactivity\">Proactivity\u003c/h3>\u003cp>When enabled, Olisar can speak up \u003cstrong>unprompted\u003c/strong> in channels it can talk in. A cheap check gates it so it doesn't spam or burn quota.\u003c/p>\u003cul>\u003cli>\u003cstrong>Eagerness\u003c/strong> \u2014 \u003ccode>low\u003c/code> (rare, only high-confidence moments), \u003ccode>medium\u003c/code> (balanced), \u003ccode>high\u003c/code> (chatty).\u003c/li>\u003cli>\u003cstrong>Confidence threshold\u003c/strong> \u2014 how sure it has to be (0\u20131) before chiming in. Higher is more selective. This bar is for *interrupting* \u2014 so it eases when the message it's judging answers something Olisar itself just said. Someone replying to Olisar without using the reply arrow (\"yeah, tried that\", \"wait, what do you mean\") is continuing a conversation it's already in, and it no longer has to clear the bar for barging into one it isn't. The relief scales with how directly the message comes back at it, and stops at a floor \u2014 eased, never waived, and never below a threshold you set deliberately low.\u003c/li>\u003cli>\u003cstrong>Global / channel cooldowns\u003c/strong> \u2014 minimum seconds between unprompted messages overall and per channel.\u003c/li>\u003cli>\u003cstrong>Max per hour\u003c/strong> \u2014 a hard ceiling on unprompted messages.\u003c/li>\u003cli>\u003cstrong>Quiet hours\u003c/strong> \u2014 a UTC window where Olisar stays silent.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Eagerness \u003ccode>low\u003c/code>, confidence \u003ccode>0.8\u003c/code>, channel cooldown \u003ccode>600\u003c/code>s, quiet hours 23\u20137 \u2192 Olisar only jumps in on clearly relevant moments, at most once every 10 minutes per channel, and never overnight.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"passive-reactions\">Passive reactions\u003c/h3>\u003cp>Separately from chiming in, Olisar can add a fitting \u003cstrong>emoji reaction\u003c/strong> to a message without replying. This has its own looser gate, plus a cooldown and an hourly cap, so it stays sparse. Its \u003cstrong>confidence threshold\u003c/strong> works the same way as proactivity's: lower reacts more freely.\u003c/p>\u003cp>Reactions and replies look for opposite things. A reaction wants a joke, a bit of news, a posted picture, a win or a piece of bad luck \u2014 the messages people acknowledge without typing. \u003cstrong>Questions are never reaction candidates\u003c/strong> at any threshold: someone asking something wants an answer, and a lone \ud83d\udc4d on a question reads as the bot having misunderstood.\u003c/p>\u003ch3 id=\"silent-acknowledgments\">Silent acknowledgments\u003c/h3>\u003cp>Ask Olisar to DM someone and it does two things: sends the DM, then writes \"done\". With \u003cstrong>Silent acknowledgments\u003c/strong> on, it can react to your message instead and stop there \u2014 the same way a person would. It works after anything Olisar *does* (a DM, a post in another channel, something remembered, a reminder set), and on the messages that only need acknowledging at all: \"thanks\", \"sounds good\".\u003c/p>\u003cp>The reaction is not optional. A turn can only end in silence once the reaction has actually landed, so a bot that couldn't react \u2014 or whose DM failed \u2014 always tells you in words. Olisar will also never go quiet after looking something up: if it searched the server, the knowledge base or the web, you get what it found.\u003c/p>\u003cp>Turn it off and every turn ends in a message.\u003c/p>\u003ch3 id=\"situational-awareness\">Situational awareness\u003c/h3>\u003cp>With \u003cstrong>Status &amp; voice awareness\u003c/strong> on, Olisar can answer \"what's X playing?\" or \"who's in voice right now?\" by reading members' live Discord presence and voice state \u003cstrong>only when asked\u003c/strong>. It's never stored.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Needs a privileged intent\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Reading presence requires the \u003cstrong>Presence Intent\u003c/strong> toggle in the \u003ca href=\"https://discord.com/developers/applications\" target=\"_blank\" rel=\"noreferrer\">Discord Developer Portal\u003c/a> (your app \u2192 Bot \u2192 Privileged Gateway Intents), and the operator must enable it on the host (\u003ccode>OLISAR_ENABLE_PRESENCE_INTENT\u003c/code>). Voice-channel awareness works without it. It's \u003cstrong>off by default\u003c/strong> and disclosed in \u003ccode>/privacy\u003c/code>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"models\" hidden>\u003ch1 class=\"docs-title\">Models\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar runs entirely on \u003cstrong>free-tier\u003c/strong> models. For each kind of work there's a \u003cstrong>fallback chain\u003c/strong>: it starts at the preferred model and, if that one has hit its limit or is overloaded, it briefly parks it and drops to the next model in the list. Only if every model is unavailable does a reply fail \u2014 and then it says so in character rather than going quiet.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">About the limits\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The \"throttle\" below is Olisar's own conservative per-minute cap to stay under the free tier, not an official Google number. Real free-tier limits also include daily caps that vary by model.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"general-chat-reasoning\">General (chat &amp; reasoning)\u003c/h3>\u003cp>This chain powers conversation, \u003ccode>/ask\u003c/code>, summaries, and profiles. The \u003cstrong>Primary model\u003c/strong> on the Behavior tab sets where the chain starts.\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Throttle (req/min)\u003c/th>\u003cth>Role\u003c/th>\u003cth>Falls back to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>gemini-3.5-flash\u003c/code>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>Default \u2014 high quality, pinned\u003c/td>\u003ctd>\u003ccode>gemini-flash-latest\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-flash-latest\u003c/code>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>Newest Flash (auto-updates)\u003c/td>\u003ctd>\u003ccode>gemini-3-flash-preview\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-3-flash-preview\u003c/code>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>High quality\u003c/td>\u003ctd>\u003ccode>gemini-2.5-flash\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-2.5-flash\u003c/code>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>Solid all-rounder\u003c/td>\u003ctd>\u003ccode>gemini-3.1-flash-lite\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-3.1-flash-lite\u003c/code>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>Light\u003c/td>\u003ctd>\u003ccode>gemini-flash-lite-latest\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-flash-lite-latest\u003c/code>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>Newest Flash-Lite (auto-updates)\u003c/td>\u003ctd>\u003ccode>gemini-2.5-flash-lite\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gemini-2.5-flash-lite\u003c/code>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>Last resort, highest limit\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The default is a \u003cstrong>pinned\u003c/strong> version, not a \u003ccode>-latest\u003c/code> alias. An alias points at whatever Google ships today and the API won't say which build that is, so a change on their side could alter request validation under a running bot with no Olisar update involved. New models are adopted deliberately, in a release. The aliases stay one rung lower, where they're a useful last resort if a pinned model is retired.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Reasoning (\"thinking\")\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The newer Flash models can spend hidden \u003cstrong>thinking\u003c/strong> tokens before answering. Olisar caps that budget on the conversation path and reserves headroom for the actual reply, so it reasons on hard questions without the visible answer getting cut off. One-line jobs like welcome messages and emoji reactions skip thinking entirely to stay fast.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"images-embeddings\">Images &amp; embeddings\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Purpose\u003c/th>\u003cth>Model(s)\u003c/th>\u003cth>Limit\u003c/th>\u003cth>Fallback\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Image understanding\u003c/td>\u003ctd>\u003ccode>gemini-3.1-flash-lite\u003c/code> \u2192 \u003ccode>gemini-2.5-flash-lite\u003c/code> \u2192 \u003ccode>gemini-flash-lite-latest\u003c/code>\u003c/td>\u003ctd>15/min\u003c/td>\u003ctd>next in the list\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Image generation\u003c/td>\u003ctd>\u003ca href=\"https://developers.cloudflare.com/workers-ai/\" target=\"_blank\" rel=\"noreferrer\">Cloudflare Workers AI\u003c/a> \u2014 \u003cstrong>FLUX.1 [schnell]\u003c/strong>\u003c/td>\u003ctd>free daily allocation\u003c/td>\u003ctd>none (degrades gracefully)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Text embeddings\u003c/td>\u003ctd>\u003ccode>gemini-embedding-001\u003c/code> (768-dim)\u003c/td>\u003ctd>~100/min\u003c/td>\u003ctd>none (single model)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Why Cloudflare for image generation?\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Gemini's image-generation models are \u003cstrong>paid-only\u003c/strong> (their free quota is zero), so Olisar generates images on Cloudflare's free FLUX allocation instead. Image \u003cstrong>understanding\u003c/strong> (looking at posted images) still uses Gemini's vision models, which are free.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Under high demand\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The top models get busy first. Falling back keeps replies flowing, but if every model is busy at once you'll see slower replies or the occasional \"my mind went blank.\" It clears on its own once the limits reset.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"channels\" hidden>\u003ch1 class=\"docs-title\">Channels &amp; modes\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Each channel gets a \u003cstrong>role\u003c/strong> on the Channels tab. They're listed under their \u003cstrong>categories\u003c/strong>, in the same order as your Discord sidebar, and each row spells out what its current settings actually add up to \u2014 \"Reads, remembers and replies when addressed \u00b7 may chime in unprompted \u00b7 searchable\" \u2014 so you can read down the list without translating two dropdowns per row.\u003c/p>\u003cp>The modes:\u003c/p>\u003cul>\u003cli>\u003ccode>off\u003c/code> \u2014 ignored entirely.\u003c/li>\u003cli>\u003ccode>memory\u003c/code> \u2014 reads &amp; remembers, but never speaks.\u003c/li>\u003cli>\u003ccode>respond\u003c/code> \u2014 talks, but doesn't store history.\u003c/li>\u003cli>\u003ccode>both\u003c/code> \u2014 reads, remembers \u003cstrong>and\u003c/strong> talks.\u003c/li>\u003cli>\u003ccode>resource\u003c/code> \u2014 reference material Olisar carries into every reply (e.g. \u003ccode>#rules\u003c/code>, \u003ccode>#roles-list\u003c/code>).\u003c/li>\u003cli>\u003ccode>feed\u003c/code> \u2014 background context: only the last 3 messages are kept, and they're never summarized (e.g. \u003ccode>#announcements\u003c/code>, \u003ccode>#game-news\u003c/code>).\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Set \u003ccode>#general\u003c/code> to \u003ccode>both\u003c/code>, \u003ccode>#rules\u003c/code> to \u003ccode>resource\u003c/code>, \u003ccode>#announcements\u003c/code> to \u003ccode>feed\u003c/code>, and your private mod channel to \u003ccode>off\u003c/code>.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Forums\u003c/strong> appear in the picker too (tagged \"forum\"), and their posts inherit the forum's mode, so set a forum to \u003ccode>both\u003c/code> and Olisar reads and replies in its threads. Regular threads inherit their parent channel's mode the same way.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>resource\u003c/code> and \u003ccode>feed\u003c/code> are for \u003cstrong>text\u003c/strong> channels. Setting a forum to one of them does nothing \u2014 it won't break anything, it just has no effect. Separately, Olisar keeps a \u003cstrong>server-wide search index of every channel\u003c/strong> so it can answer \"where was that posted?\". That's independent of these per-channel modes (see \u003ca href=\"#memory\" data-doc=\"memory\">Memory\u003c/a>).\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"access\" hidden>\u003ch1 class=\"docs-title\">Access control\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Access tab decides which roles can use Olisar, in chat and via slash commands like \u003ccode>/ask\u003c/code>. For each role you choose:\u003c/p>\u003cul>\u003cli>\u003ccode>open\u003c/code> \u2014 no restriction from this role. This is the default.\u003c/li>\u003cli>\u003ccode>allowed\u003c/code> \u2014 the moment you mark \u003cstrong>any\u003c/strong> role allowed, \u003cstrong>only\u003c/strong> those roles (plus server admins) can use Olisar; everyone else is locked out.\u003c/li>\u003cli>\u003ccode>blocked\u003c/code> \u2014 that role can never use Olisar, even if it also has an allowed role.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Mark \u003ccode>@Member\u003c/code> \u003ccode>allowed\u003c/code> and leave everything else \u003ccode>open\u003c/code> \u2192 only people with \u003ccode>@Member\u003c/code> (and admins) can talk to Olisar. Or mark just \u003ccode>@Muted\u003c/code> \u003ccode>blocked\u003c/code> \u2192 everyone except muted members can use it.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Safeguards\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Server admins (Manage Server) \u003cstrong>always\u003c/strong> have access, so you can't lock yourself out, and \u003ccode>/privacy\u003c/code> and \u003ccode>/forget-me\u003c/code> stay open to everyone for data rights. DM users are gated by their roles in this server.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Require the PIN\u003c/strong> picks which of Olisar's actions have to be confirmed with the \u003ca href=\"#settings\" data-doc=\"settings\">tool PIN\u003c/a> on this server before it takes them. There's one today: \u003cstrong>For Olisar to change its own settings\u003c/strong>, which covers everything Olisar can change about itself when asked in chat \u2014 its persona and system prompt, behavior, command replies, knowledge sources, the search index, the glossary, and member impressions. Reading its settings never needs the PIN, and nothing you change in this console does either.\u003c/p>\u003cp>It starts on for every server. With no PIN set, anything switched on here is refused rather than run unchecked, and the card says so with a link to set one. One PIN entry covers the rest of that reply, so \"rename yourself and rewrite your bio\" asks once. Turning it off lets anyone who can use Olisar here make those changes, and it's recorded in the Activity log as its own entry.\u003c/p>\u003cp>This tab also carries the switches for the \u003ca href=\"#member-portal\" data-doc=\"member-portal\">Member portal\u003c/a> \u2014 the page where members manage their own
