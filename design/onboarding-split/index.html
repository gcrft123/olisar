<style>
/* Tokens: web/src/index.css :root, unchanged. */
:root {
  color-scheme: dark;
  --ui-scale: 1.1;
  zoom: var(--ui-scale);
  --vh: calc(100vh / var(--ui-scale));
  --vw: calc(100vw / var(--ui-scale));
  --dvh: calc(100dvh / var(--ui-scale));
  --bg: #020203; --bg-sidebar: #040405; --panel: #08080a; --bg-inset: #0f0f12; --input-bg: #0f0f12;
  --border: #26262a; --border-strong: #323237;
  --text: #ededee; --text-2: #9d9da7; --text-3: #7f7f8a;
  --accent: #5b9cf6; --accent-soft: rgba(91, 156, 246, 0.16);
  --primary-bg: #ededee; --primary-fg: #18181b; --primary-hover: #ffffff;
  --ok: #43cf8e; --ok-soft: rgba(67, 207, 142, 0.14); --ok-border: rgba(67, 207, 142, 0.34);
  --danger: #ff6369; --danger-soft: rgba(255, 99, 105, 0.13); --danger-border: rgba(255, 99, 105, 0.34);
  --warn: #e3a13a; --warn-soft: rgba(227, 161, 58, 0.14); --warn-border: rgba(227, 161, 58, 0.34);
  --info: #5fc4f2;
  --dc-brand: #5865f2; --dc-brand-hover: #4752e0;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --mono: var(--font-mono);
  --radius: 16px; --radius-sm: 12px; --radius-xs: 8px; --radius-pill: 999px;
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.5);
  --shadow-modal: 0 24px 70px rgba(0, 0, 0, 0.5);
  --ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --ease-out: cubic-bezier(0.2, 0.9, 0.3, 1);
  --ease-icon: cubic-bezier(0.2, 0, 0, 1);
  --dur-fast: 0.12s; --dur-mid: 0.16s; --dur-slow: 0.3s;
  --img-edge: oklch(1 0 0 / 0.1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 13.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.014em; }
::selection { background: var(--accent-soft); }
code { font-family: var(--mono); font-size: 0.92em; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); background-clip: content-box; border: 3px solid transparent; border-radius: var(--radius-pill); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ── Controls (index.css) ─────────────────────────────────────────────────── */
button {
  height: 34px; padding: 0 14px;
  font: inherit; font-weight: 550; font-size: 13px; white-space: nowrap; cursor: pointer;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
  transition: background var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out), transform 0.08s var(--ease-out),
    box-shadow var(--dur-fast) var(--ease-out);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; line-height: 1;
}
button:hover { background: var(--bg-inset); }
button:active:not(:disabled) { transform: scale(0.96); }
button:focus-visible { outline: none; box-shadow: var(--ring); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); }
button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
button.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
button.ghost:hover { background: var(--bg-inset); color: var(--text); }
button.caution { color: var(--warn); }
button.caution:hover { background: var(--warn-soft); border-color: transparent; }
button.icon-btn { width: 34px; height: 34px; padding: 0; justify-content: center; flex: none; }
.linklike {
  background: none; border: 0; padding: 0; font: inherit; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
  display: inline; height: auto; line-height: inherit; vertical-align: baseline;
}
.linklike:hover { color: var(--text); background: none; }
.linklike:active:not(:disabled) { transform: none; }

.field { margin-bottom: 17px; }
.field:last-child { margin-bottom: 0; }
.field > label, .field > .flabel { display: block; font-weight: 550; font-size: 12.5px; margin-bottom: 6px; color: var(--text); }
.field .desc { color: var(--text-2); font-size: 12px; margin: -3px 0 8px; line-height: 1.5; }
input[type=text], textarea, select {
  width: 100%; background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  font: inherit; font-size: 13.5px; outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
input[type=text], select { height: 34px; padding: 0 12px; }
textarea { padding: 8px 12px; resize: vertical; min-height: 120px; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: var(--ring); }
select { appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239d9da7' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 30px;
}
input.mono { font-family: var(--mono); font-size: 12.5px; }
/* A wrong value: the field takes the danger colour, focus ring included, until it changes. */
input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--danger) 75%, var(--border-strong)); }
input[aria-invalid="true"]:focus { border-color: var(--danger); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px color-mix(in srgb, var(--danger) 70%, transparent); }
input { caret-color: var(--accent); }

.spinner {
  width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 2px solid color-mix(in srgb, currentColor 28%, transparent);
  border-top-color: currentColor; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
.err { color: var(--danger); font-size: 12.5px; }

.callout {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 13px 15px; margin: 0 0 14px; border-radius: var(--radius);
  font-size: 13.5px; line-height: 1.6; --cc: var(--accent);
  border: 1px solid color-mix(in srgb, var(--cc) 34%, transparent);
  background: color-mix(in srgb, var(--cc) 9%, var(--panel));
  color: color-mix(in srgb, var(--cc) 22%, var(--text));
}
.callout .ic { color: var(--cc); margin-top: 2px; flex: none; display: grid; place-items: center; }
.callout-body { min-width: 0; }
.callout a { color: var(--cc); text-decoration: underline; text-underline-offset: 2px; }
.callout.tip { --cc: var(--ok); }
.callout.warning { --cc: var(--warn); }
.callout.note { --cc: var(--accent); }

.codeblock { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); overflow: hidden; margin: 0 0 12px; }
.codeblock .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 15px; border-bottom: 1px solid var(--border); }
.codeblock .file { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.codeblock pre code { font-size: inherit; color: var(--text); white-space: pre; display: block; }
.cb-copy {
  margin-left: auto; width: 30px; height: 30px; padding: 0; flex: none;
  border: none; border-radius: var(--radius-xs); background: transparent; color: var(--text-3);
}
.cb-copy:hover { color: var(--text); background: var(--bg-inset); }
.copyglyph { position: relative; display: inline-grid; place-items: center; flex: none; }
.copyglyph > svg { grid-area: 1 / 1; transition: scale var(--dur-mid) var(--ease-icon), opacity var(--dur-mid) var(--ease-icon), filter var(--dur-mid) var(--ease-icon); }
.copyglyph > svg:last-child { scale: 0.25; opacity: 0; filter: blur(4px); color: var(--ok); }
.copyglyph.on > svg:first-child { scale: 0.25; opacity: 0; filter: blur(4px); }
.copyglyph.on > svg:last-child { scale: 1; opacity: 1; filter: blur(0); }

.disclosure { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 14px; margin-bottom: 16px; }
.disclosure > summary {
  display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
  color: var(--text-2); font-size: 12.5px; font-weight: 550; user-select: none;
  padding: 3px 4px; margin: -3px -4px; border-radius: var(--radius-xs);
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary:hover { color: var(--text); }
.disclosure > summary:focus-visible { outline: none; box-shadow: var(--ring); }
.disclosure-chev { display: inline-flex; color: var(--text-3); transition: transform var(--dur-mid) var(--ease-out); }
.disclosure[open] > summary .disclosure-chev { transform: rotate(90deg); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-2); }
.badge.success { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-border); }

.btn-discord {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  background: var(--dc-brand); color: #fff; padding: 11px 20px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 14px; transition: background var(--dur-fast) var(--ease-out);
  border: 0; cursor: pointer; font-family: inherit; appearance: none; height: auto;
}
.btn-discord:hover { background: var(--dc-brand-hover); text-decoration: none; }
.btn-discord:focus-visible { outline: none; box-shadow: var(--ring); }

/* Tooltip for the icon-only settings button (overlays.tsx TooltipHost). */
.tooltip {
  position: fixed; z-index: 400; transform: translate(-50%, -100%);
  padding: 5px 9px; border-radius: var(--radius-xs); max-width: 280px;
  background: var(--panel); border: 1px solid var(--border-strong); color: var(--text);
  font-size: 11.5px; font-weight: 500; line-height: 1.3;
  box-shadow: var(--shadow-pop); pointer-events: none; animation: tip-in 0.1s var(--ease-out);
}
.tooltip.below { transform: translate(-50%, 0); }
.tooltip::after { content: ""; position: absolute; left: 50%; margin-left: -4px; width: 8px; height: 8px; background: var(--panel); transform: rotate(45deg); }
.tooltip.below::after { top: -4px; border-left: 1px solid var(--border-strong); border-top: 1px solid var(--border-strong); }
.tooltip:not(.below)::after { bottom: -4px; border-right: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }

/* ── The split ────────────────────────────────────────────────────────────── */
/* Two halves: the wizard, and the stage the form lives on. The form is decoration, so it
   gets a track of its own and never sits behind text; below the width where the wizard
   needs the whole window it's withheld entirely (and stops rendering). */
.onb { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: var(--dvh); }
.onb.no-form { grid-template-columns: 64px minmax(0, 1fr); }
.onb.no-form .onb-stage { display: none; }

/* The wizard takes its whole half: the logo and settings on top, then the step, then its
   buttons straight under it. The half scrolls as one page when a step (Deploy) runs long.
   Past 760px of content the column stops growing, so fields and cards never turn into
   hundred-character lines on a very wide window. */
.onb-pane {
  --pad: clamp(24px, calc(var(--vw) * 0.055), 88px);
  --col: calc(760px + 2 * var(--pad));
  min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable;
}
/* The step hangs from a fixed line rather than centring, so nothing above a field moves
   while the step under it grows (see DESIGN.md, Setup card). */
.onb-body { container: onb / inline-size; max-width: var(--col); padding: clamp(32px, calc(var(--dvh) * 0.17), 170px) var(--pad) 56px; }
.onb-body h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 8px; }
.onb-body .step-sub { color: var(--text-2); font-size: 14px; margin: 0 0 28px; }
.onb.no-form .onb-body { margin-inline: auto; width: 100%; }

/* The step's buttons: the primary first, the one other way out beside it. A size up from
   the console's 34px, as the sign-in screen's call to action is. */
.onb-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.onb-actions button { height: 38px; padding: 0 18px; font-size: 13.5px; }
.wiz .btn-discord.cta { width: auto; height: 38px; padding: 0 18px 0 16px; font-size: 13.5px; }

/* The stage. The form sits right of centre and runs off the window's edge. Its canvas is a
   layer the size of the window, under everything, so the form can cross to the middle of it
   on the final screen; the track stays empty and is only measured. The mask the engine
   applies keeps the dust off the wizard's half. */
.onb-stage { position: relative; min-width: 0; }
.orb-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.orb-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
@media (max-width: 1000px) {
  .onb { grid-template-columns: 64px minmax(0, 1fr); }
  .onb-stage, .orb-layer { display: none; }
  .onb.brain-on .orb-layer { display: block; }
}
.onb.no-form .orb-layer { display: none; }
@media (max-width: 560px) {
  .onb-body { padding-top: 24px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  .onb-body h1 { font-size: 22px; }
  /* A phone's column can't hold two buttons side by side: the primary takes the width and
     the other way out sits under it. */
  .onb-actions { flex-direction: column; align-items: stretch; gap: 6px; }
  .onb-actions button { width: 100%; }
}

/* ── The wizard (index.css .setup rules, minus the card) ───────────────────── */
.wiz .steps { display: grid; height: 3px; margin: 0 -3px 32px; transition: grid-template-columns var(--dur-slow) var(--ease-out); }
.wiz .steps i { position: relative; min-width: 0; overflow: hidden; }
.wiz .steps i::before, .wiz .steps i::after { content: ''; position: absolute; inset: 0 3px; border-radius: 2px; background: var(--border); }
.wiz .steps i::after { background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform var(--dur-slow) var(--ease-out); }
.wiz .steps i.on::after { transform: none; }
.wiz .err { color: var(--danger); font-size: 13px; margin-top: 14px; }
.wiz .err-block { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; margin-top: 14px; }
.wiz .err-block .err { margin-top: 0; flex: 1 1 240px; min-width: 0; }
.wiz .err-block > button { flex: none; }
.wiz .err-help { margin: 10px 0 18px; font-size: 12.5px; color: var(--text-3); }
.wiz .ok-pill { color: var(--ok); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
.wiz .act-row { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
.wiz .act-row .grow { flex: 1; min-width: 0; }
.wiz .act-row .err { margin-top: 0; }
.wiz .act-row + .field, .wiz .err-help + .field { margin-top: 22px; }
.wiz .redirect-box {
  background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-family: var(--mono); font-size: 12px; word-break: break-all;
  display: flex; align-items: center; gap: 10px; justify-content: space-between;
}
.wiz .redirect-box > span:first-child { flex: 1; min-width: 0; }
.wiz .redirect-box > :not(:first-child) { flex: none; white-space: nowrap; word-break: normal; }
.wiz .redirect-list { display: grid; gap: 8px; }
.check-line { display: flex; align-items: center; gap: 6px; min-height: 20px; font-size: 13px; color: var(--text-2); }
.check-line.ok { color: var(--ok); }
.check-line.err { color: var(--danger); }
.check-line b { font-weight: 600; }
.check-line-in { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.wiz .check-line { margin: -9px 0 16px; }
.wiz .invite-row { display: flex; align-items: center; gap: 4px; }
.wiz .invite-row .btn-discord { width: auto; height: 34px; padding: 0 16px 0 14px; gap: 8px; font-size: 13px; }
.wiz .deploy-seg { display: inline-flex; gap: 4px; padding: 3px; margin-bottom: 14px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.wiz .deploy-seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 550; border-radius: var(--radius-xs); }
.wiz .deploy-seg button.on { background: var(--panel); color: var(--text); }
/* The three hosting choices side by side, equal height; stacked again once the column is
   too narrow for three (a 1024px window, a phone). */
.wiz .mode-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@container onb (max-width: 440px) { .wiz .mode-grid { grid-template-columns: minmax(0, 1fr); } }
.wiz .mode-card {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; cursor: pointer;
  background: var(--bg-inset);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.wiz .mode-card:hover { border-color: var(--border-strong); }
.wiz .mode-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.wiz .mode-card:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--accent) inset, var(--ring); }
.wiz .mode-card b { font-size: 13.5px; }
.wiz .mode-card p { color: var(--text-2); font-size: 12px; margin: 5px 0 0; line-height: 1.4; }
.wiz .tunnel-help {
  background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-2); line-height: 1.5;
}
.wiz .tunnel-help b { display: block; color: var(--text); font-size: 13px; margin-bottom: 6px; }
.wiz .tunnel-help ol { margin: 0 0 6px; padding-left: 18px; }
.wiz .tunnel-help ol:last-child { margin-bottom: 0; }
.wiz .tunnel-help li { margin: 4px 0; }
.wiz .tunnel-help strong { color: var(--text); font-weight: 600; }
.wiz .tunnel-help code { background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
.wiz .pubkey-err { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.wiz .check-avatar { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.wiz .srv-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.wiz .srv-head h1 { margin: 0; }
.wiz .srv-head .badge { margin-left: auto; }
.wiz .signin-note { color: var(--text-2); margin: 0 0 22px; }


/* Motion: the step arrives from the side it was travelled to; arrivals inside a step fade
   up 3px; what Discord or Tailscale confirms pops. Nothing plays on first paint. */
.wiz .enter { animation: wiz-in var(--dur-slow) var(--ease-out) both; }
.wiz .enter.back { animation-name: wiz-in-back; }
@keyframes wiz-in { from { opacity: 0; transform: translateX(10px); } }
@keyframes wiz-in-back { from { opacity: 0; transform: translateX(-10px); } }
@keyframes wiz-fade { from { opacity: 0; } }
.wiz .wiz-appear { animation: wiz-appear .2s var(--ease-out) both; }
@keyframes wiz-appear { from { opacity: 0; transform: translateY(3px); } }
.wiz .wiz-pop { animation: wiz-pop .24s var(--ease-out) both; }
@keyframes wiz-pop { from { opacity: 0; transform: scale(.92); } }
@media (prefers-reduced-motion: reduce) {
  .wiz .enter, .wiz .enter.back, .wiz .wiz-appear, .wiz .wiz-pop { animation-name: wiz-fade; }
  .wiz .steps { transition: none; }
  .wiz .steps i::after { transform: none; opacity: 0; transition: opacity var(--dur-slow) var(--ease-out); }
  .wiz .steps i.on::after { opacity: 1; }
}

/* ── Settings (a stand-in for the console's SettingsModal) ─────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  animation: fade-in var(--dur-fast) var(--ease-out);
}
@keyframes fade-in { from { opacity: 0; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
.settings-modal {
  position: relative; width: min(820px, calc(var(--vw) * 0.94)); height: min(560px, calc(var(--vh) * 0.9));
  display: grid; grid-template-columns: 212px minmax(0, 1fr);
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-modal); animation: modal-in 0.22s var(--ease-out);
}
.settings-nav { background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 3px; }
.settings-nav-title { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); padding: 4px 10px 10px; }
.settings-nav-item { justify-content: flex-start; width: 100%; background: transparent; border-color: transparent; color: var(--text-2); font-size: 13.5px; font-weight: 500; padding: 8px 10px; height: auto; }
.settings-nav-item:hover { background: var(--bg-inset); color: var(--text); }
.settings-nav-item.active { background: var(--bg-inset); color: var(--text); font-weight: 600; }
.settings-body { position: relative; padding: 30px 34px; overflow-y: auto; }
.settings-body h2 { font-size: 18px; margin-bottom: 8px; }
.settings-body p { color: var(--text-2); margin: 0 0 18px; }
.settings-close { position: absolute; top: 14px; right: 14px; }
@media (max-width: 700px) {
  .modal-backdrop { padding: 0; }
  .settings-modal { width: var(--vw); height: var(--dvh); border-radius: 0; border: 0; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .settings-nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 10px 12px; }
  .settings-nav-title { display: none; }
  .settings-nav-item { width: auto; flex: none; }
}
@media (prefers-reduced-motion: reduce) { .settings-modal { animation: none; } }

/* ── The server panel (after a deploy or a connect) ─────────────────────────── */
.badge.info { color: var(--info); background: rgba(95, 196, 242, 0.14); border-color: rgba(95, 196, 242, 0.34); }
.badge.warning { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-border); }
.badge.error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
/* A state that needs saying, under the rows (server.tsx srv-hint), in the tone of its badge. */
.srv-hint { color: var(--text-2); font-size: 12.5px; line-height: 1.5; margin: -14px 0 24px; }
.srv-hint.danger { color: var(--danger); }
.srv-hint b { color: inherit; font-weight: 600; }

/* Prototype only: hold the panel in any state the real one can report, to see its form. */
.state-strip {
  position: fixed; right: 12px; bottom: 12px; z-index: 47; display: flex; align-items: center; gap: 2px;
  padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border-strong); box-shadow: var(--shadow-pop);
}
.state-strip-l { padding: 0 8px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 600; }
.state-strip button { height: 28px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-size: 12px; font-weight: 500; }
.state-strip button:hover { background: var(--bg-inset); color: var(--text); }
.state-strip button[aria-pressed="true"] { background: var(--bg-inset); color: var(--text); }
.state-strip button:active:not(:disabled) { transform: none; }
.state-strip-sep { width: 1px; height: 18px; margin: 0 4px; background: var(--border-strong); }
@media (max-width: 1000px) { .state-strip { display: none; } }
.srv .field { margin-bottom: 17px; }
.srv-redirect.leaving { animation: srv-leave 0.25s var(--ease-out) forwards; }
@keyframes srv-leave { to { opacity: 0; } }
.srv .onb-actions button:disabled { opacity: 0.55; }
/* Status rows: a title with its state beside it, then the facts under hairlines. */
.srv-v1 .srv-head .badge { margin-left: 0; }
.srv-rows { margin: 0 0 28px; border-top: 1px solid var(--border); }
.srv-rows > div {
  display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; column-gap: 16px;
  min-height: 48px; padding: 6px 0; border-bottom: 1px solid var(--border);
}
.srv-rows dt { color: var(--text-2); font-size: 12.5px; }
.srv-rows dd { margin: 0; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--text); }
.srv-rows .mono { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.srv-rows a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.srv-rows a:hover { color: var(--accent); text-decoration-color: currentColor; }
.srv-rows dd button { flex: none; height: 28px; padding: 0 10px; margin-right: -10px; font-size: 12.5px; }

@media (max-width: 560px) {
  .srv-rows > div { grid-template-columns: minmax(0, 1fr); row-gap: 2px; padding: 10px 0; }
}

/* ── The rail and the docs ─────────────────────────────────────────────────── */
/* A thin icon rail: the logo, then settings, then the docs. It sits above the docs panel,
   which slides out from behind it. */
.onb-rail {
  position: relative; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 20px 0; background: var(--bg-sidebar); border-right: 1px solid var(--border);
}
.onb-rail .brand-logo {
  width: 34px; height: 34px; margin-bottom: 30px; border-radius: var(--radius-sm); display: block; object-fit: cover;
  outline: 1px solid var(--img-edge); outline-offset: -1px;
}
.onb-rail .icon-btn { color: var(--text-2); }
.onb-rail .icon-btn:hover, .onb-rail .icon-btn.on { color: var(--text); background: var(--bg-inset); }
/* The docs glyph and the chevron that closes them share one cell and cross-fade, the way the
   copy glyph does, so the button never reflows. */
.swapglyph { position: relative; display: inline-grid; place-items: center; }
.swapglyph > svg { grid-area: 1 / 1; transition: scale var(--dur-mid) var(--ease-icon), opacity var(--dur-mid) var(--ease-icon), filter var(--dur-mid) var(--ease-icon); }
.swapglyph > svg:last-child { scale: 0.25; opacity: 0; filter: blur(4px); }
.swapglyph.on > svg:first-child { scale: 0.25; opacity: 0; filter: blur(4px); }
.swapglyph.on > svg:last-child { scale: 1; opacity: 1; filter: blur(0); }

.docs-panel {
  position: fixed; z-index: 55; top: 0; bottom: 0; left: 64px; width: min(1000px, calc(var(--vw) - 112px));
  background: #08080a; border-right: 1px solid var(--border-strong); box-shadow: var(--shadow-modal);
  transform: translateX(-100%); visibility: hidden;
  transition: transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow);
}
.docs-panel.open { transform: none; visibility: visible; transition: transform var(--dur-slow) var(--ease-out), visibility 0s; }
.docs-frame { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
@media (prefers-reduced-motion: reduce) {
  .docs-panel { transform: none; opacity: 0; transition: opacity var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); }
  .docs-panel.open { opacity: 1; transition: opacity var(--dur-slow) var(--ease-out), visibility 0s; }
  .swapglyph > svg { transition: opacity var(--dur-fast) var(--ease-out); scale: 1; filter: none; }
  .swapglyph.on > svg:first-child, .swapglyph > svg:last-child { scale: 1; filter: none; }
}

/* Tooltips beside the rail. */
.tooltip.right { transform: translate(0, -50%); }
.tooltip.right::after { left: -4.5px; top: 50%; margin: -4px 0 0; border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }

/* A phone: the rail becomes a bar across the top, and the docs take the width under it. */
@media (max-width: 560px) {
  .onb { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .onb.no-form { grid-template-columns: minmax(0, 1fr); }
  .onb-rail { flex-direction: row; gap: 4px; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--border); }
  .onb-rail .brand-logo { margin: 0 auto 0 0; }
  .docs-panel { left: 0; top: 55px; width: 100%; border-right: 0; }
}

/* ── The final screen ─────────────────────────────────────────────────────────── */
/* Running, healthy, and the console's redirect listed: the form in the middle of the window,
   the panel's title, status and controls small in its top-left corner, and memories of what
   the bot has been doing around the form. brain.js moves all of it; these are the resting
   styles. A heading focused from script shows no ring (it isn't a control). */
[tabindex="-1"]:focus { outline: none; }
.brain-hud {
  position: fixed; top: 22px; left: 22px; z-index: 50; display: grid; gap: 12px; justify-items: start;
  max-width: calc(var(--vw) - 44px); visibility: hidden;
}
.brain-hud [data-morph] { transform-origin: 0 0; }
/* brain.js writes opacity and transform on these every frame; a transition of their own on
   either would lag behind it (a button fading out from where it rests while it's meant to be
   invisible over the panel). Hover colours still ease. */
.brain-hud [data-morph], .brain-hud [data-extra], .onb-pane [data-morph], .onb-pane [data-fade], .onb-rail [data-morph] {
  transition-property: background, border-color, box-shadow, color;
}
.hud-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; }
.hud-head .brand-logo {
  width: 28px; height: 28px; border-radius: 10px; display: block; object-fit: cover; flex: none;
  outline: 1px solid var(--img-edge); outline-offset: -1px;
}
.hud-head h1 { font-size: 15px; line-height: 1.55; letter-spacing: -0.02em; overflow-wrap: anywhere; min-width: 0; }
.hud-up { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.hud-actions { display: flex; align-items: center; gap: 8px; }
.hud-actions button { height: 30px; padding: 0 12px; font-size: 12.5px; }
.hud-actions .icon-btn { width: 30px; padding: 0; color: var(--text-2); position: relative; }
.hud-actions .icon-btn:hover { color: var(--text); }
.hud-dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

/* A memory: its sphere is drawn by the engine; this is the words set inside it. The box is
   the largest a memory gets, centred on it, and only the sphere's circle takes the pointer. */
.mems { position: fixed; inset: 0; z-index: 45; margin: 0; padding: 0; list-style: none; pointer-events: none; visibility: hidden; }
.mem {
  position: absolute; left: 0; top: 0; width: 280px; height: 280px; pointer-events: none; visibility: hidden;
  will-change: transform; --d: 160px;
}
/* The button is the sphere's circle: that's all that takes the pointer. It opens the memory. */
.mem-btn {
  position: absolute; inset: 0; pointer-events: auto; cursor: pointer; outline: none;
  clip-path: circle(var(--r, 0px) at 50% 50%);
}
.mem[data-open] .mem-btn { pointer-events: none; }
/* The words fade out well inside the sphere's rim, so a long link trails off rather than
   running into the dust. */
.mem-mask {
  position: absolute; inset: 0; display: grid; place-items: center;
  -webkit-mask-image: radial-gradient(circle var(--r, 0px) at 50% 50%, #000 62%, transparent 86%);
  mask-image: radial-gradient(circle var(--r, 0px) at 50% 50%, #000 62%, transparent 86%);
}
/* Out of focus until it's looked at: soft and faded, sharp and whole when hovered or focused. */
.mem-in {
  position: relative; width: calc(var(--d) * 0.6); display: flex; flex-direction: column; align-items: center;
  gap: 5px; text-align: center; transform: scale(var(--sv, 1));
  filter: blur(0.55px); opacity: 0.66;
  transition: filter var(--dur-slow) var(--ease-out), opacity var(--dur-slow) var(--ease-out);
}
.mem[data-peek] .mem-in { filter: none; opacity: 1; }
/* A little dark under the words, so dust passing behind them doesn't speckle them. */
.mem-in::before {
  content: ""; position: absolute; inset: -24% -20%; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, rgb(2 2 3 / 0.72), rgb(2 2 3 / 0));
}
.mem-who { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.mem-who span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem-member .mem-who { flex-direction: column; gap: 7px; font-size: 12px; color: var(--text); }
.mem-member .mem-who span { max-width: 100%; }
.mem-av { flex: none; border-radius: 50%; object-fit: cover; display: block; outline: 1px solid var(--img-edge); outline-offset: -1px; }
.mem-faces { display: flex; }
.mem-faces .mem-av + .mem-av { margin-left: -7px; box-shadow: 0 0 0 2px var(--bg); }
.mem-text {
  font-size: 12px; line-height: 1.4; color: var(--text);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.mem-text b { font-weight: 600; }
/* A source's address stays on one line. One too long for it starts at the left and fades out
   on the right, inside the words' own width. */
.mem-link { max-width: 100%; overflow: hidden; font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--text); white-space: nowrap; }
.mem-link.long {
  align-self: stretch; text-align: left;
  -webkit-mask-image: linear-gradient(90deg, #000 58%, transparent 96%); mask-image: linear-gradient(90deg, #000 58%, transparent 96%);
}
.mem-ic { display: grid; place-items: center; color: var(--text-2); }
.mem-ic.ok { color: var(--ok); }
.mem-dot { display: inline-block; width: 7px; height: 7px; margin: 0 6px 1px 0; border-radius: 50%; background: var(--ok); vertical-align: middle; }
.mem-foot { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.2; color: var(--text-3); white-space: nowrap; }
/* Peeked (hovered or focused): one more line, under the rest so nothing above it moves. */
.mem-more {
  position: absolute; top: 100%; left: -10%; right: -10%; margin-top: 5px;
  font-size: 11px; line-height: 1.3; color: var(--text-2); opacity: 0;
  transition: opacity var(--dur-slow) var(--ease-out);
}
.mem[data-peek] .mem-more { opacity: 1; }
/* No ring on a memory: keyboard focus peeks it (sharper, larger, brighter), which is the cue. */
.mem-reply { --d: 184px; }
.mem-impression { --d: 172px; }
.mem-remembered, .mem-reminder, .mem-image { --d: 160px; }
.mem-glossary, .mem-status { --d: 152px; }
.mem-learned { --d: 164px; }
.mem-member { --d: 140px; }
.mem-people { --d: 156px; }
.mem-health { --d: 148px; }

/* The bot itself, in the middle of the form: its avatar, faint, filling most of the form under
   the dust, and its name across it. brain.js places both on the form and fades them in once
   the form has settled in the middle. */
.orb-face {
  position: fixed; left: 0; top: 0; z-index: -2; width: 400px; height: 400px; transform-origin: 0 0;
  pointer-events: none; opacity: 0;
}
.orb-face img {
  display: block; width: 100%; height: 100%; border-radius: 50%; opacity: 0.24; filter: blur(1.5px);
  -webkit-mask-image: radial-gradient(closest-side, #000 60%, transparent 100%);
  mask-image: radial-gradient(closest-side, #000 60%, transparent 100%);
}
.orb-name {
  position: fixed; left: 0; top: 0; z-index: 44; pointer-events: none; opacity: 0;
  font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; color: var(--text);
  text-align: center; overflow-wrap: anywhere; width: max-content;
}

/* Without WebGL2 there's no dust: the memories get hairline rings, and the form one ring. */
.orb-css { display: none; }
.onb.no-form .mem::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: calc(2 * var(--r)); height: calc(2 * var(--r));
  translate: -50% -50%; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--border-strong);
}
.onb.no-form .orb-css {
  display: block; position: fixed; left: 50%; top: 50%; z-index: -1; width: calc(var(--dvh) * 0.34); aspect-ratio: 1;
  translate: -50% -50%; border-radius: 50%; pointer-events: none; opacity: var(--brain, 0);
  box-shadow: inset 0 0 0 1px var(--border-strong), inset 0 0 60px rgb(91 156 246 / 0.08);
}

/* Prototype only: ?debug=frame rings the form and every memory where brain.js thinks they are. */
.dbg i { position: fixed; z-index: 90; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(255 99 105 / 0.8); pointer-events: none; }

/* An opened memory: its sphere comes to the middle, large, and this sits in it. The back
   button is at the sphere's upper left. */
.mem-open {
  position: fixed; left: 0; top: 0; z-index: 46; width: calc(var(--ro, 240px) * 2); height: calc(var(--ro, 240px) * 2);
  display: grid; place-items: center; pointer-events: none; opacity: 0;
}
.mem-open::before {
  content: ""; position: absolute; inset: 8%; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, rgb(2 2 3 / 0.85) 55%, rgb(2 2 3 / 0));
}
.mem-open .mem-back {
  position: absolute; left: calc(var(--ro, 240px) * 0.46 - 16px); top: calc(var(--ro, 240px) * 0.46 - 16px);
  width: 32px; height: 32px; pointer-events: auto; color: var(--text-2);
}
.mem-open .mem-back:hover, .mem-open .mem-back:focus-visible { color: var(--text); background: var(--bg-inset); }
.mem-open .mem-back:focus-visible { box-shadow: none; }
.mo-in {
  position: relative; width: calc(var(--ro, 240px) * 1.22); max-height: calc(var(--ro, 240px) * 1.32); overflow-y: auto;
  scrollbar-width: none; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.mo-in::-webkit-scrollbar { display: none; }
/* Kept narrow enough to clear the back button at the sphere's upper left. */
.mo-head { max-width: calc(var(--ro, 240px) * 1.08 - 48px); font-family: var(--font-mono); font-size: 11px; line-height: 1.3; color: var(--text-3); }
.mo-chat { align-self: stretch; display: grid; gap: 12px; text-align: left; }
.mo-msg { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.mo-msg .mem-av { width: 24px; height: 24px; margin-top: 1px; }
.mo-msg b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.4; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo-msg.bot b { color: var(--text); }
.mo-msg p { margin: 1px 0 0; font-size: 13px; line-height: 1.5; color: var(--text); }
.mo-msg:not(.bot) p { color: var(--text-2); }
.mo-who { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.mo-who span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo-text { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text); }
.mo-strong { font-weight: 600; }
.mo-status { font-size: 15px; }
.mo-meta { font-size: 12px; line-height: 1.45; color: var(--text-3); }
.mo-meta code { font-size: 11.5px; color: var(--text-2); }
.mo-url { margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.mo-pic { display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: cover; border-radius: var(--radius-sm); outline: 1px solid var(--img-edge); outline-offset: -1px; }
.mo-big { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
.mo-faces { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 220px; }
.mo-roles { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.mo-roles span { padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-inset); color: var(--text-2); font-size: 11px; font-weight: 600; }
.mo-checks { display: grid; gap: 6px; text-align: left; }
.mo-checks div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.mo-checks svg { color: var(--ok); flex: none; }
.mem-open-member .mem-av { outline: 1px solid var(--img-edge); outline-offset: -1px; }
@media (max-width: 560px) {
  .mo-in { max-height: calc(var(--ro, 240px) * 1.42); gap: 10px; }
  .mo-msg p, .mo-text { font-size: 12.5px; }
}
</style>

<script>
// ── The form ────────────────────────────────────────────────────────────────────
// One WebGL2 canvas. Every setup step has a form, written as a signed distance field, and the
// form eases from one to the next on springs, so going back halfway through a change just
// turns it around. It's drawn as dust: particles held to the surface by transform feedback
// and carried along it.
;(function () {
  'use strict'

  const COMMON = /* glsl */ `
precision highp float;
precision highp int;
uniform float uTime;
uniform int uShape0, uShape1, uShape2;
uniform vec3 uW;
uniform vec4 uVar0, uVar1, uVar2;
uniform float uPulse;
uniform float uFlow;

#define TAU 6.28318531

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdTorus(vec3 p, float R, float r) { vec2 q = vec2(length(p.xz) - R, p.y); return length(q) - r; }
float hash11(float n) { return fract(sin(n) * 43758.5453123); }
vec3 hash33(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}

// A slow, layered warp: the surface breathes without the form changing.
vec3 flow(vec3 p) {
  float t = uTime;
  vec3 q = p;
  q += uFlow * 0.050 * sin(q.yzx * 2.2 + vec3(t * 0.61, t * 0.47, t * 0.73));
  q += uFlow * 0.022 * sin(q.zxy * 4.3 + vec3(t * 0.83, t * 0.71, t * 0.57));
  return q;
}

// Where it runs. A closed pebble for this machine alone; a bead with a way through it for
// this machine, shared; for a server somewhere else, a body drifting up and away with a
// few smaller ones trailing back toward here. v.x eases between 0, 1 and 2.
float shSeed(vec3 p, float m) {
  float dLocal = sdSphere(p * vec3(1.0, 1.12, 1.0), 0.84) / 1.12;
  vec3 pt = p; pt.yz *= rot(1.35); pt.xy *= rot(-0.45);
  float dShared = smax(sdSphere(p, 0.84), -(length(pt.xz) - 0.26), 0.18);
  vec3 head = vec3(0.26, 0.3, 0.0);
  vec3 dir = normalize(vec3(-0.78, -0.58, 0.2));
  float dServer = sdSphere(p - head, 0.44);
  float along = 0.0, r = 0.44;
  for (int i = 0; i < 3; i++) {
    float rn = r * 0.52;
    along += r + rn + 0.09;
    dServer = min(dServer, sdSphere(p - head - dir * along, rn));
    r = rn;
  }
  float a = clamp(m, 0.0, 1.0), b = clamp(m - 1.0, 0.0, 1.0);
  return mix(mix(dLocal, dShared, a), dServer, b);
}

// The bot: a shell opened in six places, with something inside it now.
float shCore(vec3 p) {
  vec3 q = p; q.xy *= rot(0.6); q.yz *= rot(0.5);
  float shell = abs(length(q) - 0.88) - 0.028;
  float holes = min(min(length(q.xy), length(q.yz)), length(q.xz)) - 0.4;
  return min(smax(shell, -holes, 0.06), sdSphere(p, 0.3 + 0.06 * uPulse));
}

// Remote access: the way through opens all the way.
float shRing(vec3 p) {
  vec3 q = p; q.yz *= rot(0.95); q.xy *= rot(-0.35);
  return sdTorus(q, 0.78, 0.21);
}

// Sign-in: a band that arrives back where it left, turned over once on the way round.
// v.x broadens it once Discord lists the redirects.
float shLoop(vec3 p, float lock) {
  vec3 q = p; q.yz *= rot(0.62); q.xy *= rot(0.35);
  float a = atan(q.z, q.x);
  vec2 w = vec2(length(q.xz) - 0.66, q.y);
  w *= rot(a * 0.5 + uTime * 0.12);
  vec2 e = vec2(mix(0.26, 0.32, lock), 0.1);
  return (length(w / e) - 1.0) * min(e.x, e.y) * 0.9;
}

// The server: one body among others on a shared orbit. v.x draws them in once it joins.
float shCluster(vec3 p, float gather) {
  float d = sdSphere(p, 0.36 + 0.06 * gather);
  vec3 q = p; q.xy *= rot(0.4); q.yz *= rot(0.25);
  float rad = mix(1.02, 0.7, gather);
  float k = mix(0.04, 0.24, gather);
  for (int i = 0; i < 7; i++) {
    float fi = float(i);
    float a = fi * TAU / 7.0 + uTime * 0.17;
    vec3 c = vec3(cos(a) * rad, 0.08 * sin(a * 2.0 + fi), sin(a) * rad);
    d = smin(d, sdSphere(q - c, 0.1 + 0.08 * hash11(fi * 7.31 + 1.0)), k);
  }
  return d;
}

// The key: the surface carries waves out from one point. v.x is how strongly.
float shVoice(vec3 p, float amp) {
  float r = length(p);
  vec3 n = p / max(r, 1e-4);
  float ang = acos(clamp(dot(n, normalize(vec3(-0.55, 0.4, 0.73))), -1.0, 1.0));
  float w = sin(ang * 13.0 - uTime * 2.0) * (0.35 + 0.65 * exp(-ang * 0.8));
  return (r - 0.8 - 0.07 * amp * w) * 0.72;
}

// Deploy: one loop with no end to it, turning on its own.
float shKnot(vec3 p) {
  vec3 q = p; q.yz *= rot(1.1); q.xz *= rot(uTime * 0.18);
  float a = atan(q.z, q.x);
  vec2 w = vec2(length(q.xz) - 0.64, q.y);
  float d = 1e9;
  for (int i = 0; i < 2; i++) {
    float ang = (a + TAU * float(i)) * 1.5;
    d = min(d, length(w - 0.3 * vec2(cos(ang), sin(ang))) - 0.12);
  }
  return d * 0.7;
}

// Connecting to a server that already runs it: a small body folding into one that was
// already there. v.x is how far.
float shMerge(vec3 p, float prog) {
  float big = sdSphere(p - vec3(0.12, -0.08, 0.0), 0.64);
  vec3 c = mix(vec3(-0.9, 0.72, 0.25), vec3(-0.32, 0.26, 0.12), prog);
  return smin(big, sdSphere(p - c, 0.3), mix(0.1, 0.42, prog));
}

// Done, and the running server: one whole body. v.x scales it (0 means 1): a stopped server
// draws in on itself.
float shWhole(vec3 p, float s) { return sdSphere(p, 0.74 * (s > 0.01 ? s : 1.0)); }

// Updating: a gap sweeps up through the body and closes behind itself, as a new version rolls
// through it.
float shSweep(vec3 p) {

        gl.uniform3fv(v.uAccent, accent)

    function schedule() {

      start() { schedule() },
      set(shape, variant) { morph.set(shape, variant) },
      pulse(amount = 1) { state.pulse = Math.max(state.pulse, amount * (reduce.matches ? 0.5 : 1)) },
      energy(x) { state.flowTarget = 1 + x },
      reject() { state.jolt = reduce.matches ? 0.5 : 1 },

      // Measure the frame rate again (the layer and what's on it changed).
      requalify() { if (state.scale === 1) frames.length = 0 },
      running: () => !!raf,
    }
  }

  window.createForm = createForm
})()

    // `?quiet` holds the feed to the seeded memories (for measuring the layout).
    const quiet = new URLSearchParams(location.search).has('quiet')
    const schedule = () => { if (!quiet) timer = setTimeout(() => { push(next()); schedule() }, 6000 + Math.random() * 6000) }
    return {
      start() {
        if (!seeded) { seed(); seeded = true }
        if (!timer) schedule()
        if (!beat) beat = setInterval(() => { health.at = Date.now(); emit('beat', health) }, 30000)
      },
      stop() { clearTimeout(timer); timer = 0; clearInterval(beat); beat = 0 },
      items: () => items,
      health: () => health,
      add(kind) { push(next(kind)) },
      beat() { health.at = Date.now(); emit('beat', health) },
      subscribe(fn) { subs.add(fn); return () => subs.delete(fn) },
    }
  }

  // Each kind's size on screen: the diameter of its sphere, in layout px, at a 900px window.
  const SIZE = { reply: 184, impression: 172, remembered: 160, reminder: 160, image: 160, glossary: 152, learned: 164, status: 152, member: 140, people: 156, health: 148 }

  // ── The controller ──────────────────────────────────────────────────────────────
  // One clock, p, runs from 0 (the stats screen) to 1 (the final screen) and back, and every
  // piece of the change reads its own stretch of it, so turning round halfway is just the
  // clock running the other way.
  function createBrain({ activity, open: startOpen }) {
    const $ = (sel) => document.querySelector(sel)
    const $$ = (sel) => document.querySelectorAll(sel)
    const subs = new Set()
    const notify = () => subs.forEach((fn) => fn())
    let form = null, detachHook = null
    let p = startOpen ? 1 : 0, target = p, frozen = null
    let open = false                        // memories are out
    let view = { w: innerWidth / zoomOf(), h: innerHeight / zoomOf() }
    let slot = null, hudRect = null, stripRect = null
    let pairs = []
    const bodies = new Map()
    const slots = new Array(12).fill(null)  // the engine's sphere for each body, kept stable
    let order = []
    let lastStep = 0, raf = 0, applied = -1, time = 0
    // One memory can be opened: it comes to the middle, large, with its context, while the form
    // and the rest draw back. `openness` is how far that has got (0 to 1).
    let openId = null, shownId = null, openness = 0
    let debug = new URLSearchParams(location.search).get('debug') === 'frame'

    const Z = () => zoomOf()
    function measure() {
      view = { w: innerWidth / Z(), h: innerHeight / Z() }
      const s = $('.onb-stage')
      slot = s && s.getClientRects().length ? rectL(s) : null
      const box = (q) => { const el = $(q); return el && el.getClientRects().length ? rectL(el) : null }
      hudRect = box('.brain-hud'); stripRect = box('.state-strip')
      $('.mems')?.style.setProperty('--sv', scaleV().toFixed(3))
      applied = -1
    }
    window.addEventListener('resize', () => { measure(); if (target !== p) measurePairs(); kick() })

    // ── Framing ──
    function stageFraming(s, v) {
      const x = s.x - v.x, y = s.y - v.y
      return { cx: x + s.w - 0.2 * s.h, cy: y + s.h / 2, r: 0.45 * s.h, x0: x, x1: x + 0.3 * s.w, fy: 0.1 * s.h }
    }
    function brainFraming(v) {
      const r0 = Math.min(0.23 * v.h, 0.3 * v.w)
      const hud = hudRect
      const cy = Math.max(v.h / 2, hud ? hud.y + hud.h + 0.74 * r0 + 48 : 0)
      // An opened memory takes the middle; the form draws back behind it.
      return { cx: v.w / 2, cy: Math.min(cy, v.h - 0.74 * r0 - 24), r: r0 * (1 - 0.45 * openness), x0: -2, x1: -1, fy: 0.02 * v.h }
    }
    // The form's resting radius on the final screen, whatever is open.
    const coreR = () => 0.74 * Math.min(0.23 * view.h, 0.3 * view.w)
    function framingFor(v) {
      const Fb = brainFraming(v)
      if (!slot || slot.w < 2) return Fb
      const Fs = stageFraming(slot, v)
      if (reduce.matches) return p < 0.5 ? Fs : Fb
      const e = inOut(seg(p, 0.1, 0.85))
      const F = {}
      for (const k in Fb) F[k] = lerp(Fs[k], Fb[k], e)
      return F
    }
    const orbFrame = () => framingFor({ x: 0, y: 0, w: view.w, h: view.h })

    // ── The shared pieces: title, badge, the two buttons, and the logo ──
    // The corner's copies start exactly over the stats screen's, take over from them in a
    // few frames, and travel; the stats screen's own never move (the wizard's half clips).
    const WIN = { logo: [0, 0.45], title: [0.1, 0.68], badge: [0.1, 0.68], console: [0.14, 0.72], power: [0.14, 0.72] }
    function measurePairs() {
      const rail = $('.onb-rail')
      const saved = rail ? rail.style.transform : ''
      if (rail) rail.style.transform = ''
      pairs = []
      for (const hud of $$('.brain-hud [data-morph]')) {
        const key = hud.getAttribute('data-morph')
        const stats = $(`.onb-pane [data-morph="${key}"]`) || $(`.onb-rail [data-morph="${key}"]`)
        if (!stats || !stats.getClientRects().length) continue
        const t = hud.style.transform
        hud.style.transform = ''
        pairs.push({ key, hud, stats, A: rectL(stats), B: rectL(hud), win: WIN[key] || [0.1, 0.7] })
        hud.style.transform = t
      }
      if (rail) rail.style.transform = saved
      applied = -1
    }

    function applyTransition() {
      if (applied === p) return
      applied = p
      const rm = reduce.matches
      const root = $('#onb')
      root?.classList.toggle('brain-on', p > 0 || target > 0)
      root?.classList.toggle('brain-full', p >= 1)
      root?.style.setProperty('--brain', p.toFixed(3))
      // The stats screen's details: gone in the first third.
      const out = rm ? smooth(seg(p, 0.15, 0.6)) : inOut(seg(p, 0, 0.3))
      for (const el of $$('.onb-pane [data-fade]')) {
        el.style.opacity = p > 0 ? String(1 - out) : ''
        el.style.transform = p > 0 && !rm ? `translateX(${(-12 * out).toFixed(2)}px)` : ''
      }
      const rail = $('.onb-rail')
      if (rail) {
        const r = rm ? smooth(seg(p, 0.15, 0.6)) : inOut(seg(p, 0.05, 0.45))
        rail.style.transform = p > 0 && !rm ? `translateX(${(-100 * r).toFixed(2)}%)` : ''
        rail.style.opacity = p > 0 && rm ? String(1 - r) : ''
      }
      const moving = p > 0 && p < 1
      if (moving) {
        const rail = $('.onb-rail'), saved = rail ? rail.style.transform : ''
        if (rail) rail.style.transform = ''
        for (const q of pairs) {
          if (!q.stats.isConnected) {
            const el = $(`.onb-pane [data-morph="${q.key}"]`) || $(`.onb-rail [data-morph="${q.key}"]`)
            if (el) q.stats = el
          }
          if (q.stats.isConnected && q.stats.getClientRects().length) q.A = rectL(q.stats)
        }
        if (rail) rail.style.transform = saved
      }
      for (const q of pairs) {
        if (!q.hud.isConnected || !q.stats.isConnected) continue
        const [a, b] = q.win
        // Text scales by its height (the two sizes share proportions); the buttons don't
        // quite, so they meet halfway (the mean of the two ratios, centred) and hand over in
        // a few frames: a longer cross-fade shows two sizes of the same words.
        const btn = q.key === 'console' || q.key === 'power'
        const swap = rm ? smooth(seg(p, 0.2, 0.8)) : seg(p, a, a + 0.03)
        const e = rm ? 1 : inOut(seg(p, a + 0.02, b))
        q.stats.style.opacity = p > 0 ? String(1 - swap) : ''
        const s0 = btn ? Math.sqrt((q.A.w / Math.max(1, q.B.w)) * (q.A.h / Math.max(1, q.B.h))) : q.A.h / Math.max(1, q.B.h)

        const tx = q.A.x + q.A.w / 2 - (q.B.x + (q.B.w * s0) / 2), ty = q.A.y + q.A.h / 2 - (q.B.y + (q.B.h * s0) / 2)
        const s1 = s0 + (1 - s0) * e
        q.hud.style.transform = e < 1 ? `translate(${(tx * (1 - e)).toFixed(2)}px, ${(ty * (1 - e)).toFixed(2)}px) scale(${s1.toFixed(4)})` : ''
        q.hud.style.opacity = String(swap)
      }

      for (const el of $$('.brain-hud [data-extra]')) el.style.opacity = String(extra)
      // Where there's no form on the stats screen (narrow, or reduced motion), the form's
      // layer fades out and in rather than the form travelling.
      const layer = $('.orb-layer')
      if (layer) {
        const narrow = !slot || slot.w < 2
        layer.style.opacity = narrow ? String(smooth(seg(p, 0.25, 0.75))) : rm ? String(Math.abs(2 * p - 1)) : ''
      }
      const pane = $('.onb-pane'), hud = $('.brain-hud'), mems = $('.mems')
      const statsGone = p >= 1 && target === 1, brainGone = p <= 0 && target === 0
      if (pane) pane.style.visibility = statsGone ? 'hidden' : ''
      if (rail) rail.style.visibility = statsGone ? 'hidden' : ''
      if (hud) hud.style.visibility = brainGone ? 'hidden' : 'visible'
      if (mems) mems.style.visibility = brainGone ? 'hidden' : 'visible'
    }

    // Keyboard focus follows the change: to the same control on the other side, or to the
    // other side's heading when that control can't take it (Stop turns into Working…).
    function moveFocus(toBrain, a) {
      const from = toBrain ? a?.closest?.('.onb-pane, .onb-rail') : a?.closest?.('.brain-hud, .mems')
      if (!from) return
      const key = a.closest('[data-morph]')?.getAttribute('data-morph')
      const side = toBrain ? '.brain-hud' : '.onb-pane'
      let el = key && ($(`${side} [data-morph="${key}"]`) || (!toBrain && $(`.onb-rail [data-morph="${key}"]`)))
      if (!el || el.disabled || el.tagName === 'IMG') el = $(`${side} h1`)
      el?.focus({ preventScroll: true })
    }
    let lastBlur = null
    document.addEventListener('focusout', (e) => { lastBlur = { el: e.target, at: performance.now() } })
    function setInert(toBrain) {
      const set = (sel, v) => { const el = $(sel); if (el) el.inert = v }
      set('.onb-pane', toBrain); set('.onb-rail', toBrain); set('.brain-hud', !toBrain); set('.mems', !toBrain)
    }

    // ── Memories ──
    const capacity = () => clamp(Math.floor((view.w * view.h) / 118000), 3, 8)
    const scaleV = () => clamp(Math.min(view.h / 818, view.w / 700), 0.72, 1.15)
    function visibleIds() {
      const list = activity.items().slice(0, capacity()).map((m) => m.id)
      return new Set(['health', ...list])
    }
    const itemFor = (id) => (id === 'health' ? activity.health() : activity.items().find((m) => m.id === id))
    // Where memories rest: all on one ring round the form, a wide ellipse, centred on it
    // whatever their sizes, with the same straight-line gap between neighbours' edges. Only the
    // stretch of ring where a memory would overlap the corner cluster is left out, and with
    // nothing in the way the ring closes on itself. They keep their order round it; a new one
    // goes in the widest gap.
    function ellipse() {
      return [clamp((1.05 * view.w) / view.h, 0.9, 1.9), clamp((0.85 * view.h) / view.w, 1, 1.6)]
    }
    const restR = (b) => ((SIZE[b.kind] || 150) / 2) * scaleV()
    const openR = () => Math.min(0.29 * view.h, (view.w < 560 ? 0.47 : 0.44) * view.w, 280)
    const TAU = Math.PI * 2
    const wrap = (a) => ((a % TAU) + TAU) % TAU
    const turnTo = (a, b) => wrap(b - a + Math.PI) - Math.PI   // shortest signed angle from a to b
    // How far out the ring sits along the ellipse's short axis: past the form (or an opened
    // memory) by the largest memory's size.
    function ringD() {
      const shrink = lerp(1, 0.55, openness)
      return lerp(coreR(), openR(), openness) + (SIZE.reply / 2) * scaleV() * shrink + lerp(30, 40, openness)
    }
    let arcIn = '', arcCache = null
    function arc(F) {
      const [sx, sy] = ellipse(), d = ringD(), hud = hudRect
      const inKey = `${sx.toFixed(3)}|${sy.toFixed(3)}|${d.toFixed(1)}|${F.cx.toFixed(1)}|${F.cy.toFixed(1)}|${hud ? `${hud.x | 0},${hud.y | 0},${hud.w | 0},${hud.h | 0}` : ''}`
      if (inKey === arcIn && arcCache) return arcCache
      arcIn = inKey
      // Where round the ring a full-size memory would touch the corner cluster.
      let lo = null, cut = 0
      if (hud) {
        const K = 360, pad = 18, r = (SIZE.reply / 2) * scaleV() * lerp(1, 0.55, openness)
        const hit = []
        for (let i = 0; i < K; i++) {
          const t = ((i + 0.5) * TAU) / K
          const x = F.cx + d * sx * Math.cos(t), y = F.cy + d * sy * Math.sin(t)
          const ex = x - clamp(x, hud.x - pad, hud.x + hud.w + pad), ey = y - clamp(y, hud.y - pad, hud.y + hud.h + pad)
          hit.push(Math.hypot(ex, ey) < r)
        }
        const free = hit.indexOf(false)
        if (free >= 0 && hit.includes(true)) {
          let run = 0, runStart = 0, best = 0, bestStart = 0
          for (let k = 1; k <= K; k++) {
            const i = (free + k) % K
            if (hit[i]) { if (!run) runStart = i; run++; if (run > best) { best = run; bestStart = runStart } } else run = 0
          }
          lo = (bestStart * TAU) / K; cut = (best * TAU) / K
        }
      }
      const closed = lo == null
      // A closed ring's seam is on the corner's side, so the order reads round from there.
      const seam = hud ? Math.atan2(hud.y + hud.h / 2 - F.cy, hud.x + hud.w / 2 - F.cx) : -2.5
      const start = closed ? seam : lo + cut, span = TAU - cut
      const K = 240, th = new Float32Array(K + 1), acc = new Float32Array(K + 1)
      let total = 0
      for (let i = 0; i <= K; i++) {
        th[i] = start + (span * i) / K
        if (i) { const t = th[i] - span / K / 2; total += Math.hypot(sx * Math.sin(t), sy * Math.cos(t)) * (span / K) }
        acc[i] = total
      }
      const theta = (u) => {
        const want = clamp(u, 0, 1) * total
        let a = 1, b = K
        while (a < b) { const mid = (a + b) >> 1; if (acc[mid] < want) a = mid + 1; else b = mid }
        return th[a - 1] + (th[a] - th[a - 1]) * ((want - acc[a - 1]) / Math.max(1e-6, acc[a] - acc[a - 1]))
      }
      // Where along the ring (0 to 1) an angle falls; inside the left-out stretch, its nearer end.
      const frac = (t) => {
        let rel = wrap(t - start)
        if (!closed && rel > span) rel = rel - span < (TAU - span) / 2 ? span : 0
        const f = (rel / span) * K, i = Math.min(K - 1, Math.floor(f))
        return (acc[i] + (acc[i + 1] - acc[i]) * (f - i)) / total
      }
      arcCache = { key: `${inKey}|${start.toFixed(3)}|${span.toFixed(3)}`, theta, frac, sx, sy, d, closed }
      return arcCache
    }
    function ringPoint(F, th) {
      const A = arc(F)
      return [F.cx + A.d * A.sx * Math.cos(th), F.cy + A.d * A.sy * Math.sin(th)]
    }
    // The ring's spacing: the straight-line gap between neighbours' edges is the same all the way
    // round (plus half of it at either end of an open ring). The gap is found by bisection, each
    // next centre by bisection along the ellipse. Cached until the ring or its sizes change.
    let placeKey = '', placed = []
    function chain(A, radii) {
      const key = `${A.key}|${radii.map((r) => r.toFixed(1)).join(',')}`
      if (key === placeKey) return placed
      const n = radii.length, d = A.d
      const pt = (u) => { const t = A.theta(Math.min(u, 1)); return [d * A.sx * Math.cos(t), d * A.sy * Math.sin(t)] }
      // The next centre at a straight-line distance from this one. The distance only grows over
      // less than half a ring, so the search stays within that (on a closed ring the far end
      // comes back round to the start).
      const next = (u0, dist) => {
        const [x0, y0] = pt(u0), cap = Math.min(1, u0 + 0.45), [xc, yc] = pt(cap)
        if (Math.hypot(xc - x0, yc - y0) < dist) return 2
        let lo = u0, hi = cap
        for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2, [x, y] = pt(mid); if (Math.hypot(x - x0, y - y0) < dist) lo = mid; else hi = mid }
        return hi
      }
      const run = (g) => {
        const us = []
        let u = A.closed ? 0 : next(0, radii[0] + g / 2)
        us.push(u)
        for (let i = 1; i < n && u <= 1; i++) { u = next(u, radii[i - 1] + radii[i] + g); us.push(u) }
        const tail = u > 1 ? 2 : next(u, A.closed ? radii[n - 1] + radii[0] + g : radii[n - 1] + g / 2)
        return [us, tail]
      }
      let us
      if (!n) us = []
      else if (n === 1 || run(0)[1] > 1) {

        us = radii.map((_, i) => (A.closed ? i / n : (i + 0.5) / n))
      } else {
        let lo = 0, hi = 600
        for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2; if (run(mid)[1] > 1) hi = mid; else lo = mid }

    }
    // Target angles for the ring's memories, in their order. An open ring spaces them between its
    // ends. A closed one can sit anywhere round, so it's laid from the first memory, turned to
    // sit as near as it can to where they all are, and laid again from there (turning a laid
    // ring would spoil its gaps, since the ellipse bends differently further round).
    function placeRing(A, radii, cur) {

      const n = radii.length
      if (n < 2) return cur.slice()
      const d = A.d
      const pt = (t) => [d * A.sx * Math.cos(t), d * A.sy * Math.sin(t)]
      const next = (t0, dist, limit) => {
        const [x0, y0] = pt(t0), cap = Math.min(limit, t0 + 0.9 * Math.PI), [xc, yc] = pt(cap)
        if (Math.hypot(xc - x0, yc - y0) < dist) return Infinity
        let lo = t0, hi = cap
        for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2, [x, y] = pt(mid); if (Math.hypot(x - x0, y - y0) < dist) lo = mid; else hi = mid }
        return hi
      }
      const run = (t0, g) => {
        const ts = [t0]
        let t = t0
        for (let i = 1; i < n; i++) { t = next(t, radii[i - 1] + radii[i] + g, t0 + TAU); if (!isFinite(t)) return [ts, Infinity]; ts.push(t) }
        return [ts, next(t, radii[n - 1] + radii[0] + g, t0 + TAU)]
      }
      const lay = (t0) => {
        if (!(run(t0, 0)[1] <= t0 + TAU)) return radii.map((_, i) => t0 + (TAU * i) / n)
        let lo = 0, hi = 600
        for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2; if (run(t0, mid)[1] <= t0 + TAU) lo = mid; else hi = mid }
        return run(t0, lo)[0]
      }
      const first = lay(cur[0])
      let c = 0, sn = 0
      first.forEach((t, i) => { const a = turnTo(t, cur[i]); c += Math.cos(a); sn += Math.sin(a) })
      return lay(cur[0] + Math.atan2(sn, c))
    }
    function pickTheta(F) {
      const A = arc(F)
      const us = [...bodies.values()].filter((b) => !b.leaving).map((b) => A.frac(b.th)).sort((a, c) => a - c)
      if (!us.length) return A.theta(0.5)
      let best = 0.5, widest = -1
      if (A.closed) {

          if (b - a > widest) { widest = b - a; best = ((a + b) / 2) % 1 }
        }

      const pts = [0, ...us, 1]
      for (let i = 0; i < pts.length - 1; i++) {

        if (g > widest) { widest = g; best = i === 0 ? pts[1] / 2 : i === pts.length - 2 ? (pts[i] + 1) / 2 : (pts[i] + pts[i + 1]) / 2 }
      }
      return A.theta(best)
    }
    function spawn(id, delay) {
      const F = orbFrame(), item = itemFor(id)
      if (!item) return
      const th = pickTheta(F)
      const R = 0.74 * F.r
      const slot = slots.indexOf(null)
      if (slot < 0) return
      const [hx, hy] = ringPoint(F, th)
      const b = {
        id, kind: item.kind, th, slot, seed: Math.random(), ph: Math.random() * 6.28,
        x: F.cx + R * 0.82 * Math.cos(th), y: F.cy + R * 0.82 * Math.sin(th), vx: 0, vy: 0, hx, hy,
        r: 12, act: 0, actT: 0, releaseAt: performance.now() + delay, released: false,
        peek: 0, peekT: 0, pinned: false, ripple: 0, text: 0, node: null, rank: 0, ov: 0, ovT: 0, isOpen: false,
      }

    }
    function reorder() {

    }
    function syncBodies(now, releaseGap = 90, thinking = true) {
      if (!open) return

      let changed = false, i = 0

        const item = itemFor(id)
        const reply = thinking && item?.kind === 'reply' && releaseGap === 0
        const b = spawn(id, reply ? 1000 : releaseGap * i)
        if (b && reply) { b.thinking = true; form?.energy(0.55) }
        i++; changed = true
      }
      if (changed) reorder()
    }
    function openMemories(intro) {
      if (open) return
      open = true
      activity.start()
      // Newest first, one after another.
      const vis = [...visibleIds()]
      vis.forEach((id, i) => { if (!bodies.has(id)) spawn(id, (intro ? 1400 : 0) + i * (intro ? 220 : 90)) })

    }
    function closeMemories() {
      if (!open) return
      open = false
      activity.stop()

      const now = performance.now()
