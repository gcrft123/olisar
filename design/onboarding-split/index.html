 data. Those roles govern who can *use* Olisar; the portal governs what someone can see and delete about themselves.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"member-portal\" hidden>\u003ch1 class=\"docs-title\">Member portal\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Everything above is a console for \u003cstrong>admins\u003c/strong>. The member portal is the other side of it: a page where any member of your server can sign in with Discord and see what Olisar has stored about *them* \u2014 and correct it, export it, or delete it. It shows each person only their own data.\u003c/p>\u003cp>Turn it on from the Access tab.\u003c/p>\u003ch3 id=\"what-a-member-sees\">What a member sees\u003c/h3>\u003cul>\u003cli>\u003cstrong>How it sees you\u003c/strong> \u2014 the private characterization Olisar writes from someone's messages. Off by default; see the warning below.\u003c/li>\u003cli>\u003cstrong>What it remembers\u003c/strong> \u2014 every durable fact, each with a link back to the message it came from, and a delete button on each one. This is the part \u003ccode>/forget-me\u003c/code> can't do: it erases everything or nothing.\u003c/li>\u003cli>\u003cstrong>What it may keep\u003c/strong> \u2014 switches for remembering, search indexing, and DMs, plus a \u003cstrong>pause\u003c/strong> that expires on its own after 24 hours or 7 days.\u003c/li>\u003cli>\u003cstrong>Waiting on\u003c/strong> \u2014 their pending reminders, including the ones Olisar set itself after they mentioned a date, which until now had no surface at all.\u003c/li>\u003cli>\u003cstrong>Export or erase\u003c/strong> \u2014 the whole lot as a JSON file, or the same wipe \u003ccode>/forget-me\u003c/code> performs.\u003c/li>\u003c/ul>\u003cp>Figures in the opening sentence are clickable: each one opens a breakdown of where it comes from.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Impressions are a separate choice\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"Show each member their impression\" is a \u003cstrong>second\u003c/strong> toggle, off even when the portal is on. That text is written by the model from someone's messages, and it can be unflattering or simply wrong. Read a few on the Members tab before you decide to show them.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Needs remote access\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The console is only reachable from the operator's machine until \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a> is on, so the portal can't be enabled without it \u2014 members would have no address to open. The toggle stays disabled, and the API refuses it too.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">How members find it\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Once the portal is open, \u003ccode>/privacy\u003c/code> starts including a link to it. Nobody finds a page nothing links to, and \u003ccode>/privacy\u003c/code> is the command whose whole job is explaining what Olisar keeps. You can reword that text on the Command replies tab.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"replies\" hidden>\u003ch1 class=\"docs-title\">Command replies\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Command replies tab lets you rewrite the exact text Olisar sends, for each slash command and for its fixed conversational fallbacks. Leave a field blank to use the built-in default, and use the \u003ccode>{placeholders}\u003c/code> shown where available.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Keep it on-voice\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>This is the easy way to make every system message sound like your Olisar without touching the persona. A blank field always falls back to the sensible default, and a broken template silently reverts too.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"every-customizable-message\">Every customizable message\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>When it's sent\u003c/th>\u003cth>Placeholders\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/ping\u003c/code>\u003c/td>\u003ctd>reply to \u003ccode>/ping\u003c/code>\u003c/td>\u003ctd>\u003ccode>{latency}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar watch\u003c/code>\u003c/td>\u003ctd>confirms it's now reading a channel\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar unwatch\u003c/code>\u003c/td>\u003ctd>confirms it stopped\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar status\u003c/code>\u003c/td>\u003ctd>reports a channel's mode\u003c/td>\u003ctd>\u003ccode>{mode}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar learn-url\u003c/code>\u003c/td>\u003ctd>queued a page\u003c/td>\u003ctd>\u003ccode>{url}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar learn-site\u003c/code>\u003c/td>\u003ctd>queued a crawl\u003c/td>\u003ctd>\u003ccode>{url}\u003c/code>, \u003ccode>{depth}\u003c/code>, \u003ccode>{max_pages}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar learn-doc\u003c/code>\u003c/td>\u003ctd>queued a document\u003c/td>\u003ctd>\u003ccode>{filename}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/forget-me\u003c/code>\u003c/td>\u003ctd>confirms deletion\u003c/td>\u003ctd>\u003ccode>{messages}\u003c/code>, \u003ccode>{facts}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/forget-me\u003c/code> (opt-out line)\u003c/td>\u003ctd>confirms it stopped recording you\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/dm-indexing\u003c/code>\u003c/td>\u003ctd>DM saving toggled\u003c/td>\u003ctd>\u003ccode>{state}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/olisar proactive\u003c/code>\u003c/td>\u003ctd>proactivity toggled\u003c/td>\u003ctd>\u003ccode>{state}\u003c/code>, \u003ccode>{level}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/privacy\u003c/code>\u003c/td>\u003ctd>the privacy explainer\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>When rate-limited\u003c/strong>\u003c/td>\u003ctd>every model is busy\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>When it draws a blank\u003c/strong>\u003c/td>\u003ctd>a reply came back empty\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>When access is denied\u003c/strong>\u003c/td>\u003ctd>a role-gated user is refused\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>When a tool needs the PIN\u003c/strong>\u003c/td>\u003ctd>a gated tool call is waiting on the \u003ca href=\"#settings\" data-doc=\"settings\">PIN\u003c/a>\u003c/td>\u003ctd>\u003ccode>{tool}\u003c/code>, \u003ccode>{seconds}\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Set the \u003cstrong>When it draws a blank\u003c/strong> message to \"\u2026lost my train of thought, say that again?\" to keep the fallback in character.\u003c/p>\u003c/div>\u003c/div>\u003cp>Whatever you write for \u003cstrong>When it draws a blank\u003c/strong>, Olisar attaches a \u003cstrong>Report this\u003c/strong> button to it when \u003ca href=\"#remote\" data-doc=\"remote\">remote access\u003c/a> is on, so the person it happened to can send you the failure with its logs \u2014 see \u003ca href=\"#settings\" data-doc=\"settings\">Feedback\u003c/a>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"keys\" hidden>\u003ch1 class=\"docs-title\">API keys\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The API keys tab is where you give Olisar its own keys for the outside services it uses. The \u003ca href=\"#hosting\" data-doc=\"hosting\">setup wizard\u003c/a> asks only for the Gemini key; the rest are added here, any time.\u003c/p>\u003cp>Unlike almost everything else in this console, keys are \u003cstrong>not per server\u003c/strong>: one set powers every server on this install. Changing a key here changes it everywhere Olisar runs.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Built for handing off\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>This is how you give Olisar to someone else: they never touch a config file or the server, they just open the console and paste their own keys.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"the-two-providers\">The two providers\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Service\u003c/th>\u003cth>Powers\u003c/th>\u003cth>Required?\u003c/th>\u003cth>Where to get it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Google Gemini\u003c/strong>\u003c/td>\u003ctd>everything Olisar says \u2014 chat, memory, summaries, image understanding\u003c/td>\u003ctd>\u003cstrong>Yes\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noreferrer\">Google AI Studio \u2192 Get API key\u003c/a> (free tier)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Cloudflare Workers AI\u003c/strong>\u003c/td>\u003ctd>image \u003cstrong>generation\u003c/strong> (FLUX) \u2014 needs an API token \u003cstrong>and\u003c/strong> an account ID\u003c/td>\u003ctd>Optional\u003c/td>\u003ctd>Cloudflare's \u003ca href=\"https://dash.cloudflare.com/?to=/:account/ai/workers-ai\" target=\"_blank\" rel=\"noreferrer\">Workers AI page\u003c/a> \u2192 \u003cstrong>Use REST API\u003c/strong> \u2192 \u003cstrong>Create a Workers AI API Token\u003c/strong>; the account ID is on the same page\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Without the Cloudflare keys, image generation is simply off (Olisar says it can't make pictures). See \u003ca href=\"#models\" data-doc=\"models\">Models\u003c/a> for the full breakdown of what each key powers. The Star Citizen extension's optional UEX token is on \u003ca href=\"#extensions\" data-doc=\"extensions\">that extension's page\u003c/a>, since nobody without the extension needs it.\u003c/p>\u003cp>Each field shows whether its key is \u003cstrong>Saved\u003c/strong>, \u003cstrong>From environment\u003c/strong> or \u003cstrong>Not set\u003c/strong>, and the trash icon removes a saved one. Olisar also checks each key with its service, the one you've typed or else the saved one, and says whether it \u003cstrong>Works\u003c/strong>. If a Cloudflare token can see its own account, the account ID fills itself in. Without a Gemini key, Olisar can't reply until you add one.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Handle keys with care\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Once saved, a key is never sent back to the browser: the field stays blank and only shows its status. Keys are stored in plain text in Olisar's local database on the operator's machine, so keep that machine and its database private.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Operator only\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Only the \u003cstrong>operator\u003c/strong> sees this tab: the account that owns the bot's Discord application, or one on its allowlist. Keys are shared by every server the bot is in, so Manage Server on one of them isn't enough to read or change them.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"knowledge\" hidden>\u003ch1 class=\"docs-title\">Knowledge base &amp; glossary\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Knowledge tab holds two different things Olisar can draw on.\u003c/p>\u003ch3 id=\"knowledge-base\">Knowledge base\u003c/h3>\u003cp>Documents and websites you deliberately teach it, which it draws on when answering, in its own voice, without tacking on a source tag (only \u003cstrong>web search\u003c/strong> results are cited).\u003c/p>\u003cp>How it works, end to end:\u003c/p>\u003cul>\u003cli>You add a \u003cstrong>source\u003c/strong> \u2014 a single page (\u003ccode>learn-url\u003c/code>), a crawled site (\u003ccode>learn-site\u003c/code>), or an uploaded document (\u003ccode>learn-doc\u003c/code>).\u003c/li>\u003cli>Olisar fetches the text and splits it into ~500-word \u003cstrong>passages\u003c/strong>, indexing each one by meaning rather than by keyword, so a question finds the right passage even when it shares no words with it.\u003c/li>\u003cli>When someone asks something, it pulls the closest passages and folds them into its answer in its own words (no source tag \u2014 only web-search answers are cited).\u003c/li>\u003cli>Reading a source happens in the background, and it's deliberately slowed to stay inside the free quota, so a big source takes a little while to become searchable. Check progress with \u003ccode>/olisar sources\u003c/code>.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Bigger isn't better\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Every page Olisar reads costs quota. Large crawls cost more, take longer to become searchable, and dilute results with low-value pages (nav bars, changelogs). A focused 25-page crawl of the pages that matter usually beats a 200-page crawl of a whole site.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Point a crawl at a \u003cstrong>specific docs section\u003c/strong> (a subpath) with low depth, or add a few small sources, rather than one giant one. Crawling respects \u003ccode>robots.txt\u003c/code>, so some sites (or pages) may be off-limits.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"keeping-a-source-current\">Keeping a source current\u003c/h3>\u003cp>A page you taught Olisar last month is a page that may have changed since. Every web source carries a \u003cstrong>Re-read\u003c/strong> setting \u2014 \u003cstrong>Never\u003c/strong> by default, or anything from hourly to monthly \u2014 and Olisar reads it again on that schedule in the background, no different from the first read.\u003c/p>\u003cp>Re-reading is cheap by design. Olisar compares what it finds against the passages it already holds and only indexes the ones that actually changed, so a weekly re-read of a page nobody edited costs \u003cstrong>nothing\u003c/strong> against your quota. A page that gained a paragraph costs one paragraph, not the whole page.\u003c/p>\u003cp>Each source's line says whether it's working: how long ago it was last checked, and when the next read is due. \u003cstrong>Refresh\u003c/strong> reads a source immediately, whichever schedule it's on \u2014 that's also how you retry one that failed.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">A failed read never empties a source\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>If a site is down, or a page briefly returns nothing, Olisar keeps every passage it already had and marks the source with what went wrong. It tries again on the next scheduled read. You never lose what it learned because a server had a bad afternoon.\u003c/p>\u003c/div>\u003c/div>\u003cp>Uploaded documents have no schedule: the file lives on the operator's own machine and doesn't change on its own. Upload it again to teach Olisar a new version.\u003c/p>\u003ch3 id=\"glossary\">Glossary\u003c/h3>\u003cp>Short, server-specific lore Olisar carries into \u003cstrong>every\u003c/strong> reply so it speaks your community's dialect: abbreviations, org and person relationships, codenames, in-jokes. Unlike the knowledge base, the glossary isn't searched on demand; it's always in context (it's small and high-value).\u003c/p>\u003cul>\u003cli>\u003cstrong>Add your own\u003c/strong> facts (a subject + a one-line statement).\u003c/li>\u003cli>Olisar also \u003cstrong>mines them automatically\u003c/strong> as channels stay active, and will \u003cstrong>record a server fact itself\u003c/strong> when asked (\"Olisar, remember the raid team meets Fridays\") \u2014 so the glossary grows on its own.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"MN \u2192 Movie Night, our Friday watch-party in #cinema\", \"The Council \u2192 the server's moderator team\". Now Olisar understands those references everywhere, without you explaining them each time.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"activity\">Activity\u003c/h3>\u003cp>A running log of what has been changed in this console and when \u2014 config saves, glossary edits, channel changes, and every destructive action, each with the numbers it reported at the time. It's the record a success message can't be: \"Cleared memory \u2014 12,481 messages, 340 facts, 96 member profiles\" is still there tomorrow.\u003c/p>\u003cp>The log covers \u003cstrong>this whole install\u003c/strong>, not just the server you have selected \u2014 one line per action, newest first, with the admin who ran it.\u003c/p>\u003ch3 id=\"danger-zone\">Danger zone\u003c/h3>\u003cp>At the bottom of the page, \u003cstrong>Clear memory\u003c/strong> erases everything Olisar has learned about the \u003cstrong>currently selected server\u003c/strong>: conversation memory, summaries, the search index, remembered facts, the glossary, usage stats, its read on each member, and the knowledge base above. Its persona, behavior, channel modes and command replies are kept.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">There's no undo\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>You'll be asked to type \u003ccode>clear olisar memory\u003c/code> to confirm, and the dialog names the server it's about to wipe \u2014 check that name, since the server switcher is a different part of the screen. Members can clear just their own data at any time with \u003ccode>/forget-me\u003c/code>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"memory\" hidden>\u003ch1 class=\"docs-title\">Memory &amp; search\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar has several distinct kinds of memory. A member can wipe everything about themselves at any time with \u003ccode>/forget-me\u003c/code>.\u003c/p>\u003ch3 id=\"conversation-memory\">Conversation memory\u003c/h3>\u003cp>Recent messages and rolling \u003cstrong>summaries\u003c/strong> from channels set to \u003ccode>memory\u003c/code> or \u003ccode>both\u003c/code>. This is what lets Olisar hold context across a conversation and build a private profile of each person. Channels set to \u003ccode>respond\u003c/code> or \u003ccode>off\u003c/code> are \u003cstrong>not\u003c/strong> stored this way.\u003c/p>\u003ch3 id=\"recall\">Recall\u003c/h3>\u003cp>Before each reply, Olisar assembles the most relevant context: recent summaries, older messages closest in meaning to what's being asked, facts it remembers about you, the glossary, and matching passages from the knowledge base. That bundle is treated as \u003cstrong>background data\u003c/strong>, not instructions.\u003c/p>\u003cp>Older messages only come from the channel Olisar is replying in and from channels \u003cstrong>the person asking can open\u003c/strong>, so a reply in a public channel never draws on a private one that person can't see.\u003c/p>\u003ch3 id=\"server-wide-search-index\">Server-wide search index\u003c/h3>\u003cp>Separately from the conversation memory above, \u003cstrong>every message in every channel\u003c/strong> (except any you exclude \u2014 see below) is indexed for keyword \u003cstrong>and\u003c/strong> meaning search. This is what powers questions like \"what's the server's X account?\" or \"where was that link posted?\" \u2014 Olisar searches the index and answers with a Discord \u003cstrong>jump-link\u003c/strong> to the source.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"olisar, when do raid sign-ups close?\" \u2192 \"friday the 3rd at 8pm utc\", followed by a link that opens the message it came from.\u003c/p>\u003c/div>\u003c/div>\u003cul>\u003cli>When an answer comes from \u003cstrong>one specific past message\u003c/strong>, from a search or from recall, Olisar links that message. A link it wasn't actually given is removed before the reply is sent, so every link opens the message it points to.\u003c/li>\u003cli>Results are limited to channels \u003cstrong>the person asking can open\u003c/strong>. Someone without access to a staff channel gets nothing from it: no quote, no channel name, no link.\u003c/li>\u003c/ul>\u003cul>\u003cli>It reads \u003cstrong>embeds\u003c/strong> (so announcement posts and link previews are searchable) and posted \u003cstrong>files\u003c/strong> by name, and generates a short description of posted \u003cstrong>images\u003c/strong> so they turn up too.\u003c/li>\u003cli>\u003cstrong>New messages\u003c/strong> are indexed as they arrive; run \u003ccode>/olisar reindex\u003c/code> to go back through older history.\u003c/li>\u003cli>\u003cstrong>Exclude a channel\u003c/strong> with the second dropdown on the Channels tab (set it to *not indexed*) \u2014 that stops future indexing \u003cstrong>and\u003c/strong> wipes its already-indexed messages, including its threads.\u003c/li>\u003c/ul>\u003ch3 id=\"edits-deletes-follow\">Edits &amp; deletes follow\u003c/h3>\u003cp>If someone edits or deletes a message, Olisar updates or drops it from both memory and the index \u2014 so it won't quote something that no longer exists.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Privacy first\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Opted-out members are never indexed, and \u003ccode>/forget-me\u003c/code> removes a person from the index too. The all-channel index is an admin's explicit choice and is disclosed in \u003ccode>/privacy\u003c/code>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"members\" hidden>\u003ch1 class=\"docs-title\">Members\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Members tab shows the \u003cstrong>private profile Olisar builds of each person\u003c/strong> in the server, from what they say \u2014 so you can see what it has actually picked up. It's a grid of cards, one per member.\u003c/p>\u003cp>Each card has:\u003c/p>\u003cul>\u003cli>\u003cstrong>Roles\u003c/strong> \u2014 their server roles (the first few; a \"+N\" chip stands in for the rest).\u003c/li>\u003cli>\u003cstrong>Impression\u003c/strong> \u2014 a short summary Olisar writes from their messages: how they come across, what they're into, how it should talk to them. Members it hasn't formed one of yet show \"no impression yet\".\u003c/li>\u003cli>\u003cstrong>Remembered facts\u003c/strong> \u2014 durable notes it has saved about them, tagged \u003cstrong>fact\u003c/strong>, \u003cstrong>preference\u003c/strong>, or \u003cstrong>event\u003c/strong>.\u003c/li>\u003c/ul>\u003cp>Cards are ordered with the people Olisar knows best first \u2014 an \u003cstrong>impression\u003c/strong>, then those it only remembers facts about, then everyone else \u2014 and you can filter by name, role, or impression text.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">When impressions form\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Olisar (re)builds a person's impression after they've sent a number of messages \u2014 set by \u003cstrong>Persona rebuild (msgs)\u003c/strong> on the Behavior tab. Quieter members keep just their roles until then. A refresh \u003cstrong>refines\u003c/strong> the existing impression (keeping what's still true) rather than rewriting it from scratch.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Build one on demand\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Each card has a \u003cstrong>Create impression\u003c/strong> button (it reads \u003cstrong>Rebuild\u003c/strong> once one exists) that builds it right away from the member's last ~60 messages \u2014 reaching into the server-wide message index when conversation memory is thin, so it works even for people who mostly post in channels Olisar doesn't keep.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Private by design\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>This is per-server and never shown to members \u2014 it's only how Olisar tailors its replies. Anyone can wipe their own profile (impression, facts, messages) with \u003ccode>/forget-me\u003c/code>, and opted-out members are excluded here entirely. See \u003ca href=\"#privacy\" data-doc=\"privacy\">Privacy\u003c/a> for the full picture.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"images\" hidden>\u003ch1 class=\"docs-title\">Images\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Olisar handles images three ways:\u003c/p>\u003cul>\u003cli>\u003cstrong>Sees them\u003c/strong> \u2014 when you post a picture and address it, Olisar actually looks at the image and can talk about it.\u003c/li>\u003cli>\u003cstrong>Describes them for search\u003c/strong> \u2014 it generates a short, one-time description of posted images so they turn up in the message index later (\"that screenshot someone posted\").\u003c/li>\u003cli>\u003cstrong>Generates them\u003c/strong> \u2014 ask it to draw or imagine something and it creates an image and posts it.\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"olisar, draw a neon space whale over a city\" \u2192 it generates the image and posts it with a caption.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Image generation runs on \u003ca href=\"https://developers.cloudflare.com/workers-ai/\" target=\"_blank\" rel=\"noreferrer\">Cloudflare Workers AI\u003c/a> (a free daily allocation). If it isn't configured or the allocation is used up, Olisar will simply say it can't make one right now. See \u003ca href=\"#models\" data-doc=\"models\">Models\u003c/a> for why generation uses Cloudflare instead of Gemini.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"extensions\" hidden>\u003ch1 class=\"docs-title\">Extensions\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The Extensions tab is where you switch on optional, packaged features. An extension can add tools Olisar uses in conversation, tweak its behavior, and add slash commands.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Build and share your own\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Beyond the built-ins, operators can \u003cstrong>write their own extensions\u003c/strong> in the console and \u003cstrong>install\u003c/strong> others from a file or the marketplace. Start at \u003ca href=\"#ext-build\" data-doc=\"ext-build\">Create your own\u003c/a>, then the \u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">SDK reference\u003c/a>, \u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">slash commands &amp; flows\u003c/a>, \u003ca href=\"#ext-share\" data-doc=\"ext-share\">sharing\u003c/a>, \u003ca href=\"#ext-marketplace\" data-doc=\"ext-marketplace\">the marketplace\u003c/a>, and the \u003ca href=\"#ext-security\" data-doc=\"ext-security\">security model\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"built-ins\">Built-ins\u003c/h3>\u003cul>\u003cli>\u003cstrong>Dice roller\u003c/strong> \u2014 Olisar can roll dice on request (\"roll 2d6+3\").\u003c/li>\u003cli>\u003cstrong>Calculator\u003c/strong> \u2014 exact arithmetic instead of guessing at numbers.\u003c/li>\u003cli>\u003cstrong>Concise mode\u003c/strong> \u2014 keeps replies short and to the point.\u003c/li>\u003c/ul>\u003ch3 id=\"welcome-messages\">Welcome messages\u003c/h3>\u003cp>The \u003cstrong>Welcome\u003c/strong> extension greets new members as they join. Pick a channel and write a prompt that layers \u003cstrong>on top of\u003c/strong> the persona \u2014 e.g. \"give {user} a warm in-character welcome\" or \"roast {user} on their username\". Olisar generates a fresh, in-character message for each join and posts it; \u003ccode>{user}\u003c/code> and \u003ccode>{username}\u003c/code> are filled in. Off by default \u2014 enable and configure it on the Extensions tab (it has its own channel picker and prompt).\u003c/p>\u003ch3 id=\"star-citizen\">Star Citizen\u003c/h3>\u003cp>A full example extension, for SC communities. Turning it on does several things at once:\u003c/p>\u003ch3 id=\"knowledge\">Knowledge\u003c/h3>\u003cp>When enabled, it automatically adds the \u003ca href=\"https://robertsspaceindustries.com/en/comm-link\" target=\"_blank\" rel=\"noreferrer\">RSI Comm-Link\u003c/a> to the knowledge base, so Olisar can speak to recent official posts.\u003c/p>\u003ch3 id=\"tools-used-in-conversation\">Tools (used in conversation)\u003c/h3>\u003cp>Olisar calls these live as the conversation needs them and answers in its own voice. Most run on \u003ca href=\"https://uexcorp.uk/\" target=\"_blank\" rel=\"noreferrer\">UEX\u003c/a>'s public data; ships specs come from RSI's \u003ca href=\"https://robertsspaceindustries.com/ship-matrix\" target=\"_blank\" rel=\"noreferrer\">ship matrix\u003c/a> and the hangar timer from the \u003ca href=\"https://exec.xyxyll.com/\" target=\"_blank\" rel=\"noreferrer\">community tracker\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Trading &amp; commodities\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Commodity\u003c/strong> \u2014 a commodity's kind, average buy/sell price, and availability.\u003c/li>\u003cli>\u003cstrong>Commodity prices\u003c/strong> \u2014 the best terminals to buy and sell a commodity *right now*.\u003c/li>\u003cli>\u003cstrong>Trade routes\u003c/strong> \u2014 the most profitable runs for a commodity, or starting from a given station.\u003c/li>\u003cli>\u003cstrong>Commodity ranking\u003c/strong> \u2014 the top earners by buy\u2192sell margin.\u003c/li>\u003cli>\u003cstrong>Stock levels\u003c/strong> \u2014 what a terminal's inventory labels (Out of Stock \u2026 Max Inventory) mean.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Ships &amp; vehicles\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Ship lookup\u003c/strong> \u2014 official RSI specs: manufacturer, role, size, crew, cargo, speed, status.\u003c/li>\u003cli>\u003cstrong>Vehicle (UEX)\u003c/strong> \u2014 full name, cargo SCU, and crew from UEX's dataset.\u003c/li>\u003cli>\u003cstrong>Pledge price\u003c/strong> \u2014 the real-money store price (USD), standalone/warbond, and whether it's on sale.\u003c/li>\u003cli>\u003cstrong>In-game purchase\u003c/strong> \u2014 the cheapest aUEC terminal to buy a ship in-game.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Universe &amp; locations\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Location / terminal\u003c/strong> \u2014 a trade terminal, station, outpost, or city by name.\u003c/li>\u003cli>\u003cstrong>Star system\u003c/strong> \u2014 its faction, jurisdiction, and whether it's playable yet (or list the live systems).\u003c/li>\u003cli>\u003cstrong>Planet &amp; moon\u003c/strong> \u2014 a body's star system (and, for a moon, the planet it orbits).\u003c/li>\u003cli>\u003cstrong>Orbit\u003c/strong> \u2014 an orbital point (Lagrange points like CRU-L1, asteroid fields): its star system and kind.\u003c/li>\u003cli>\u003cstrong>Point of interest\u003c/strong> \u2014 a POI's location and facilities (trade terminal, refuel, repair, refinery\u2026).\u003c/li>\u003cli>\u003cstrong>Jump points\u003c/strong> \u2014 which star systems connect to which.\u003c/li>\u003cli>\u003cstrong>Item\u003c/strong> \u2014 ship components, weapons, armor and the like (give it a category, e.g. \"Coolers\").\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Live status &amp; economy\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Executive Hangar status\u003c/strong> \u2014 the Pyro Executive Hangar open/closed timer and countdown.\u003c/li>\u003cli>\u003cstrong>Currency index\u003c/strong> \u2014 the aUEC purchasing-power index (100 = Dec 2023; higher means things cost more).\u003c/li>\u003c/ul>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\"olisar, is the exec hangar open?\" \u2192 \"The Pyro Executive Hangar is currently \u003cstrong>CLOSED\u003c/strong> \u2014 next change in ~9m 50s.\" \u00b7 \"where's the cheapest Avenger Titan in-game?\" \u00b7 \"best trade route for Laranite?\" \u00b7 \"what's the aUEC purchasing-power index lately?\" \u2014 each pulls live UEX/RSI figures.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"citizen-username\">\u003ccode>/citizen &lt;username&gt;\u003c/code>\u003c/h3>\u003cp>Returns a rich profile card scraped from a player's RSI page \u2014 handle, avatar, citizen record, enlisted date, languages, main org with rank and stars, and bio. Available to everyone once the extension is on.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Example\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>/citizen DadBodNerd\u003c/code> \u2192 an embed with their citizen record, enlisted date, main org and rank, and bio.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">UEX token (optional)\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The UEX tools work on \u003ca href=\"https://uexcorp.uk/\" target=\"_blank\" rel=\"noreferrer\">UEX\u003c/a>'s public endpoints with no setup. Adding a free \u003ca href=\"https://uexcorp.uk/api\" target=\"_blank\" rel=\"noreferrer\">UEX API token\u003c/a> under \u003cstrong>Keys\u003c/strong> on this extension's page in Extensions just raises the rate limits \u2014 it's not required. Like the API keys, it's one token for the whole install, and only the operator sees it.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Note\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Lookups are best-effort against live third-party sites; if one is temporarily unreachable, Olisar says so and carries on. Names are matched forgivingly, so small typos (\"Quantanium\" \u2192 \"Quantainium\") still work.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-build\" hidden>\u003ch1 class=\"docs-title\">Create your own\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Beyond the toggles, you can \u003cstrong>build your own extensions\u003c/strong> right in the console \u2014 the same system the built-ins are made of. An extension is a small piece of TypeScript that can teach Olisar new tricks: tools it calls in conversation, slash commands (with forms and buttons), knowledge and glossary it seeds, a settings pane, and a line folded into its system prompt.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Operators only\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Authoring is limited to the \u003cstrong>operator\u003c/strong> (the allowlisted account that runs the bot). Per-server admins can enable and configure extensions, but not write or edit their code. This is the same boundary as the API keys \u2014 code that runs inside Olisar is the operator's call.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"opening-the-editor\">Opening the editor\u003c/h3>\u003cp>On the Extensions tab:\u003c/p>\u003cul>\u003cli>\u003cstrong>+ New extension\u003c/strong> \u2014 start from a blank editor.\u003c/li>\u003cli>\u003cstrong>Edit code\u003c/strong> (on any extension's detail panel) \u2014 open an existing one, including the built-ins, to read or fork it.\u003c/li>\u003c/ul>\u003cp>The editor has the \u003cstrong>Olisar SDK types loaded\u003c/strong>, so you get autocomplete and inline hints for everything below. Press \u003cstrong>Validate\u003c/strong> to compile-check and see what your extension declares, then \u003cstrong>Save\u003c/strong>.\u003c/p>\u003ch3 id=\"the-shape-of-an-extension\">The shape of an extension\u003c/h3>\u003cp>You write one call to \u003ccode>defineExtension({ ... })\u003c/code>. You never import anything \u2014 \u003ccode>defineExtension\u003c/code> and \u003ccode>host\u003c/code> are provided by the runtime. The smallest useful extension is a single tool:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>defineExtension({\n  id: \"hello\",\n  name: \"Hello\",\n  description: \"A tiny demo.\",\n  permissions: [],\n  tools: [{\n    name: \"greet\",\n    description: \"Greet someone by name.\",\n    parameters: { type: \"object\", properties: { who: { type: \"string\" } }, required: [\"who\"] },\n    handler: (args) =&gt; \"Hello, \" + args.who + \"!\",\n  }],\n})\u003c/code>\u003c/pre>\u003cp>Save that, enable it, and Olisar will call \u003ccode>greet\u003c/code> when a conversation calls for it \u2014 \"olisar, say hi to Sam\" \u2192 \"Hello, Sam!\". See the \u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">SDK reference\u003c/a> for the full \u003ccode>defineExtension\u003c/code> surface.\u003c/p>\u003ch3 id=\"what-happens-when-you-save\">What happens when you save\u003c/h3>\u003cp>Your \u003cstrong>source is the source of truth.\u003c/strong> On save, the bot transpiles your TypeScript itself, runs it once in the \u003ca href=\"#ext-security\" data-doc=\"ext-security\">sandbox\u003c/a> to read what it declares (its tools, commands, permissions), and stores it. From then on it behaves exactly like a built-in: tools merge into Olisar's toolset on the next reply, commands register on the next sync, and any \u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">seeds\u003c/a> apply the first time an admin enables it.\u003c/p>\u003ch3 id=\"editing-the-built-ins\">Editing the built-ins\u003c/h3>\u003cp>Every built-in \u2014 Welcome and the Star Citizen pack \u2014 \u003cstrong>is itself an SDK extension.\u003c/strong> Open \u003cstrong>Edit code\u003c/strong> on any of them to see exactly how it's written; the Star Citizen pack is a complete, real-world example (live HTTP tools, a slash command, knowledge seeding).\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Forking a built-in\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Editing a built-in keeps your changes \u003cstrong>and stops it auto-updating\u003c/strong> with future app releases (so your edits are never overwritten). To experiment without that, copy its code into a \u003cstrong>+ New extension\u003c/strong> under a new \u003ccode>id\u003c/code> instead.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"permissions-in-one-line\">Permissions, in one line\u003c/h3>\u003cp>Anything your code reaches through \u003ccode>host.*\u003c/code> (the network, secrets, the knowledge base\u2026) must be listed in \u003ccode>permissions\u003c/code>, and you approve that list when you save. A capability you didn't request simply isn't there. The full model \u2014 and why imported code is held to a stricter standard \u2014 is in \u003ca href=\"#ext-security\" data-doc=\"ext-security\">Security &amp; trust\u003c/a>.\u003c/p>\u003ch3 id=\"where-to-go-next\">Where to go next\u003c/h3>\u003cul>\u003cli>\u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">SDK reference\u003c/a> \u2014 every field of \u003ccode>defineExtension\u003c/code> and every \u003ccode>host\u003c/code> capability.\u003c/li>\u003cli>\u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">Slash commands &amp; flows\u003c/a> \u2014 commands, modal forms, and button/menu interactions.\u003c/li>\u003cli>\u003ca href=\"#ext-share\" data-doc=\"ext-share\">Sharing extensions\u003c/a> \u2014 export and import \u003ccode>.olx\u003c/code> files.\u003c/li>\u003cli>\u003ca href=\"#ext-marketplace\" data-doc=\"ext-marketplace\">The marketplace\u003c/a> \u2014 browse, install, and publish extensions.\u003c/li>\u003c/ul>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-sdk\" hidden>\u003ch1 class=\"docs-title\">SDK reference\u003c/h1>\u003cdiv class=\"doc\">\u003cp>This is the complete author-facing surface. You always start with one call to \u003ccode>defineExtension(spec)\u003c/code>; the fields of \u003ccode>spec\u003c/code> are below, followed by the \u003ccode>host\u003c/code> capabilities your handlers can use. For slash commands specifically, see \u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">Slash commands &amp; flows\u003c/a>.\u003c/p>\u003ch3 id=\"defineextension-spec\">defineExtension(spec)\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Type\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>Unique key (lowercase letters, digits, \u003ccode>_\u003c/code>). Identifies the extension everywhere.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>name\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>Display name in the console.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>version\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>Semantic version, e.g. \u003ccode>\"1.2.0\"\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>description\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>One-line summary shown in the catalog.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>category\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>Grouping label, e.g. \u003ccode>\"Games\"\u003c/code>, \u003ccode>\"Utilities\"\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemNote\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>A line folded into Olisar's system prompt \u003cstrong>while the extension is on\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>defaultEnabled\u003c/code>\u003c/td>\u003ctd>boolean\u003c/td>\u003ctd>Whether new servers get it on by default (usually \u003ccode>false\u003c/code>).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>permissions\u003c/code>\u003c/td>\u003ctd>string[]\u003c/td>\u003ctd>The capabilities you request \u2014 see the table below.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tools\u003c/code>\u003c/td>\u003ctd>ToolDef[]\u003c/td>\u003ctd>LLM tools the model calls in conversation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>commands\u003c/code>\u003c/td>\u003ctd>CommandDef[]\u003c/td>\u003ctd>Slash commands. See \u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">flows\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>seeds\u003c/code>\u003c/td>\u003ctd>object\u003c/td>\u003ctd>Knowledge / glossary to add when enabled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settingsSchema\u003c/code>\u003c/td>\u003ctd>object\u003c/td>\u003ctd>Declares a per-server settings pane.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components\u003c/code>\u003c/td>\u003ctd>object\u003c/td>\u003ctd>Persistent button/select handlers \u2014 see \u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">Persistent buttons\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>events\u003c/code>\u003c/td>\u003ctd>object\u003c/td>\u003ctd>Gateway-event hooks (e.g. \u003ccode>memberJoin\u003c/code>) \u2014 see \u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">Event hooks\u003c/a> below. First-party only.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>onEnable\u003c/code>\u003c/td>\u003ctd>function\u003c/td>\u003ctd>Runs once on the OFF \u2192 ON transition (durable setup).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"tools\">Tools\u003c/h3>\u003cp>A \u003cstrong>tool\u003c/strong> is a function the language model can call on its own while your extension is enabled \u2014 this is how Olisar \"looks things up\" mid-conversation. Each tool declares a name, a description (the model reads this to decide when to use it), a JSON-schema for its arguments, and a handler that \u003cstrong>returns a short string\u003c/strong> for the model to weave into its reply.\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>{\n  name: \"weather\",\n  description: \"Current weather for a city.\",\n  parameters: {\n    type: \"object\",\n    properties: { city: { type: \"string\", description: \"city name\" } },\n    required: [\"city\"],\n  },\n  handler: async (args, ctx) =&gt; {\n    const r = await host.fetch(\"https://wttr.in/\" + encodeURIComponent(args.city) + \"?format=3\")\n    return await r.text()\n  },\n}\u003c/code>\u003c/pre>\u003cp>The handler's second argument, \u003ccode>ctx\u003c/code>, carries \u003ccode>guildId\u003c/code>, \u003ccode>channelId\u003c/code>, \u003ccode>userId\u003c/code>, and \u003ccode>displayName\u003c/code> for the current conversation. Keep the returned string short and factual \u2014 Olisar rephrases it in its own voice.\u003c/p>\u003cdiv class=\"callout callout-tip\">\u003cdiv class=\"callout-label\">Degrade politely\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Return a friendly string on failure (\"couldn't reach the weather service\") rather than throwing \u2014 Olisar will pass it along in character. Uncaught errors become a generic tool-failed message.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"host-capabilities\">host capabilities\u003c/h3>\u003cp>Each \u003ccode>host\u003c/code> method works \u003cstrong>only if you listed its permission\u003c/strong>. Calling one you didn't request throws.\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Capability\u003c/th>\u003cth>Permission\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>host.fetch(url, init?)\u003c/code>\u003c/td>\u003ctd>\u003ccode>fetch\u003c/code>\u003c/td>\u003ctd>Public HTTP(S) only. Caps size/time/calls. \u003ccode>init.bodyBlobId\u003c/code> sends a host blob as the raw body; \u003ccode>init.responseBlob: true\u003c/code> stores the response as \u003ccode>res.blobId\u003c/code> (\u2264 ~25 MB). Otherwise returns text via \u003ccode>text()\u003c/code>/\u003ccode>json()\u003c/code> (\u2264 ~20 MB).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.secret(ref)\u003c/code>\u003c/td>\u003ctd>\u003ccode>secret:&lt;ref&gt;\u003c/code>\u003c/td>\u003ctd>Read an operator-approved key by reference (e.g. \u003ccode>host.secret(\"uex_api_key\")\u003c/code>). You never see the literal value while authoring.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.kb.addSource(seed)\u003c/code>\u003c/td>\u003ctd>\u003ccode>kb.write\u003c/code>\u003c/td>\u003ctd>Add a URL/website to the server's knowledge base. Idempotent.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.glossary.add(fact)\u003c/code>\u003c/td>\u003ctd>\u003ccode>glossary.write\u003c/code>\u003c/td>\u003ctd>Add a \u003ccode>{ subject, fact }\u003c/code> to the glossary.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.kv.get/set/delete\u003c/code>\u003c/td>\u003ctd>\u003ccode>kv\u003c/code>\u003c/td>\u003ctd>A small per-server key/value store your extension owns.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.settings.get(key?)\u003c/code>\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Read what an admin typed in your settings pane. No permission needed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.embed(spec)\u003c/code>\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Build a Discord embed to pass to \u003ccode>reply({ embed })\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.log(msg)\u003c/code>\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Write a line to the bot log. Always available.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.files.ingest(optionName)\u003c/code>\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Load a slash \u003ccode>attachment\u003c/code> into a \u003cstrong>host blob\u003c/strong> (\u003ccode>{ blobId, filename, size }\u003c/code>). Prefer for large files / API pipelines \u2014 bytes never enter the sandbox (\u2264 ~25 MB).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.files.read(optionName)\u003c/code>\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Load a slash \u003ccode>attachment\u003c/code> as base64 into the sandbox (\u003ccode>{ contentB64, \u2026 }\u003c/code>, \u2264 ~20 MB). Fine for small files.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>`host.files.from({ name, text\\\u003c/td>\u003ctd>contentB64 })`\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Create a host blob from sandbox data.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.discord.*\u003c/code> (via the interaction)\u003c/td>\u003ctd>\u003ccode>discord.reply\u003c/code>, \u003ccode>discord.modal\u003c/code>, \u003ccode>discord.components\u003c/code>\u003c/td>\u003ctd>Reply (optionally with \u003ccode>files\u003c/code> / \u003ccode>blobId\u003c/code>), pop forms, and use buttons \u2014 see \u003ca href=\"#ext-flows\" data-doc=\"ext-flows\">flows\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.generate({ task, maxTokens? })\u003c/code>\u003c/td>\u003ctd>\u003ccode>model.generate\u003c/code>\u003c/td>\u003ctd>Generate text in your server's persona voice (the persona is applied as the system prompt for you). Resolves to a string. \u003cstrong>First-party only.\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.discord.send(channelId, payload)\u003c/code>\u003c/td>\u003ctd>\u003ccode>discord.send\u003c/code>\u003c/td>\u003ctd>Post a message to a channel (content / embed / components / files) \u2014 for \u003ca href=\"#ext-sdk\" data-doc=\"ext-sdk\">event hooks\u003c/a> that have no interaction to reply to.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Host secrets and shared code\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>\u003ccode>host.secret\u003c/code> reads the \u003cstrong>operator's\u003c/strong> keys (Gemini, Cloudflare, UEX). That's fine for extensions you wrote yourself, but extensions \u003cstrong>installed from a file or the marketplace are blocked from host secrets entirely\u003c/strong> \u2014 see \u003ca href=\"#ext-security\" data-doc=\"ext-security\">Security &amp; trust\u003c/a>. If you're publishing, don't rely on \u003ccode>host.secret\u003c/code>.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"seeds-and-onenable\">Seeds and onEnable\u003c/h3>\u003cp>\u003ccode>seeds\u003c/code> lets a code-free (or any) extension contribute knowledge and glossary the moment it's switched on, applied idempotently:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>seeds: {\n  kbSources: [{ type: \"url\", uri: \"https://example.com/faq\", title: \"Project FAQ\" }],\n  glossary: [{ subject: \"HQ\", fact: \"Coordination happens in #command.\" }],\n}\u003c/code>\u003c/pre>\u003cp>For anything more involved, \u003ccode>onEnable(ctx)\u003c/code> runs once on the OFF \u2192 ON transition (\u003ccode>ctx.guildId\u003c/code> tells you which server) \u2014 use it to seed durable state with \u003ccode>host.kv\u003c/code> or \u003ccode>host.kb\u003c/code>.\u003c/p>\u003ch3 id=\"a-settings-pane\">A settings pane\u003c/h3>\u003cp>Declare \u003ccode>settingsSchema\u003c/code> and Olisar renders a config form on the extension's detail panel; read what the admin entered with \u003ccode>host.settings.get()\u003c/code>:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>settingsSchema: { fields: [\n  { key: \"channel\", type: \"channel\", label: \"Announcement channel\" },\n  { key: \"intro\",   type: \"textarea\", label: \"Intro message\" },\n] }\n// later, in a handler:\nconst cfg = await host.settings.get()   // { channel, intro }\u003c/code>\u003c/pre>\u003cp>Field types: \u003ccode>text\u003c/code>, \u003ccode>textarea\u003c/code>, \u003ccode>channel\u003c/code>, \u003ccode>number\u003c/code>, \u003ccode>toggle\u003c/code>. Settings are \u003cstrong>per server\u003c/strong>, so each server configures the extension its own way.\u003c/p>\u003ch3 id=\"event-hooks\">Event hooks\u003c/h3>\u003cp>An extension can react to Discord \u003cstrong>gateway events\u003c/strong> by declaring an \u003ccode>events\u003c/code> map. The host runs your handler in the sandbox when the event fires for a server where your extension is enabled. The event you can hook is \u003ccode>memberJoin\u003c/code>:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>permissions: [\"model.generate\", \"discord.send\"],\nsettingsSchema: { fields: [{ key: \"channel_id\", type: \"channel\", label: \"Welcome channel\" }] },\nevents: {\n  async memberJoin(ctx) {\n    const cfg = await host.settings.get()\n    if (!cfg.channel_id) return\n    const text = await host.generate({\n      task: \"Welcome \" + ctx.member.displayName + \" to the server in one warm sentence.\",\n      maxTokens: 200,\n    })\n    await host.discord.send(cfg.channel_id, ctx.member.mention + \" \" + text)\n  },\n}\u003c/code>\u003c/pre>\u003cp>The handler's \u003ccode>ctx\u003c/code> carries \u003ccode>guildId\u003c/code> and \u003ccode>member\u003c/code> (\u003ccode>{ id, displayName, username, mention, bot }\u003c/code>). There's \u003cstrong>no interaction to reply to\u003c/strong> \u2014 an event handler posts with \u003ccode>host.discord.send(channelId, payload)\u003c/code>, and can generate a message in the server's voice with \u003ccode>host.generate(...)\u003c/code>.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">First-party only\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Event hooks, \u003ccode>host.generate\u003c/code>, and \u003ccode>host.discord.send\u003c/code> run only for \u003cstrong>built-in and locally-authored\u003c/strong> extensions \u2014 never imported or marketplace code, the same bar as \u003ca href=\"#ext-security\" data-doc=\"ext-security\">host secrets\u003c/a>. The built-in \u003cstrong>Welcome\u003c/strong> extension is the worked example (open *Edit code* on it).\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"systemnote\">systemNote\u003c/h3>\u003cp>A short instruction folded into Olisar's system prompt while the extension is enabled \u2014 use it to tell Olisar when to reach for your tools, or how to behave. Keep it brief; it's always in context.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-flows\" hidden>\u003ch1 class=\"docs-title\">Slash commands &amp; flows\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Extensions can add \u003cstrong>slash commands\u003c/strong> \u2014 including multi-step flows with pop-up forms and buttons. Commands re-register with Discord automatically when you save (and when an admin toggles the extension).\u003c/p>\u003ch3 id=\"defining-a-command\">Defining a command\u003c/h3>\u003cpre class=\"doc-pre\">\u003ccode>defineExtension({\n  id: \"poll\",\n  name: \"Poll\",\n  permissions: [\"discord.reply\"],\n  commands: [{\n    name: \"ping\",\n    description: \"Check that Olisar is alive.\",\n    handler: async (i) =&gt; { await i.reply(\"pong\") },\n  }],\n})\u003c/code>\u003c/pre>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Command field\u003c/th>\u003cth>Type\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>name\u003c/code> / \u003ccode>description\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>As they appear in Discord's slash-command list.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>options\u003c/code>\u003c/td>\u003ctd>OptionDef[]\u003c/td>\u003ctd>Inputs: \u003ccode>{ name, description, type, required }\u003c/code>. Types: \u003ccode>string\u003c/code>, \u003ccode>integer\u003c/code>, \u003ccode>number\u003c/code>, \u003ccode>boolean\u003c/code>, \u003ccode>user\u003c/code>, \u003ccode>channel\u003c/code>, \u003ccode>attachment\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>defaultMemberPermissions\u003c/code>\u003c/td>\u003ctd>string or null\u003c/td>\u003ctd>\u003ccode>\"manage_guild\"\u003c/code> to limit it to server managers, or \u003ccode>null\u003c/code> for everyone.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>guildOnly\u003c/code>\u003c/td>\u003ctd>boolean\u003c/td>\u003ctd>Disallow the command in DMs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>handler(i)\u003c/code>\u003c/td>\u003ctd>function\u003c/td>\u003ctd>Runs the command; \u003ccode>i\u003c/code> is the live interaction.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Read option values from \u003ccode>i.options\u003c/code>:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>commands: [{\n  name: \"echo\",\n  description: \"Repeat a message.\",\n  options: [{ name: \"text\", description: \"what to say\", type: \"string\", required: true }],\n  handler: async (i) =&gt; { await i.reply(i.options.text) },\n}]\u003c/code>\u003c/pre>\u003ch3 id=\"file-uploads-attachment-options\">File uploads (attachment options)\u003c/h3>\u003cp>Use \u003ccode>type: \"attachment\"\u003c/code> so Discord shows a file picker. \u003ccode>i.options.&lt;name&gt;\u003c/code> is \u003cstrong>metadata only\u003c/strong> (\u003ccode>{ id, filename, size, contentType }\u003c/code>) \u2014 no filesystem path. Load the file two ways:\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable class=\"doc-table\">\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>What you get\u003c/th>\u003cth>Size cap\u003c/th>\u003cth>When to use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>host.files.ingest(name)\u003c/code>\u003c/td>\u003ctd>\u003ccode>{ blobId, filename, size }\u003c/code> (bytes stay on the host)\u003c/td>\u003ctd>~25 MB\u003c/td>\u003ctd>Large files, external APIs, reply with the result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>host.files.read(name)\u003c/code>\u003c/td>\u003ctd>\u003ccode>{ contentB64, \u2026 }\u003c/code> (base64 into the sandbox)\u003c/td>\u003ctd>~20 MB\u003c/td>\u003ctd>Small files you process in JS\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Preferred pipeline\u003c/strong> (upload \u2192 external API \u2192 reply with file) \u2014 nothing large ever enters the sandbox:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>permissions: [\"discord.reply\", \"fetch\"],\ncommands: [{\n  name: \"compress\",\n  description: \"Compress a file via an external API.\",\n  options: [{ name: \"file\", description: \"File to compress\", type: \"attachment\", required: true }],\n  handler: async (i) =&gt; {\n    await i.reply({ content: \"Compressing\u2026\", ephemeral: true })  // ack within 3s\n    const input = await host.files.ingest(\"file\")               // host blob\n    const res = await host.fetch(\"https://api.example.com/compress\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/octet-stream\" },\n      bodyBlobId: input.blobId,   // raw bytes as the request body\n      responseBlob: true,         // store response as another host blob\n    })\n    if (!res.ok || !res.blobId) {\n      await i.followUp({ content: \"Compression failed.\", ephemeral: true })\n      return\n    }\n    await i.followUp({\n      content: \"Done \u2014 compressed **\" + input.filename + \"**.\",\n      files: [{ name: input.filename + \".gz\", blobId: res.blobId }],\n      // stays private: followUps inherit ephemeral from the first reply\n    })\n  },\n}]\u003c/code>\u003c/pre>\u003cp>Small-file path with base64 still works:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>const file = await host.files.read(\"doc\")  // { filename, size, contentType, contentB64 }\nawait i.reply({ content: \"Got \" + file.filename + \" (\" + file.size + \" bytes)\", ephemeral: true })\u003c/code>\u003c/pre>\u003ch3 id=\"file-output-attach-on-reply\">File output (attach on reply)\u003c/h3>\u003cp>\u003ccode>reply\u003c/code> / \u003ccode>followUp\u003c/code> / \u003ccode>host.discord.send\u003c/code> accept \u003ccode>files\u003c/code>. Each entry needs one of:\u003c/p>\u003cul>\u003cli>\u003ccode>text\u003c/code> \u2014 UTF-8 (\u2264 ~20 MB)\u003c/li>\u003cli>\u003ccode>contentB64\u003c/code> \u2014 binary as base64 (\u2264 ~20 MB)\u003c/li>\u003cli>\u003ccode>blobId\u003c/code> \u2014 host-held blob from \u003ccode>ingest\u003c/code> / \u003ccode>from\u003c/code> / \u003ccode>fetch({ responseBlob: true })\u003c/code> (\u2264 ~25 MB)\u003c/li>\u003c/ul>\u003cp>Max 10 files; \u003cstrong>total\u003c/strong> size capped at ~25 MB (Discord\u2019s bot limit):\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>await i.reply({\n  content: \"Here's your export.\",\n  files: [\n    { name: \"report.csv\", text: \"a,b\\n1,2\\n\" },\n    { name: \"out.bin\", blobId: someBlob.blobId },\n  ],\n})\u003c/code>\u003c/pre>\u003ch3 id=\"the-interaction-object\">The interaction object\u003c/h3>\u003cp>The handler's \u003ccode>i\u003c/code> exposes the conversation context (\u003ccode>guildId\u003c/code>, \u003ccode>channelId\u003c/code>, \u003ccode>userId\u003c/code>, \u003ccode>displayName\u003c/code>) and:\u003c/p>\u003cul>\u003cli>\u003ccode>i.reply(payload)\u003c/code> \u2014 the first response. A string, or \u003ccode>{ content, embed, ephemeral, components, files }\u003c/code>.\u003c/li>\u003cli>\u003ccode>i.followUp(payload)\u003c/code> \u2014 additional messages after the first (same shape; supports \u003ccode>ephemeral\u003c/code> and \u003ccode>files\u003c/code>).\u003c/li>\u003cli>\u003ccode>i.modal(spec)\u003c/code> \u2014 pop a form and \u003cstrong>await\u003c/strong> the submitted values (permission \u003ccode>discord.modal\u003c/code>).\u003c/li>\u003cli>\u003ccode>i.awaitComponent({ timeoutMs })\u003c/code> \u2014 wait for a button click / menu choice (permission \u003ccode>discord.components\u003c/code>).\u003c/li>\u003c/ul>\u003cp>\u003ccode>reply\u003c/code>/\u003ccode>followUp\u003c/code> need \u003ccode>discord.reply\u003c/code>. Use \u003ccode>ephemeral: true\u003c/code> to make a message visible only to the caller. If the \u003cstrong>first\u003c/strong> reply is ephemeral, later \u003ccode>followUp\u003c/code>s stay private by default (you can still set \u003ccode>ephemeral: false\u003c/code> to post publicly). Use \u003ccode>host.files.read\u003c/code> / \u003ccode>ingest\u003c/code> for attachment option bytes (command handlers only).\u003c/p>\u003ch3 id=\"a-form-modal\">A form (modal)\u003c/h3>\u003cp>\u003ccode>i.modal\u003c/code> opens a Discord form and resolves with the submitted fields, keyed by \u003ccode>id\u003c/code>:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>permissions: [\"discord.reply\", \"discord.modal\"],\ncommands: [{\n  name: \"suggest\",\n  description: \"Submit a suggestion.\",\n  handler: async (i) =&gt; {\n    const f = await i.modal({\n      title: \"New suggestion\",\n      fields: [\n        { id: \"title\", label: \"Title\", style: \"short\", required: true },\n        { id: \"body\",  label: \"Details\", style: \"paragraph\" },\n      ],\n    })\n    await i.reply({ content: \"Thanks! Logged: \" + f.title, ephemeral: true })\n  },\n}]\u003c/code>\u003c/pre>\u003ch3 id=\"buttons-and-menus\">Buttons and menus\u003c/h3>\u003cp>Send components with \u003ccode>reply\u003c/code>, then wait for the interaction:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>permissions: [\"discord.reply\", \"discord.components\"],\nhandler: async (i) =&gt; {\n  await i.reply({\n    content: \"Ready to launch?\",\n    components: [\n      { kind: \"button\", customId: \"go\", label: \"Launch\", style: \"primary\" },\n      { kind: \"button\", customId: \"cancel\", label: \"Cancel\", style: \"secondary\" },\n    ],\n  })\n  const c = await i.awaitComponent({ timeoutMs: 30000 })\n  await i.followUp(c.customId === \"go\" ? \"Launching!\" : \"Cancelled.\")\n}\u003c/code>\u003c/pre>\u003cp>A \u003ccode>select\u003c/code> component returns the chosen values in \u003ccode>c.values\u003c/code>. If nobody responds within \u003ccode>timeoutMs\u003c/code>, the await rejects \u2014 catch it and tidy up.\u003c/p>\u003ch3 id=\"persistent-buttons\">Persistent buttons\u003c/h3>\u003cp>\u003ccode>awaitComponent\u003c/code> is for a single, short-lived prompt \u2014 it stops listening after \u003ccode>timeoutMs\u003c/code> (and after a bot restart). For buttons many people click over hours or days \u2014 polls, RSVPs \u2014 declare a \u003cstrong>`components`\u003c/strong> map instead. Each handler has a short key; a button/select that references it by \u003ccode>handlerId\u003c/code> keeps working for everyone and \u003cstrong>survives restarts\u003c/strong> (no per-message rebuild).\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>permissions: [\"kv\", \"discord.reply\", \"discord.components\"],\ncomponents: {\n  // keyed by handlerId; runs on every click, by anyone, forever\n  vote: async (i) =&gt; {\n    const tally = (await host.kv.get(\"tally\")) || {}\n    tally[i.userId] = i.arg            // i.arg is the small payload you set on the button\n    await host.kv.set(\"tally\", tally)\n    await i.update({ embed: host.embed({ title: \"Votes: \" + Object.keys(tally).length }) })\n  },\n},\ncommands: [{\n  name: \"poll\", description: \"Start a poll.\",\n  handler: async (i) =&gt; {\n    await i.reply({\n      content: \"Pick one:\",\n      components: [\n        { kind: \"button\", handlerId: \"vote\", arg: \"a\", label: \"A\" },\n        { kind: \"button\", handlerId: \"vote\", arg: \"b\", label: \"B\" },\n      ],\n    })\n  },\n}]\u003c/code>\u003c/pre>\u003cp>A persistent handler receives a \u003cstrong>ComponentInteraction\u003c/strong> \u003ccode>i\u003c/code> with \u003ccode>customId\u003c/code>, \u003ccode>arg\u003c/code>, \u003ccode>values\u003c/code> (for selects), and the usual context. Its methods differ from a command's:\u003c/p>\u003cul>\u003cli>\u003ccode>i.reply(payload)\u003c/code> \u2014 answer the \u003cstrong>clicker privately\u003c/strong> (ephemeral).\u003c/li>\u003cli>\u003ccode>i.update(payload)\u003c/code> \u2014 edit the \u003cstrong>source message\u003c/strong> in place (live tally, attendee list). Pass \u003ccode>components: []\u003c/code> to clear the buttons; omit \u003ccode>components\u003c/code> to leave them.\u003c/li>\u003cli>\u003ccode>i.deferUpdate()\u003c/code> \u2014 acknowledge the click with no visible change.\u003c/li>\u003c/ul>\u003cp>Keep \u003ccode>handlerId\u003c/code> + \u003ccode>arg\u003c/code> short (under ~40 chars); store anything bigger in \u003ccode>host.kv\u003c/code> and pass its key as \u003ccode>arg\u003c/code>. The host stamps the routing id, so a click can only ever reach the extension that owns it.\u003c/p>\u003ch3 id=\"embeds\">Embeds\u003c/h3>\u003cp>Build rich cards with \u003ccode>host.embed\u003c/code> and pass them to \u003ccode>reply\u003c/code>:\u003c/p>\u003cpre class=\"doc-pre\">\u003ccode>const card = host.embed({\n  title: \"Status\", description: \"All systems nominal.\", color: 0x2e9fff,\n  fields: [{ name: \"Uptime\", value: \"5d 2h\", inline: true }],\n  footer: \"live\",\n})\nawait i.reply({ embed: card })\u003c/code>\u003c/pre>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-share\" hidden>\u003ch1 class=\"docs-title\">Sharing extensions\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Extensions move between bots as \u003cstrong>`.olx` files\u003c/strong> \u2014 a small, signed bundle. You can hand one to a friend directly, or use \u003ca href=\"#ext-marketplace\" data-doc=\"ext-marketplace\">the marketplace\u003c/a> (which is built on the same format).\u003c/p>\u003ch3 id=\"exporting\">Exporting\u003c/h3>\u003cp>On any extension you can edit, the detail panel has an \u003cstrong>Export\u003c/strong> button. It downloads \u003ccode>&lt;id&gt;-&lt;version&gt;.olx\u003c/code> \u2014 a JSON document containing your extension's \u003cstrong>source\u003c/strong> (not compiled code), its metadata and declared permissions, an integrity hash, and a \u003cstrong>signature\u003c/strong> from your bot's publisher key.\u003c/p>\u003ch3 id=\"importing\">Importing\u003c/h3>\u003cp>The \u003cstrong>Import .olx\u003c/strong> button on the Extensions tab opens a file picker, then shows a \u003cstrong>review screen\u003c/strong> before anything is installed:\u003c/p>\u003cul>\u003cli>\u003cstrong>What it adds\u003c/strong> \u2014 its tools and commands.\u003c/li>\u003cli>\u003cstrong>Signature\u003c/strong> \u2014 *Signed &amp; verified* (with the publisher's fingerprint), *Unsigned*, or *Signature invalid*.\u003c/li>\u003cli>\u003cstrong>Capabilities to grant\u003c/strong> \u2014 every permission it requests, as checkboxes. You grant a subset; anything you leave unchecked simply won't work for the extension.\u003c/li>\u003c/ul>\u003cp>Press \u003cstrong>Install\u003c/strong> and it's added as a custom extension you can then enable per server.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">The bot re-derives everything\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>On import, Olisar \u003cstrong>re-transpiles the source itself\u003c/strong> and re-checks the signature \u2014 it never trusts pre-built code from a file. A bundle whose signature doesn't match its contents is refused outright.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">Imported code is third-party\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>An imported extension runs real code in your bot. Grant only the capabilities you're comfortable with, and note that \u003cstrong>host secrets are off-limits to imported extensions\u003c/strong> regardless of what you grant (see \u003ca href=\"#ext-security\" data-doc=\"ext-security\">Security &amp; trust\u003c/a>). Prefer extensions from a \u003cstrong>verified publisher\u003c/strong>.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"signing-briefly\">Signing, briefly\u003c/h3>\u003cp>Your bot has its own Ed25519 \u003cstrong>publisher key\u003c/strong>, created automatically the first time you export or publish. The private key never leaves your machine; the public key (and a short *fingerprint*) travel with your bundles so others can confirm a bundle is really from you and hasn't been altered. More in \u003ca href=\"#ext-security\" data-doc=\"ext-security\">Security &amp; trust\u003c/a>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-marketplace\" hidden>\u003ch1 class=\"docs-title\">The marketplace\u003c/h1>\u003cdiv class=\"doc\">\u003cp>The marketplace is a shared catalog of extensions, hosted on Cloudflare. Browsing, installing, and publishing all happen from your console \u2014 the bot talks to the registry for you.\u003c/p>\u003ch3 id=\"browsing-and-installing\">Browsing and installing\u003c/h3>\u003cp>On the Extensions tab, \u003cstrong>Marketplace\u003c/strong> opens a searchable catalog. Each result shows the publisher (with a \u003cstrong>\u2713 verified\u003c/strong> badge if they're Discord-verified), the version, and the capabilities it requests. \u003cstrong>Install\u003c/strong> runs the exact same \u003ca href=\"#ext-share\" data-doc=\"ext-share\">consent screen\u003c/a> as a file import \u2014 review what it adds and what it can access, grant a subset of permissions, and confirm. The bot downloads the bundle, re-verifies its signature, and installs it as a custom extension.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Installed = third-party\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Marketplace extensions are held to the same rules as file imports: re-verified on install, granted only the capabilities you approve, and \u003cstrong>blocked from host secrets\u003c/strong> (see \u003ca href=\"#ext-security\" data-doc=\"ext-security\">Security &amp; trust\u003c/a>).\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"publishing-your-own\">Publishing your own\u003c/h3>\u003cp>On an extension you authored, the detail panel has a \u003cstrong>Publish\u003c/strong> button. The first time, you'll be asked to \u003cstrong>claim a publisher handle\u003c/strong> \u2014 your namespace in the catalog (e.g. \u003ccode>m-studio\u003c/code>). It's bound to your bot's \u003ca href=\"#ext-security\" data-doc=\"ext-security\">publisher key\u003c/a>: once you own a handle, only your key can publish under it, and every bundle you publish is signed by it.\u003c/p>\u003cp>Once it's live, the panel shows a \u003cstrong>Published\u003c/strong> badge with its catalog version. Edit the code and it flags \u003cstrong>unpublished changes\u003c/strong>, and the button becomes \u003cstrong>Push update\u003c/strong> \u2014 click it to publish your new source. Bump the \u003ccode>version\u003c/code> in your code first if you want existing installs to be \u003cstrong>offered the update\u003c/strong>: a same-version re-publish overwrites in place, so people who already installed it won't be prompted to update.\u003c/p>\u003ch3 id=\"removing-a-version\">Removing a version\u003c/h3>\u003cp>\u003cstrong>Yank\u003c/strong> pulls a version \u2014 or the whole extension \u2014 from the catalog. It stops appearing for everyone; anyone who already installed it sees a *Removed from marketplace* note but it keeps working. If an extension you \u003cstrong>installed\u003c/strong> from the marketplace is later yanked, it automatically \u003cstrong>reverts to a plain local extension\u003c/strong> \u2014 it drops the Marketplace label, keeps the capabilities you granted, and becomes publishable again, so you can keep using it or re-list it under your own handle.\u003c/p>\u003ch3 id=\"the-verified-badge\">The verified badge\u003c/h3>\u003cp>Claiming a handle proves you hold the key; the \u003cstrong>verified\u003c/strong> badge additionally proves the handle belongs to a real Discord account. In the Marketplace view, a registered publisher sees \u003cstrong>Verify with Discord\u003c/strong> \u2014 click it, approve on Discord, and your published extensions show a \u003cstrong>\u2713 Discord-verified\u003c/strong> badge to everyone.\u003c/p>\u003cdiv class=\"callout callout-warning\">\u003cdiv class=\"callout-label\">One-time setup for verification\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>Verification uses a Discord OAuth redirect, so you must register its callback URL in your bot's Discord app (Developer Portal \u2192 your app \u2192 \u003cstrong>OAuth2 \u2192 Redirects\u003c/strong>), next to your existing login redirect: \u003ccode>&lt;your console URL&gt;/api/marketplace/verify/callback\u003c/code> (e.g. \u003ccode>http://localhost:8000/api/marketplace/verify/callback\u003c/code>). Without it, Discord rejects the flow with \u003ccode>invalid redirect_uri\u003c/code>. See \u003ca href=\"#hosting\" data-doc=\"hosting\">Hosting &amp; access\u003c/a> for your URL.\u003c/p>\u003c/div>\u003c/div>\u003ch3 id=\"self-hosting-pointing-elsewhere\">Self-hosting / pointing elsewhere\u003c/h3>\u003cp>The registry the console uses is configurable via the \u003ccode>OLISAR_REGISTRY_URL\u003c/code> environment variable (it defaults to the official hosted one). Point it at your own Cloudflare Worker to run a private marketplace \u2014 the bundle format and signing are the same, so trust still travels with each signed \u003ccode>.olx\u003c/code>.\u003c/p>\u003cdiv class=\"callout callout-note\">\u003cdiv class=\"callout-label\">Cost\u003c/div>\u003cdiv class=\"callout-body\">\u003cp>The hosted registry runs within Cloudflare's free tier, with hard caps on storage and writes so it can never bill. Bundles are tiny (source only), so a catalog is effectively free to run.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"doc-section\" data-id=\"ext-security\" hidden>\u003ch1 class=\"docs-title\">Security &amp; trust\u003c/h1>\u003cdiv class=\"doc\">\u003cp>Extensions run real code, so Olisar runs them under a strict, layered security model. This page explains what protects you \u2014 useful whether you're authoring, installing, or just deciding whether to trust an extension.\u003c/p>\u003ch3 id=\"the-sandbox\">The sandbox\u003c/h3>\u003cp>Every extension runs in a \u003cstrong>sealed JavaScript sandbox\u003c/strong> that starts with \u003cstrong>no access to anything\u003c/strong>. It cannot touch the filesystem, open arbitrary network connections, read environment variables, or reach the bot's internals. The only way out is the \u003ccode>host.*\u003c/code> capabilities \u2014 and each of those works only if the operator granted its permission. Every run has a time and memory budget, so a slow or runaway extension can't hang the bot.\u003c/p>\u003cp>\u003ccode>host.fetch\u003c/code> is the one network door, and it's guarded: only public HTTP(S) hosts (loopback and private addresses are blocked, preventing access to internal services), with caps on response size, timeout, and the number of calls per run.\u003c/p>\u003ch3 id=\"permissions-requested-vs-granted\">Permissions: requested vs granted\u003c/h3>\u003cp>Two separate things:\u003c/p>\u003cul>\u003cli>\u003cstrong>Requested\u003c/strong> \u2014 the capabilities an extension declares in \u003ccode>permissions\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Granted\u003c/strong> \u2014 what the operator actually approves.\u003c/li>\u003c/ul>\u003cp>When you author an extension you grant what you declare. When you \u003cstrong>install\u003c/strong> one from a file or the marketplace, the \u003ca href=\"#ext-share\" data-doc=\"ext-share\">consent screen\u003c/a> lets you grant a \u003cstrong>subset\u003c/strong> \u2014 uncheck anything you don't want, and that capability is simply unavailable to the extension at runtime.\u003c/p>\u003ch3 id=\"host-secrets-are-off-limits-to-third-parties\">Host secrets are off-limits to third parties\u003c/h3>\u003cp>\u003ccode>host.secret\u003c/code> exposes the operator's own keys (Gemini, Cloudflare, UEX). \u003cstrong>First-party\u003c/strong> extensions (built-ins and ones you authored locally) may use them once granted. \u003cstrong>Imported and marketplace\u003c/strong> extensions are \u003cstrong>blocked from host secrets entirely\u003c/strong> \u2014 even if you tick the box \u2014 so installed third-party code can never read or exfiltrate your keys. The consent screen marks those requests as unavailable.\u003c/p>\u003cp>The same first-party bar applies to the other powerful capabilities: \u003ccode>host.generate\u003c/code> (host-paid model calls), \u003ccode>host.discord.send\u003c/code> (unprompted channel posts), and \u003cstrong>event hooks\u003c/strong> like \u003ccode>memberJoin\u003c/code>. Built-in and locally-authored extensions can use them; imported and marketplace code can't, regardless of what's granted.\u003c/p>\u003ch3 id=\"signing-and-integrity\">Signing and integrity\u003c/h3>\u003cp>Every bundle carries a \u003cstrong>content hash\u003c/strong> and an \u003cstrong>Ed25519 signature\u003c/strong>:\u003c/p>\u003cul>\u003cli>The hash detects accidental corruption.\u003c/li>\u003cli>The signature ties the bundle to a publisher's key, so it can't be tampered with or impersonated. Your bot's private key never leaves your machine; only the public key + a short \u003cstrong>
