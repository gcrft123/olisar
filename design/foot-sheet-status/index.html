<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot status in the closed foot sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* The console's tokens, copied from web/src/index.css. */
  :root {
    --bg: #020203; --bg-sidebar: #040405; --panel: #08080a; --bg-inset: #0f0f12;
    --border: #26262a; --border-strong: #323237;
    --text: #ededee; --text-2: #9d9da7; --text-3: #7f7f8a;
    --accent: #5b9cf6; --accent-soft: rgba(91, 156, 246, 0.16);
    --ok: #43cf8e; --ok-soft: rgba(67, 207, 142, 0.14);
    --warn: #e3a13a; --warn-soft: rgba(227, 161, 58, 0.14);
    --danger: #ff6369; --danger-soft: rgba(255, 99, 105, 0.13);
    --info: #5fc4f2;
    --radius: 16px; --radius-sm: 12px; --radius-xs: 8px;
    --ease-out: cubic-bezier(0.2, 0.9, 0.3, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 44px 56px; background: var(--bg); color: var(--text);
    font: 400 13px/1.45 "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { color: var(--text-2); margin: 0 0 28px; max-width: 760px; }

  .grid { display: grid; grid-template-columns: 236px repeat(6, 244px); gap: 14px 16px; align-items: start; }
  .colhead { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); padding: 0 2px 2px; }
  .vname { padding-top: 14px; }
  .vname b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .vname p { margin: 4px 0 0; color: var(--text-2); font-size: 12.5px; line-height: 1.45; }

  /* One cell: the bottom of the rail, with the last nav row above the closed sheet. */
  .rail {
    position: relative; width: 244px; height: 118px; overflow: hidden;
    background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .ctx {
    position: absolute; left: 14px; right: 14px; bottom: calc(var(--peek) + 14px);
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    color: var(--text-2); font-size: 13.5px;
  }
  .ctx svg { width: 18px; height: 18px; }
  .ic { display: grid; place-items: center; width: 19px; height: 19px; flex: none; }

  .sheet {
    --c: var(--text-3); --c-soft: transparent;
    position: absolute; left: 8px; right: 8px; bottom: 0; height: var(--peek);
    background: var(--panel); border: 1px solid var(--border); border-bottom: 0;
    border-radius: var(--radius) var(--radius) 0 0; overflow: hidden;
  }
  .sheet.ok { --c: var(--ok); --c-soft: var(--ok-soft); }
  .sheet.warn { --c: var(--warn); --c-soft: var(--warn-soft); }
  .sheet.danger { --c: var(--danger); --c-soft: var(--danger-soft); }
  .sheet.accent { --c: var(--accent); --c-soft: var(--accent-soft); }

  .head { height: 100%; padding: 7px 15px 0; display: flex; flex-direction: column; gap: 7px; }
  .grabber { align-self: center; flex: none; width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lbl { color: var(--text-2); font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet.warn .lbl.tint { color: var(--warn); }
  .sheet.danger .lbl.tint { color: var(--danger); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* 1 · Dot (what's built) */
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--c-soft); }

  /* 2 · Power button in miniature */
  .v-power .head { gap: 6px; }
  /* The ring is wider than the icon column, so the cell grows by 3px, split evenly, and its
     center stays on the nav icons' center. */
  .v-power .ic { width: 22px; margin-left: -1.5px; }
  .pwr {
    position: relative; width: 22px; height: 22px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--bg-inset); color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 45%, var(--border-strong));
    box-shadow: 0 0 0 2px var(--c-soft);
  }
  .sheet:not(.ok):not(.warn):not(.danger):not(.accent) .pwr { border-color: var(--border-strong); }
  .pwr > svg { width: 11px; height: 11px; }
  .pwr .arc { position: absolute; inset: -4px; animation: spin 0.9s linear infinite; }
  .pwr .arc circle { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 22 72; }

  /* 3 · Lit grabber */
  .v-grabber .head { align-items: center; padding-top: 8px; gap: 6px; }
  .v-grabber .grabber { width: 40px; background: var(--c); box-shadow: 0 0 10px 1px var(--c-soft), 0 0 0 3px var(--c-soft); }
  .v-grabber .sheet.off .grabber { background: var(--border-strong); box-shadow: none; }
  .v-grabber .sheet.accent .grabber { animation: pulse 1.2s ease-in-out infinite; }
  .v-grabber .lbl { font-size: 12px; }

  /* 4 · Status badge (DESIGN.md's Badge, without the device-pixel rounding) */
  .v-badge .ic svg { width: 17px; height: 17px; color: var(--text-3); }
  .badge {
    --ink: var(--text-2);
    --fill: color-mix(in srgb, var(--ink) 14%, var(--bg-inset));
    margin-left: auto; display: inline-flex; align-items: center; flex: none;
    height: 22px; padding: 0 7px 0 0; border: 1px solid transparent; border-radius: 999px;
    background:
      linear-gradient(var(--fill), var(--fill)) padding-box,
      linear-gradient(color-mix(in srgb, var(--ink) 52%, var(--bg-inset)), color-mix(in srgb, var(--ink) 34%, var(--bg-inset)) 50%, color-mix(in srgb, var(--ink) 22%, var(--bg-inset))) border-box;
    color: var(--ink); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
  }
  .badge.success { --ink: var(--ok); } .badge.info { --ink: var(--info); }
  .badge.warning { --ink: var(--warn); } .badge.danger { --ink: var(--danger); }
  .badge > svg { width: 22px; height: 22px; margin: -1px; flex: none; }
  .badge .disc { fill: currentColor; opacity: 0.2; }
  .badge .track { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.3; }
  .badge .spin { transform-origin: 12px 12px; animation: spin 0.8s linear infinite; }
  .badge .spin circle { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 15.71 47.12; stroke-linecap: round; }

  /* 5 · Presence on the bot's avatar */
  .v-presence .row { gap: 11px; }
  .av {
    position: relative; width: 30px; height: 30px; flex: none; margin-left: -5px;
    border-radius: var(--radius-xs); display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px;
  }
  .pres {
    position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%;
    border: 2.5px solid var(--panel); background: var(--c);
  }
  .pres::after { content: ''; position: absolute; }
  /* idle's crescent: rate-limited, up but not answering */
  .warn .pres::after { width: 5px; height: 5px; border-radius: 50%; left: -0.5px; top: -0.5px; background: var(--panel); }
  /* do-not-disturb's bar: refused */
  .danger .pres::after { left: 1.5px; right: 1.5px; top: 2.5px; height: 1.6px; border-radius: 1px; background: var(--panel); }
  /* offline's hollow ring */
  .off .pres::after { inset: 2px; border-radius: 50%; background: var(--panel); }
  /* starting: a turning arc */
  .accent .pres { background: var(--panel); }
  .accent .pres::after { inset: -0.5px; border-radius: 50%; border: 1.8px solid var(--accent); border-top-color: transparent; animation: spin 0.9s linear infinite; }
  .unknown .pres { opacity: 0.55; }
  .two { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .two .lbl { color: var(--text); line-height: 1.25; }
  .sub { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 6 · Edge light */
  .v-edge .ic svg { width: 17px; height: 17px; color: var(--text-3); }
  .v-edge .sheet:not(.off) {
    border-color: color-mix(in srgb, var(--c) 55%, var(--border));
    background: linear-gradient(color-mix(in srgb, var(--c) 9%, var(--panel)), var(--panel) 70%);
    box-shadow: 0 -10px 22px -10px var(--c);
  }
  .v-edge .sheet.accent::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.6s var(--ease-out) infinite;
  }

  /* 7 · Uptime strip */
  .v-strip .row { justify-content: space-between; }
  .strip { display: flex; align-items: center; gap: 2px; flex: none; height: 18px; }
  .tick { width: 3px; height: 12px; border-radius: 1.5px; opacity: 0.75; }
  .tick:last-child { height: 16px; opacity: 1; }
  .t-o { background: var(--ok); } .t-w { background: var(--warn); } .t-d { background: var(--danger); }
  .t-x { background: var(--border-strong); } .t-_ { background: var(--bg-inset); }
  .t-s { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .pwr .arc, .accent .pres::after, .badge .spin { animation-duration: 2.4s; }
    .v-grabber .sheet.accent .grabber, .t-s, .v-edge .sheet.accent::before { animation-duration: 3.6s; }
  }
</style>
</head>
<body>
<h1>Bot status in the closed foot sheet</h1>
<p class="lede">Seven ways to draw the bot's state on the closed sheet at the foot of the console's rail. Each column is a state BotPower reports; each cell is the bottom of the 244px rail at 100%, with the last nav row above the sheet.</p>
<div class="grid" id="grid"></div>
<script>
const I = {"BoltBold": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><path d=\"M5.66953 9.91436L8.73167 5.77133C10.711 3.09327 11.7007 1.75425 12.6241 2.03721C13.5474 2.32018 13.5474 3.96249 13.5474 7.24712V7.55682C13.5474 8.74151 13.5474 9.33386 13.926 9.70541L13.946 9.72466C14.3327 10.0884 14.9492 10.0884 16.1822 10.0884C18.4011 10.0884 19.5106 10.0884 19.8855 10.7613C19.8917 10.7724 19.8977 10.7837 19.9036 10.795C20.2576 11.4784 19.6152 12.3475 18.3304 14.0857L15.2683 18.2287C13.2889 20.9067 12.2992 22.2458 11.3758 21.9628C10.4525 21.6798 10.4525 20.0375 10.4525 16.7528L10.4526 16.4433C10.4526 15.2585 10.4526 14.6662 10.074 14.2946L10.054 14.2754C9.6673 13.9117 9.05079 13.9117 7.81775 13.9117C5.59888 13.9117 4.48945 13.9117 4.1145 13.2387C4.10829 13.2276 4.10225 13.2164 4.09639 13.205C3.74244 12.5217 4.3848 11.6526 5.66953 9.91436Z\" fill=\"currentColor\"></path></svg>", "Bolt": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><path d=\"M5.66953 9.91436L8.73167 5.77133C10.711 3.09327 11.7007 1.75425 12.6241 2.03721C13.5474 2.32018 13.5474 3.96249 13.5474 7.24712V7.55682C13.5474 8.74151 13.5474 9.33386 13.926 9.70541L13.946 9.72466C14.3327 10.0884 14.9492 10.0884 16.1822 10.0884C18.4011 10.0884 19.5106 10.0884 19.8855 10.7613C19.8917 10.7724 19.8977 10.7837 19.9036 10.795C20.2576 11.4784 19.6152 12.3475 18.3304 14.0857L15.2683 18.2287C13.2889 20.9067 12.2992 22.2458 11.3758 21.9628C10.4525 21.6798 10.4525 20.0375 10.4525 16.7528L10.4526 16.4433C10.4526 15.2585 10.4526 14.6662 10.074 14.2946L10.054 14.2754C9.6673 13.9117 9.05079 13.9117 7.81775 13.9117C5.59888 13.9117 4.48945 13.9117 4.1145 13.2387C4.10829 13.2276 4.10225 13.2164 4.09639 13.205C3.74244 12.5217 4.3848 11.6526 5.66953 9.91436Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path></svg>", "PlayCircle": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"></circle><path d=\"M15.4137 10.941C16.1954 11.4026 16.1954 12.5974 15.4137 13.059L10.6935 15.8458C9.93371 16.2944 9 15.7105 9 14.7868L9 9.21316C9 8.28947 9.93371 7.70561 10.6935 8.15419L15.4137 10.941Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path></svg>", "StopCircle": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"></circle><path d=\"M8 12C8 10.1144 8 9.17157 8.58579 8.58579C9.17157 8 10.1144 8 12 8C13.8856 8 14.8284 8 15.4142 8.58579C16 9.17157 16 10.1144 16 12C16 13.8856 16 14.8284 15.4142 15.4142C14.8284 16 13.8856 16 12 16C10.1144 16 9.17157 16 8.58579 15.4142C8 14.8284 8 13.8856 8 12Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path></svg>", "CloseCircle": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"></circle><path d=\"M14.5 9.50002L9.5 14.5M9.49998 9.5L14.5 14.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path></svg>", "DangerCircle": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"></circle><path d=\"M12 7V13\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><circle cx=\"12\" cy=\"16\" r=\"1\" fill=\"currentColor\"></circle></svg>", "MinusCircle": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"></circle><path d=\"M15 12H9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path></svg>", "DocumentText": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" color=\"currentColor\" fill=\"none\" viewBox=\"0 0 24 24\"><path d=\"M3 10C3 6.22876 3 4.34315 4.17157 3.17157C5.34315 2 7.22876 2 11 2H13C16.7712 2 18.6569 2 19.8284 3.17157C21 4.34315 21 6.22876 21 10V14C21 17.7712 21 19.6569 19.8284 20.8284C18.6569 22 16.7712 22 13 22H11C7.22876 22 5.34315 22 4.17157 20.8284C3 19.6569 3 17.7712 3 14V10Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path><path d=\"M8 12H16\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><path d=\"M8 8H16\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><path d=\"M8 16H13\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path></svg>"}
const svg = (s, cls = '') => s.replace('<svg ', `<svg class="${cls}" aria-hidden="true" `).replace(/ width="24" height="24"/, '')

const STATES = [
  { id: 'online',   head: 'Online',        label: 'Bot online',            word: 'Online',        tone: 'ok',
    badge: ['success', 'PlayCircle', 'Online'],        strip: 'oooooooowooooooooo' },
  { id: 'starting', head: 'Starting',      label: 'Starting up…',          word: 'Starting…',     tone: 'accent',
    badge: ['info', null, 'Starting…'],                strip: 'oooooooooooxxxxxxs' },
  { id: 'limited',  head: 'Rate-limited',  label: 'Offline: rate-limited', word: 'Rate-limited',  tone: 'warn',
    badge: ['warning', 'DangerCircle', 'Rate-limited'], strip: 'ooooooooooooowwwww' },
  { id: 'offline',  head: 'Switched off',  label: 'Bot offline',           word: 'Offline',       tone: 'off',
    badge: ['warning', 'StopCircle', 'Offline'],       strip: 'oooooooooooxxxxxxx' },
  { id: 'refused',  head: 'Refused or crashed', label: 'Can’t connect',    word: 'Can’t connect', tone: 'danger',
    badge: ['danger', 'CloseCircle', 'Can’t connect'], strip: 'oooooodoooodddoddd' },
  { id: 'unknown',  head: 'Unknown',       label: 'Bot status unknown',    word: 'Unknown',       tone: 'off',
    badge: ['', 'MinusCircle', 'Unknown'],             strip: 'ooooooooooooo_____' },
]

function badge([tone, glyph, word]) {
  let g
  if (glyph) {
    g = I[glyph].replace('viewBox="0 0 24 24">', 'viewBox="-10 -10 44 44"><circle class="disc" cx="12" cy="12" r="10"/>')
  } else {
    g = `<svg viewBox="-10 -10 44 44"><circle class="track" cx="12" cy="12" r="10"/><g class="spin"><circle cx="12" cy="12" r="10"/></g></svg>`
  }
  return `<span class="badge ${tone}">${svg(g)}${word}</span>`
}

const VARIANTS = [
  { id: 'dot', name: '1 · Dot', peek: 49,
    note: 'What’s built. The dot sits in the nav’s icon column and the label in its label column.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="ic"><span class="dot"></span></span><span class="lbl tint">${s.label}</span></span>` },
  { id: 'power', name: '2 · Power button', peek: 49,
    note: 'The power button the sheet opens, in miniature and in the same colors, so the closed sheet previews the control inside it.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="ic"><span class="pwr">${s.id === 'starting' ? '<svg class="arc" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14"/></svg>' : ''}${svg(I.BoltBold)}</span></span><span class="lbl tint">${s.label}</span></span>` },
  { id: 'grabber', name: '3 · Lit grabber', peek: 40,
    note: 'The grabber is the light, and a word under it says what the color means. The closed sheet is 9px shorter.',
    head: (s) => `<span class="grabber"></span><span class="lbl tint">${s.word}</span>` },
  { id: 'badge', name: '4 · Status badge', peek: 49,
    note: 'The console’s own Badge, whose tones and glyphs already mean running, stopped, failed and working on it.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="ic">${svg(I.Bolt)}</span><span class="lbl">Bot</span>${badge(s.badge)}</span>` },
  { id: 'presence', name: '5 · Presence', peek: 58,
    note: 'Discord’s presence marks on the bot’s avatar, where shape as well as color sets the states apart. The second line is who’s signed in.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="av">R<span class="pres"></span></span><span class="two"><span class="lbl">${s.word}</span><span class="sub">Signed in as gcrft123</span></span></span>` },
  { id: 'edge', name: '6 · Edge light', peek: 49,
    note: 'The sheet’s edge takes the state’s color and throws it onto the rail above. The row stays neutral.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="ic">${svg(I.Bolt)}</span><span class="lbl">${s.label}</span></span>` },
  { id: 'strip', name: '7 · Uptime strip', peek: 49,
    note: 'The last hour in 3-minute ticks, newest on the right: the only one that shows a bot crashing and coming back. The backend keeps no history to draw it from yet.',
    head: (s) => `<span class="grabber"></span><span class="row"><span class="lbl tint">${s.word}</span><span class="strip">${[...s.strip].map((c) => `<span class="tick t-${c}"></span>`).join('')}</span></span>` },
]

const grid = document.getElementById('grid')
grid.insertAdjacentHTML('beforeend', '<div></div>' + STATES.map((s) => `<div class="colhead">${s.head}</div>`).join(''))
for (const v of VARIANTS) {
  grid.insertAdjacentHTML('beforeend', `<div class="vname"><b>${v.name}</b><p>${v.note}</p></div>`)
  for (const s of STATES) {
    grid.insertAdjacentHTML('beforeend', `
      <div class="v-${v.id}"><div class="rail" style="--peek: ${v.peek}px">
        <div class="ctx">${svg(I.DocumentText)}Docs</div>
        <div class="sheet ${s.tone} ${s.id}"><div class="head">${v.head(s)}</div></div>
      </div></div>`)
  }
}
</script>
</body>
</html>
