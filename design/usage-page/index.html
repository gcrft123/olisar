<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage · Olisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The console's tokens, copied from web/src/index.css. */
  :root {
    color-scheme: dark;
    --bg: #020203; --bg-sidebar: #040405; --panel: #08080a; --bg-inset: #0f0f12; --input-bg: #0f0f12;
    --border: #26262a; --border-strong: #323237;
    --text: #ededee; --text-2: #9d9da7; --text-3: #7f7f8a;
    --accent: #5b9cf6; --accent-soft: rgba(91, 156, 246, 0.16);
    --accent-violet: #8a8af2; --accent-blue: #5b9cf6; --accent-teal: #2dd4bf;
    --accent-green: #43cf8e; --accent-amber: #e0a458; --accent-rose: #f2728a;
    --ok: #43cf8e; --ok-soft: rgba(67, 207, 142, 0.14); --ok-border: rgba(67, 207, 142, 0.34);
    --danger: #ff6369; --danger-soft: rgba(255, 99, 105, 0.13); --danger-border: rgba(255, 99, 105, 0.34);
    --warn: #e3a13a; --warn-soft: rgba(227, 161, 58, 0.14); --warn-border: rgba(227, 161, 58, 0.34);
    --info: #5fc4f2; --neutral: #9d9da7;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 16px; --radius-sm: 12px; --radius-xs: 8px; --radius-pill: 999px;
    --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.5);
    --ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    --ease-out: cubic-bezier(0.2, 0.9, 0.3, 1);
    --dur-fast: .12s; --dur-mid: .16s; --dur-slow: .3s;
    /* The console's default interface size. */
    --ui-scale: 1.1;
    zoom: var(--ui-scale);
    --vh: calc(100vh / var(--ui-scale));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-sans); font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-wrap: break-word;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.014em; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  svg { display: block; }
  .mono { font-family: var(--font-mono); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── The console's shell: rail + main column ─────────────────────────── */
  .shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100%; }
  .sidebar {
    --foot-peek: 49px; border-right: 1px solid var(--border); background: var(--bg-sidebar);
    position: sticky; top: 0; height: var(--vh); display: flex; flex-direction: column;
    padding-bottom: var(--foot-peek); overflow: clip;
  }
  .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 2px; }
  .bot-switch { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin-bottom: 12px; border-radius: var(--radius-sm); }
  .bot-av { width: 30px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
  .bot-switch-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.3; }
  .bot-switch-text .name { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .bot-switch-text .sub { font-size: 11px; font-weight: 500; color: var(--text-3); }
  .chev { color: var(--text-3); flex: none; width: 14px; height: 14px; }
  .chev svg { width: 14px; height: 14px; }
  .server-switch { display: flex; align-items: center; gap: 8px; margin: 2px 0 16px; padding: 5px 8px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--input-bg); font-size: 13px; font-weight: 500; }
  .server-icon { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; }
  .server-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 26px; }
  .search-trigger { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 5px 0 11px; margin-bottom: 14px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-3); font-size: 13px; }
  .search-trigger svg { width: 16px; height: 16px; }
  .search-trigger kbd { margin-left: auto; }
  kbd { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); line-height: 1.6; padding: 1px 6px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--bg-inset); white-space: nowrap; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 13.5px; text-decoration: none; user-select: none; }
  .nav-item:hover { background: var(--bg-inset); color: var(--text); }
  .nav-item.active { background: var(--bg-inset); color: var(--text); font-weight: 600; }
  .nav-item .ic { display: grid; place-items: center; width: 19px; height: 19px; flex: none; }
  .nav-item .ic svg { width: 19px; height: 19px; }
  .nav-rule { height: 1px; background: var(--border); margin: 10px 10px 9px; }
  /* The closed foot sheet, as built: the bolt, "Bot" and the status badge, with the edge glow. */
  .foot-sheet { position: absolute; left: 8px; right: 8px; bottom: 0; height: var(--foot-peek); isolation: isolate;
    background: var(--panel); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; }
  .foot-sheet::before { content: ''; position: absolute; inset: -1px -1px 0; z-index: -1; border-radius: inherit;
    border: 1px solid color-mix(in srgb, var(--glow) 42%, transparent); border-bottom: 0;
    background: color-mix(in srgb, var(--glow) 5%, transparent);
    box-shadow: 0 -6px 18px -8px color-mix(in srgb, var(--glow) 45%, transparent);
    -webkit-mask-image: linear-gradient(#000, transparent var(--foot-peek)); mask-image: linear-gradient(#000, transparent var(--foot-peek)); }
  .foot-sheet.breathe::before { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.45; } }
  .foot-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 7px auto 0; }
  .foot-status { display: flex; align-items: center; gap: 10px; padding: 6px 14px 0 15px; color: var(--text-2); font-size: 13px; font-weight: 500; }
  .foot-status .ic { width: 19px; height: 19px; display: grid; place-items: center; color: var(--text-3); }
  .foot-status .ic svg { width: 18px; height: 18px; }
  .foot-status .badge { margin-left: auto; }

  .main { padding: 40px 44px 110px; width: 100%; max-width: 1180px; margin: 0 auto; min-width: 0; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .title-row { display: flex; align-items: center; gap: 11px; }
  .title-ic { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; display: grid; place-items: center;
    background: var(--bg-inset); border: 1px solid var(--border); }
  .title-ic svg { width: 18px; height: 18px; }
  .title-row h1 { font-size: 22px; }
  .btn { height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; font-weight: 550; font-size: 13px;
    border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--text-2); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .btn:hover { background: var(--bg-inset); color: var(--text); }
  .btn svg { width: 16px; height: 16px; }

  /* ── Badge (web/src/index.css, whole-pixel rounding left out) ─────────── */
  .badge {
    --ink: var(--text-2); --badge-fill: color-mix(in srgb, var(--ink) 14%, var(--bg-inset)); --badge-h: 22px; --badge-bw: 1px;
    display: inline-flex; align-items: center; flex: none; height: var(--badge-h); padding: 0 7px 0 0;
    border: var(--badge-bw) solid transparent; border-radius: var(--radius-pill);
    background:
      linear-gradient(var(--badge-fill), var(--badge-fill)) padding-box,
      linear-gradient(color-mix(in srgb, var(--ink) 52%, var(--bg-inset)), color-mix(in srgb, var(--ink) 34%, var(--bg-inset)) 50%,
        color-mix(in srgb, var(--ink) 22%, var(--bg-inset))) border-box;
    color: var(--ink); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; vertical-align: middle;
  }
  .badge.info { --ink: var(--info); } .badge.success { --ink: var(--ok); }
  .badge.warning { --ink: var(--warn); } .badge.danger { --ink: var(--danger); }
  .badge-ic { flex: none; display: block; width: var(--badge-h); height: var(--badge-h); margin: calc(-1 * var(--badge-bw)); }
  .badge-disc { fill: currentColor; opacity: 0.2; }
  .ring-track { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.3; }
  .ring-arc { transform-origin: 12px 12px; animation: spin 0.8s linear infinite; }
  .ring-arc circle { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 15.71 47.12; stroke-linecap: round; }
  .badge .num { font-family: var(--font-mono); font-size: 11.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* ── Section (the flat group), stacked ───────────────────────────────── */
  .section { border-top: 1px solid var(--border); padding: 28px 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .section-head h2 { font-size: 15px; }
  .useg { display: inline-flex; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
  .useg button { font-size: 12px; color: var(--text-2); background: none; border: 0; padding: 5px 12px; border-radius: var(--radius-xs); cursor: pointer; }
  .useg button:hover { color: var(--text); }
  .useg button[aria-checked="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); font-weight: 500; }
  .useg button:focus-visible { box-shadow: var(--ring); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); line-height: 1.4; }

  .callout { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.6;
    border: 1px solid color-mix(in srgb, var(--cc) 34%, transparent); background: color-mix(in srgb, var(--cc) 9%, var(--panel));
    color: color-mix(in srgb, var(--cc) 22%, var(--text)); margin-bottom: 22px; }
  .callout .ic { color: var(--cc); margin-top: 2px; flex: none; }
  .callout .ic svg { width: 17px; height: 17px; }
  .callout.warning { --cc: var(--warn); } .callout.danger { --cc: var(--danger); }

  /* ── 1 + 2 · What's left, and what's replying ────────────────────────── */
  /* Two readings of right now, side by side and split by a hairline, over the one bar they
     share: the chain, drawn to scale, what's left of it in the accent. */
  .now { border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .now-left { padding: 26px 32px 26px 0; min-width: 0; }
  .now-right { padding: 26px 0 26px 32px; border-left: 1px solid var(--border); min-width: 0; display: flex; flex-direction: column; }
  .now .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 22px; }
  .hero-num { font-size: 60px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; margin-top: 12px;
    font-variant-numeric: proportional-nums; transition: opacity var(--dur-slow) var(--ease-out); }
  .hero-num.zero { color: var(--text-3); }
  .hero-sub { color: var(--text-2); margin-top: 12px; font-size: 13.5px; }
  .hero-sub b { color: var(--text); font-weight: 500; }
  .cur-name { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 16px; overflow-wrap: anywhere; }
  .cur-name.none { color: var(--text-2); }
  .cur-id { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
  .stale .hero-num, .stale .cur-name, .stale .side-limits, .stale .pace,
  .chain.stale tbody { opacity: 0.55; }

  .now-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 14px 32px; flex-wrap: wrap; padding: 18px 0 20px; border-top: 1px solid var(--border); }
  .pace { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .pace svg { width: 16px; height: 16px; flex: none; }
  .pace.ok svg { color: var(--ok); }
  .pace.warn { color: var(--warn); } .pace.danger { color: var(--danger); }
  .side-limits { display: flex; gap: 10px 28px; flex-wrap: wrap; }
  .side { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); }
  .side .v { font-family: var(--font-mono); font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; }
  .side .v s { text-decoration: none; color: var(--text-3); }

  .mini { position: relative; width: 72px; height: 6px; border-radius: 3px; background: var(--bg-inset); box-shadow: inset 0 0 0 1px var(--border); flex: none; }
  .mini i { position: absolute; inset: 0; border-radius: 3px; background: var(--accent); clip-path: inset(0 0 0 var(--used)); transition: clip-path .5s var(--ease-out); }

  /* ── The chain ───────────────────────────────────────────────────────── */
  .chain { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .chain th, .chain td { padding: 10px 0; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; font-weight: 400; }
  .chain tbody tr:last-child > * { border-bottom: 0; }
  .chain thead th { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); padding: 0 0 9px; }
  .chain .c-rank { width: 34px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
  .chain .c-status { width: 196px; }
  .chain .c-today { width: 250px; }
  .chain tbody tr { transition: background var(--dur-fast) var(--ease-out); }
  .chain tbody tr.hl > * { background: var(--bg-inset); }
  .chain tbody tr.hl > :first-child { border-radius: var(--radius-xs) 0 0 var(--radius-xs); }
  .chain tbody tr.hl > :last-child { border-radius: 0 var(--radius-xs) var(--radius-xs) 0; }
  .chain tbody th.c-rank { padding-left: 2px; }
  .chain tbody td.c-today { padding-right: 8px; }
  .chain tr.cur .c-rank { color: var(--accent); }
  .m-name { font-weight: 500; }
  .chain tr.cur .m-name { font-weight: 600; }
  .chain tr.gone .m-name { color: var(--text-2); font-weight: 400; }
  .m-id { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); margin-left: 8px; }
  .m-status { display: none; }
  .st { display: flex; align-items: center; gap: 8px; }
  .st .when { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .today { display: flex; align-items: center; gap: 14px; }
  .today .mini { flex: 1; width: auto; min-width: 48px; overflow: hidden; }
  /* Quota Google says is gone although Olisar never counted it: something else on the project. */
  .today .mini .seg-lost { position: absolute; inset: 0 0 0 var(--used); border-radius: 0 3px 3px 0;
    background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--text-3) 42%, transparent) 0 1.5px, transparent 1.5px 5px); }
  .mini.out i { clip-path: inset(0 0 0 100%); }
  .today .v { width: 92px; flex: none; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .today .v s { text-decoration: none; font-size: 11.5px; color: var(--text-3); }
  .left-v { font-size: 13px; color: var(--text); }
  .chain tr.gone .left-v { color: var(--text-3); }

  /* ── 3 · By feature ─────────────────────────────────────────────────── */
  .feat { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 44px; align-items: center; }
  .donut { display: block; overflow: visible; }
  .donut-track { stroke: var(--bg-inset); fill: none; }
  .donut-seg { fill: none; stroke: currentColor; transition: opacity var(--dur-fast) var(--ease-out), stroke-width var(--dur-fast) var(--ease-out); }
  .donut.hover .donut-seg:not(.hl) { opacity: 0.28; }
  .donut-total { fill: var(--text); font-family: var(--font-sans); font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
  .donut-sub { fill: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .legend { display: flex; flex-direction: column; min-width: 0; }
  .lg { display: grid; grid-template-columns: 10px minmax(120px, 170px) minmax(0, 1fr) 62px 40px; align-items: center; gap: 12px;
    padding: 7px 8px; margin: 0 -8px; border-radius: var(--radius-xs); font-size: 13px; cursor: default; }
  .lg.hl { background: var(--bg-inset); }
  .lg .sw { width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
  .lg .nm { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg .bar { height: 6px; border-radius: 3px; background: currentColor; transform-origin: left; transition: transform .4s var(--ease-out); }
  .lg .val { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .lg .pc { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }
  .lg-parts { padding: 0 0 4px 22px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
  .lg-parts .mono { font-size: 11.5px; color: var(--text-2); }
  .lg-parts .sep { margin: 0 7px; }
  /* The chart hues, in the order that clears the colorblind check on this ground. */
  .c0 { color: var(--accent-blue); } .c1 { color: var(--accent-amber); } .c2 { color: var(--accent-teal); }
  .c3 { color: var(--accent-rose); } .c4 { color: var(--accent-violet); } .c5 { color: var(--text-3); }

  /* ── 4 · Stats ───────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { min-width: 0; padding: 4px 24px 6px; border-left: 1px solid var(--border); }
  .kpi:first-child { border-left: 0; padding-left: 0; }
  .kpi:last-child { padding-right: 0; }
  .kpi .big { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; margin-top: 10px; white-space: nowrap; }
  .kpi .big s { text-decoration: none; color: var(--text-3); font-size: 17px; font-weight: 500; letter-spacing: 0; }
  .kpi .cap { font-size: 12px; color: var(--text-2); margin-top: 7px; }
  .days-head { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 6px; }
  .days-head h3 { font-size: 13.5px; font-weight: 600; }
  .days-head span { color: var(--text-3); font-size: 12.5px; }
  .chartbox { width: 100%; min-width: 0; }
  .days-chart .grid { stroke: var(--border); }
  .days-chart .axis { fill: var(--text-3); font-family: var(--font-mono); font-size: 11px; }
  .days-chart .axis.on { fill: var(--text); }
  .days-chart .limit { stroke: var(--danger); stroke-opacity: 0.55; }
  .days-chart .limit-txt { fill: var(--danger); fill-opacity: 0.9; font-family: var(--font-mono); font-size: 11px; }
  .days-chart .bar { fill: color-mix(in srgb, var(--text-3) 55%, var(--bg)); transition: fill var(--dur-fast) var(--ease-out); }
  .days-chart .bar.today { fill: var(--accent); }
  .days-chart .bar.ranout { fill: color-mix(in srgb, var(--warn) 70%, var(--bg)); }
  .days-chart .col:hover .bar, .days-chart .col.hl .bar { fill: var(--text-2); }
  .days-chart .col:hover .bar.today, .days-chart .col.hl .bar.today { fill: #8dbaf9; }
  .days-chart .tag { fill: var(--text); font-family: var(--font-mono); font-size: 11px; }
  .days-chart .hit { fill: transparent; }

  /* ── Chart tooltip ──────────────────────────────────────────────────── */
  .ctip { position: fixed; z-index: 400; pointer-events: none; padding: 7px 10px; border-radius: var(--radius-xs);
    background: var(--panel); border: 1px solid var(--border-strong); box-shadow: var(--shadow-pop); font-size: 12px; line-height: 1.45;
    opacity: 0; transform: translateY(3px); transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); max-width: 260px; }
  .ctip.on { opacity: 1; transform: none; }
  .ctip b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; color: var(--text); }
  .ctip span { color: var(--text-2); }

  /* ── Preview strip (not part of the design) ─────────────────────────── */
  .preview { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; align-items: center; gap: 10px;
    padding: 4px 4px 4px 12px; border-radius: var(--radius); background: var(--panel); border: 1px dashed var(--border-strong); box-shadow: var(--shadow-pop); }
  .preview .useg { border: 0; background: transparent; padding: 0; }

  /* ── Narrow widths ──────────────────────────────────────────────────── */
  @media (max-width: 1180px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; }
    .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
    .kpi:nth-child(2) { padding-right: 0; }
    .chain .c-status { width: 150px; }
    .chain .m-id { display: none; }
  }
  @media (max-width: 960px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
    .main { padding: 28px 20px 110px; }
    .now { grid-template-columns: minmax(0, 1fr); }
    .now-right { border-left: 0; padding-left: 0; border-top: 1px solid var(--border); padding-top: 22px; }
    .now-left { padding-right: 0; }
    .feat { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 24px; }
    .legend { width: 100%; }
    .chain .c-today { width: 150px; }
    .today .mini { display: none; }
    .preview { position: static; margin: 0 20px 24px; overflow-x: auto; box-shadow: none; }
  }
  @media (max-width: 620px) {
    .hero-num { font-size: 48px; }
    .chain .c-status { display: none; }
    .m-status { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .m-status .when { font-size: 12px; color: var(--text-3); }
    .chain .c-rank { width: 26px; }
    .chain .c-today { width: 96px; }
    .lg { grid-template-columns: 10px minmax(0, 1fr) 58px 36px; }
    .lg .bar { display: none; }
    .kpis { grid-template-columns: minmax(0, 1fr); }
    .kpi, .kpi:nth-child(n) { border-left: 0; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-arc { animation-duration: 1.6s; }
    .mini i, .lg .bar, .ctip { transition-duration: 0s; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Console">
    <div class="sidebar-scroll">
      <div class="bot-switch">
        <span class="bot-av" aria-hidden="true">R</span>
        <span class="bot-switch-text"><span class="name">Red Nebula bot</span><span class="sub">Online</span></span>
        <span class="chev" data-icon="chevron"></span>
      </div>
      <div class="server-switch">
        <span class="server-icon" aria-hidden="true">R</span>
        <span class="server-name">Red Nebula Industries</span>
        <span class="chev" data-icon="chevron"></span>
      </div>
      <div class="search-trigger"><span data-icon="search"></span>Search<kbd>⌘K</kbd></div>
      <div id="nav"></div>
    </div>
    <div class="foot-sheet" aria-hidden="true">
      <div class="foot-grabber"></div>
      <div class="foot-status"><span class="ic" data-icon="bolt"></span>Bot<span id="foot-badge"></span></div>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="head-row">
      <div class="title-row"><span class="title-ic" data-icon="usage"></span><h1>Usage</h1></div>
      <button class="btn" type="button"><span data-icon="docs"></span>Docs</button>
    </div>

    <div id="stale-callout"></div>

    <!-- 1 + 2 -->
    <section class="now" id="now" aria-label="Right now">
      <div class="now-left">
        <div class="top"><span class="eyebrow">Left today</span></div>
        <div class="hero-num" id="hero-num">–</div>
        <div class="hero-sub" id="hero-sub"></div>
      </div>
      <div class="now-right">
        <div class="top"><span class="eyebrow">Replying with</span><span id="live-badge"></span></div>
        <div class="cur-name" id="cur-name"></div>
        <div class="cur-id" id="cur-id"></div>
      </div>
      <div class="now-foot">
        <div class="pace" id="pace" role="status"></div>
        <div class="side-limits" id="side-limits"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Fallback chain</h2></div>
      <table class="chain" id="chain">
        <thead>
          <tr>
            <th scope="col" class="c-rank"><span class="visually-hidden">Position</span></th>
            <th scope="col">Model</th>
            <th scope="col" class="c-status">Status</th>
            <th scope="col" class="c-today">Left today</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 3 -->
    <section class="section">
      <div class="section-head">
        <h2>By feature</h2>
        <div class="useg" id="range" role="radiogroup" aria-label="Range"></div>
      </div>
      <div class="feat">
        <svg class="donut" id="donut" width="184" height="184" viewBox="0 0 184 184" role="img"></svg>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <!-- 4 -->
    <section class="section">
      <div class="section-head"><h2>Stats</h2></div>
      <div class="kpis" id="kpis"></div>
      <div class="days-head"><h3>Requests per day</h3><span>last 14 days</span></div>
      <div class="chartbox" id="days-box"></div>
      <div class="visually-hidden" id="days-table"></div>
    </section>
  </main>
</div>

<div class="ctip" id="ctip" role="presentation"></div>

<div class="preview" aria-label="Preview">
  <span class="eyebrow">Preview</span>
  <div class="useg" id="scenes" role="radiogroup" aria-label="Preview state"></div>
</div>

// ── Time: Google's day runs midnight to midnight Pacific ────────────────────
// Everything here is shown in the viewer's own zone; only the day boundary is Pacific.
const PT = 'America/Los_Angeles';
function ptParts(ms) {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: PT, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(new Date(ms));
  const g = (t) => +p.find((x) => x.type === t).value;
  return { y: g('year'), mo: g('month') - 1, d: g('day'), h: g('hour'), mi: g('minute'), s: g('second') };
}
function ptWall(y, mo, d, h, mi) {
  const guess = Date.UTC(y, mo, d, h, mi);
  const p = ptParts(guess);
  const off = Date.UTC(p.y, p.mo, p.d, p.h, p.mi, p.s) - guess;
  return guess - off;
}
const REAL0 = Date.now();
const TODAY_PT = ptParts(REAL0);
const at = (hhmm, dayOffset = 0) => { const [h, m] = hhmm.split(':').map(Number); return ptWall(TODAY_PT.y, TODAY_PT.mo, TODAY_PT.d + dayOffset, h, m) };
const DAY_START = at('00:00');
const RESET = at('00:00', 1);
const clock = (ms) => {
  const s = new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return s === '12:00 AM' ? 'midnight' : s;
};
const span = (ms) => {
  const m = Math.max(0, Math.round(ms / 60000));
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
};
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` };
const n = (v) => Math.round(v).toLocaleString('en-US');
const compact = (v) => (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : n(v));

function load(key) {

    chain: CHAIN.map((m, i) => ({

      outAt: sc.out && sc.out[i] ? at(sc.out[i]) : null,
      early: !!(sc.early && sc.early.includes(i)),
      restUntil: sc.resting && sc.resting[i] ? t + sc.resting[i] * 1000 : null,
    })),
    embed: { used: sc.embed, rpd: 1000 },
    web: { used: sc.web, rpd: 500 },
  };
  const total = S.chain.reduce((s, m) => s + m.used, 0);
  const base = Object.values(SPLIT_TODAY).reduce((a, b) => a + b, 0);
  // Today's split scales with the scene, and rounding drift lands on Replies so it sums exactly.
  S.today = Object.fromEntries(Object.entries(SPLIT_TODAY).map(([k, v]) => [k, Math.round((v * total) / base)]));
  S.today.conversation += total - Object.values(S.today).reduce((a, b) => a + b, 0);
  S.tokensPer = 1420;
  S.ydayRatio = { req: 0.918, tok: 1.04 };
}

// ── Derived readings ────────────────────────────────────────────────────────
function stateOf(m, t) {
  if (m.outAt || m.used >= m.rpd) return 'out';
  if (m.restUntil && t < m.restUntil) return 'resting';
  return 'ok';
}
function reading() {
  const t = now();
  const chain = S.chain.map((m) => ({ ...m, state: stateOf(m, t) }));
  const cur = chain.find((m) => m.state === 'ok') || null;
  const capTotal = chain.reduce((s, m) => s + m.rpd, 0);
  const usedTotal = chain.reduce((s, m) => s + m.used, 0);
  const left = chain.reduce((s, m) => s + (m.state === 'out' ? 0 : m.rpd - m.used), 0);
  // Today's pace: everything counted since Google's day began, spread over the hours so far.
  const hrs = Math.max(0.25, (t - DAY_START) / 3.6e6);
  const perHr = usedTotal / hrs;
  const toReset = RESET - t;
  const need = perHr * (toReset / 3.6e6);
  const runsOutAt = perHr > 0 && need > left ? t + (left / perHr) * 3.6e6 : null;
  return { t, chain, cur, capTotal, usedTotal, left, perHr, toReset, runsOutAt };
}

    : badge('success', 'soundwave-circle', 'Live');
  $('stale-callout').innerHTML = S.stale
    ? `<div class="callout warning"><span class="ic">${svg('warnBold')}</span><div>Can’t reach the bot. These are the last figures it reported, not the current ones.</div></div>`
    : '';

  const cur = R.cur;
  if (cur) {
    $('cur-name').textContent = cur.name;
    $('cur-name').classList.remove('none');
    $('cur-id').textContent = cur.id;
  } else {
    $('cur-name').textContent = 'No model left';
    $('cur-name').classList.add('none');
    $('cur-id').textContent = '';
  }

  const pace = $('pace');
  pace.className = 'pace ' + tone;
  if (R.left === 0) {
    pace.innerHTML = `${svg('warnBold')}<span>Olisar can’t reply until the limits reset at ${clock(RESET)}.</span>`;
  } else if (R.runsOutAt) {
    pace.innerHTML = `${svg('warnBold')}<span>At today’s pace, this runs out around ${clock(R.runsOutAt)}, ${span(RESET - R.runsOutAt)} before the reset.</span>`;
  } else {
    pace.innerHTML = `${svg('checkBold')}<span>At today’s pace, this lasts until the reset.</span>`;
  }

  const side = (label, q) => {
    const l = q.rpd - q.used;
    return `<div class="side"><span>${label}</span><span class="mini" style="--used:${(q.used / q.rpd) * 100}%"><i></i></span>` +
      `<span class="v">${n(l)} <s>left of ${n(q.rpd)}</s></span></div>`;
  };
  $('side-limits').innerHTML = side('Memory search', S.embed) + side('Web search', S.web);
}

// ── The chain table ─────────────────────────────────────────────────────────
function statusOf(m, R) {
  if (m.state === 'out') {
    return badge('danger', 'minus-circle', 'Used up') + (m.outAt ? `<span class="when">at ${clock(m.outAt)}</span>` : '');
  }
  if (m.state === 'resting') {
    return badge('info', '', 'Back in', { busy: true, num: mmss(m.restUntil - R.t) });
  }
  if (R.cur && R.cur.i === m.i) return badge('success', 'play-circle', 'Replying');
  return badge('neutral', 'menu-dots-circle', 'Standby');
}
function renderChain(R) {
  const tbody = $('chain').tBodies[0];
  $('chain').classList.toggle('stale', S.stale);
  tbody.innerHTML = R.chain.map((m) => {
    const isCur = R.cur && R.cur.i === m.i;
    const left = m.state === 'out' ? 0 : m.rpd - m.used;
    return `<tr data-i="${m.i}" class="${isCur ? 'cur' : ''}${m.state === 'out' ? ' gone' : ''}">
      <th scope="row" class="c-rank">${m.i + 1}</th>
      <td><span class="m-name">${esc(m.name)}</span><span class="m-id">${esc(m.id)}</span><div class="m-status">${statusOf(m, R)}</div></td>
      <td class="c-status"><div class="st">${statusOf(m, R)}</div></td>
      <td class="c-today"><div class="today"><span class="mini${m.state === 'out' ? ' out' : ''}" style="--used:${Math.min(100, (m.used / m.rpd) * 100)}%"><i></i>${m.early && m.state === 'out' ? '<b class="seg-lost"></b>' : ''}</span>
        <span class="v"><span class="left-v">${n(left)}</span><s> / ${n(m.rpd)}</s></span></div></td>
    </tr>`;
  }).join('');
  hlRow(hlIndex);
}

let hlIndex = -1;
function hlRow(i) {
  hlIndex = i;
  [...$('chain').tBodies[0].rows].forEach((r, k) => r.classList.toggle('hl', k === i));
}
$('chain').addEventListener('pointerover', (e) => { const tr = e.target.closest('tbody tr'); if (tr) hlRow(+tr.dataset.i) });
$('chain').addEventListener('pointerleave', () => hlRow(-1));

const tip = $('ctip');
function showTip(e, html) {
  tip.innerHTML = html;
  tip.classList.add('on');
  const Z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX / Z + 14, y = e.clientY / Z - h - 12;
  if (x + w > window.innerWidth / Z - 8) x = e.clientX / Z - w - 14;
  if (y < 8) y = e.clientY / Z + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.classList.remove('on');

// ── 3 · By feature ──────────────────────────────────────────────────────────
let range = 'today';
const RANGES = [['today', 'Today'], ['7', '7 days'], ['30', '30 days']];
function segmented(el, opts, value, onPick) {
  el.innerHTML = opts.map(([v, l]) => `<button type="button" role="radio" data-v="${v}" aria-checked="${v === value}" tabindex="${v === value ? 0 : -1}">${l}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (b) onPick(b.dataset.v) };
  el.onkeydown = (e) => {
    const step = /^Arrow(Right|Down)$/.test(e.key) ? 1 : /^Arrow(Left|Up)$/.test(e.key) ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    const i = opts.findIndex(([v]) => v === value);
    const next = opts[(i + step + opts.length) % opts.length][0];
    onPick(next);
    el.querySelector(`[data-v="${next}"]`).focus();
  };
}
function renderRange() {
  segmented($('range'), RANGES, range, (v) => { range = v; renderRange(); renderFeatures() });
}
function featureData() {
  const src = range === 'today' ? S.today : range === '7' ? SPLIT_7 : SPLIT_30;
  const rows = FEATURES.map((f, i) => {
    if (f.key === 'other') {
      const parts = OTHER.map(([k, l]) => ({ label: l, value: src[k] || 0 })).sort((a, b) => b.value - a.value);
      return { ...f, i, value: parts.reduce((s, p) => s + p.value, 0), parts };
    }
    return { ...f, i, value: src[f.key] || 0 };
  });
  return { rows, total: rows.reduce((s, r) => s + r.value, 0) };
}
let donutHl = -1;
function renderFeatures() {
  const { rows, total } = featureData();
  const size = 184, c = size / 2, r = 74, sw = 16, gap = 5;
  const C = 2 * Math.PI * r;
  const drawable = C - rows.length * gap;
  let cursor = 0;
  const arcs = rows.map((row) => {
    const len = Math.max(sw * 0.2, (row.value / (total || 1)) * drawable);
    const a = { row, start: cursor, len };
    cursor += len + gap;
    return a;
  });
  const focus = donutHl >= 0 ? rows[donutHl] : null;
  const scope = range === 'today' ? 'today' : `last ${range} days`;
  const donut = $('donut');
  donut.setAttribute('aria-label', `Requests by feature, ${scope}: ` + rows.map((x) => `${x.label} ${Math.round((x.value / total) * 100)}%`).join(', '));
  donut.classList.toggle('hover', donutHl >= 0);
  donut.innerHTML = `<circle class="donut-track" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>` +
    arcs.map((a) => {
      const dash = Math.max(0.5, a.len);
      const rot = (a.start / C) * 360 - 90;
      return `<circle class="donut-seg c${a.row.i}${a.row.i === donutHl ? ' hl' : ''}" data-i="${a.row.i}" cx="${c}" cy="${c}" r="${r}"
        stroke-width="${a.row.i === donutHl ? sw + 4 : sw}" stroke-dasharray="${dash} ${C - dash}" transform="rotate(${rot} ${c} ${c})"/>`;
    }).join('') +
    `<text class="donut-total" x="${c}" y="${c + 4}" text-anchor="middle">${n(focus ? focus.value : total)}</text>` +
    `<text class="donut-sub" x="${c}" y="${c + 24}" text-anchor="middle">${focus ? esc(focus.label) : 'Requests'}</text>`;

  const max = Math.max(...rows.map((x) => x.value), 1);
  $('legend').innerHTML = rows.map((row) => {
    const pct = total ? Math.round((row.value / total) * 100) : 0;
    const main = `<div class="lg c${row.i}${row.i === donutHl ? ' hl' : ''}" data-i="${row.i}">
      <span class="sw"></span><span class="nm">${esc(row.label)}</span>
      <span class="bar" style="transform:scaleX(${row.value / max})"></span>
      <span class="val">${n(row.value)}</span><span class="pc">${pct}%</span></div>`;
    const subs = row.parts
      ? `<div class="lg-parts" data-i="${row.i}">${row.parts.filter((p) => p.value > 0).map((p) => `${esc(p.label)} <span class="mono">${n(p.value)}</span>`).join('<span class="sep">·</span>')}</div>`
      : '';
    return main + subs;
  }).join('');
}
function setDonutHl(i) { if (i !== donutHl) { donutHl = i; renderFeatures() } }
$('donut').addEventListener('pointermove', (e) => { const s = e.target.closest('.donut-seg'); setDonutHl(s ? +s.dataset.i : -1) });
$('donut').addEventListener('pointerleave', () => setDonutHl(-1));
$('legend').addEventListener('pointermove', (e) => { const l = e.target.closest('[data-i]'); setDonutHl(l ? +l.dataset.i : -1) });
$('legend').addEventListener('pointerleave', () => setDonutHl(-1));

// ── 4 · Stats ───────────────────────────────────────────────────────────────
function renderStats(R) {
  const req = R.usedTotal;
  const tok = req * S.tokensPer;
  const pct = (a, b) => { const p = Math.round(((a - b) / b) * 100); return (p > 0 ? '+' : p < 0 ? '−' : '±') + Math.abs(p) + '%' };
  const pk = S.sc.peak;
  const ranOut = S.sc.ranOutToday
    ? { big: 'Today', cap: `at ${clock(at(S.sc.ranOutToday))}` }
    : { big: '4 days ago', cap: `${new Date(at('21:12', -4)).toLocaleDateString([], { weekday: 'long' })} at ${clock(at('21:12', -4))}` };
  $('kpis').innerHTML = [
    ['Requests today', n(req), `${pct(req, req * S.ydayRatio.req)} on this time yesterday`],
    ['Tokens today', compact(tok), `${pct(tok, tok * S.ydayRatio.tok)} on this time yesterday`],
    ['Busiest minute', `${pk.v}<s> / ${pk.cap}</s>`, `${esc(pk.model)} at ${clock(at(pk.at))}`],
    ['Last ran out', ranOut.big, ranOut.cap],
  ].map(([k, big, cap]) => `<div class="kpi"><div class="eyebrow">${k}</div><div class="big">${big}</div><div class="cap">${cap}</div></div>`).join('');
  renderDays(R);
}

let daysW = 0;
function renderDays(R) {
  const box = $('days-box');
  const W = daysW || box.clientWidth || 900;
  const H = 150, x0 = 38, x1 = W - 4, y0 = H - 22, y1 = 14;
  const values = [...PAST, R.usedTotal];
  const limit = R.capTotal;
  const yMax = Math.max(limit * 1.08, ...values);
  const yAt = (v) => y0 - (v / yMax) * (y0 - y1);
  const slot = (x1 - x0) / values.length;
  const bw = Math.min(24, slot * 0.56);
  const dayMs = (k) => at('12:00', k - (values.length - 1));
  const label = (k) => (k === values.length - 1 ? 'Today' : new Date(dayMs(k)).toLocaleDateString([], { month: 'short', day: 'numeric' }));
  const ranOut = (k) => k === values.length - 1 ? !!S.sc.ranOutToday : values[k] >= limit;
  const cols = values.map((v, k) => {
    const cx = x0 + slot * (k + 0.5);
    const top = yAt(v), h = Math.max(0, y0 - top);
    const rr = Math.min(4, h);
    const today = k === values.length - 1;
    const cls = today ? 'today' : ranOut(k) ? 'ranout' : '';
    // 4px rounded data-end, square at the baseline.
    const d = h > 0 ? `M${cx - bw / 2} ${y0} V${top + rr} Q${cx - bw / 2} ${top} ${cx - bw / 2 + rr} ${top} H${cx + bw / 2 - rr} Q${cx + bw / 2} ${top} ${cx + bw / 2} ${top + rr} V${y0} Z` : '';
    const stride = Math.max(1, Math.ceil(56 / slot));
    const showLabel = today || ((values.length - 1 - k) % stride === 0 && (values.length - 1 - k) >= Math.max(1, Math.ceil(44 / slot)));
    return `<g class="col" data-k="${k}">
      <rect class="hit" x="${x0 + slot * k}" y="${y1}" width="${slot}" height="${y0 - y1 + 18}"/>
      <path class="bar ${cls}" d="${d}"/>
      ${today ? `<text class="tag" x="${Math.min(cx, x1 - 20)}" y="${top - 7}" text-anchor="middle">${n(v)}</text>` : ''}
      ${showLabel ? `<text class="axis${today ? ' on' : ''}" x="${today ? Math.min(cx, x1 - 18) : cx}" y="${y0 + 16}" text-anchor="middle">${label(k)}</text>` : ''}
    </g>`;
  }).join('');
  const ticks = [2000, 4000].filter((v) => v < yMax && Math.abs(yAt(v) - yAt(limit)) > 12);
  box.innerHTML = `<svg class="days-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Requests per day over the last 14 days, against the daily limit of ${n(limit)}. Today so far ${n(R.usedTotal)}.">
    ${ticks.map((v) => `<line class="grid" x1="${x0}" x2="${x1}" y1="${yAt(v)}" y2="${yAt(v)}"/><text class="axis" x="${x0 - 8}" y="${yAt(v) + 4}" text-anchor="end">${v / 1000}k</text>`).join('')}
    <line class="grid" x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}"/>
    <text class="axis" x="${x0 - 8}" y="${y0 + 4}" text-anchor="end">0</text>
    <line class="limit" x1="${x0}" x2="${x1}" y1="${yAt(limit)}" y2="${yAt(limit)}" stroke-dasharray="5 4"/>
    <text class="limit-txt" x="${x0 - 8}" y="${yAt(limit) + 4}" text-anchor="end">${compact(limit).replace(/,000$/, 'k')}</text>
    ${cols}
  </svg>`;
  box.dataset.values = JSON.stringify(values);
  $('days-table').innerHTML = `<table><caption>Requests per day, last 14 days. Daily limit ${n(limit)}.</caption>
    <thead><tr><th scope="col">Day</th><th scope="col">Requests</th></tr></thead><tbody>` +
    values.map((v, k) => `<tr><th scope="row">${label(k)}</th><td>${n(v)}${ranOut(k) ? ' (ran out)' : ''}</td></tr>`).join('') + `</tbody></table>`;
  box.onpointermove = (e) => {
    const col = e.target.closest('.col');
    box.querySelectorAll('.col').forEach((g) => g.classList.toggle('hl', g === col));
    if (!col) return hideTip();
    const k = +col.dataset.k, v = values[k], today = k === values.length - 1;
    const day = new Date(dayMs(k)).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    showTip(e, `<b>${n(v)}${today ? ' so far' : ''}</b><span>${today ? 'Today' : day}${ranOut(k) ? ' · ran out' : ''}</span>`);
  };
  box.onpointerleave = () => { box.querySelectorAll('.col').forEach((g) => g.classList.remove('hl')); hideTip() };
}
new ResizeObserver(([e]) => {
  const w = Math.round(e.contentRect.width);
  if (w > 0 && w !== daysW) { daysW = w; if (S) renderDays(reading()) }
}).observe($('days-box'));

// ── Live: a request every few seconds, as the bot would make them ───────────
function renderAll() {
  const R = reading();
  renderFoot(R);
  renderNow(R);
  renderChain(R);
  renderFeatures();
  renderStats(R);
}
function tick() {
  if (!S.stale) {
    const R = reading();
    const serve = (feature, from) => {
      const m = S.chain.slice(from).find((x) => stateOf(x, R.t) === 'ok');
      if (!m) return;
      m.used += 1;
      if (m.used >= m.rpd && !m.outAt) m.outAt = now();
      S.today[feature] = (S.today[feature] || 0) + 1;
    };
    const roll = Math.random();
    if (roll < 0.62) serve('conversation', 0);
    else if (roll < 0.8) serve('summary', LITE);
    else if (roll < 0.9) serve('persona', LITE);
    else serve('vision', LITE);
    if (Math.random() < 0.4 && S.embed.used < S.embed.rpd) S.embed.used += 1;
    renderAll();
  }
  clearTimeout(S.timer);
  S.timer = setTimeout(tick, 2600 + Math.random() * 2800);
}
// Countdowns (a model resting, the reset) move every second without waiting for a request.
setInterval(() => {
  if (!S) return;
  const R = reading();
  const wasResting = S.chain.some((m) => m.restUntil && m.restUntil > R.t - 1000 && m.restUntil <= R.t);
  if (wasResting) return renderAll();
  S.chain.forEach((m) => {
    if (m.restUntil && m.restUntil > R.t) {
      $('chain').tBodies[0].rows[m.i].querySelectorAll('.badge .num').forEach((num) => { num.textContent = mmss(m.restUntil - R.t) });
    }
  });
  $('hero-sub').innerHTML = `of <b>${n(R.capTotal)}</b> requests · resets at ${clock(RESET)}, in ${span(R.toReset)}`;
}, 1000);

function show(key) {
  if (S) clearTimeout(S.timer);
  load(key);
  if ($('scenes')) segmented($('scenes'), Object.entries(SCENES).map(([k, v]) => [k, v.label]), key, (k) => {
    show(k);
    const u = new URL(location.href); u.searchParams.set('state', k); history.replaceState(null, '', u);
  });
  renderAll();
  S.timer = setTimeout(tick, 2600);
}
renderRange();
const params = new URLSearchParams(location.search);
if (params.has('clean')) document.querySelector('.preview').remove();
const first = params.get('state');
show(SCENES[first] ? first : 'afternoon');
</script>
</body>
</html>
