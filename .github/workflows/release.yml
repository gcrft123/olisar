# Builds and publishes the Olisar desktop app to a GitHub Release when a v* tag is pushed —
# macOS (Apple Silicon .dmg) and Windows (NSIS .exe) in parallel. The in-app updater
# (desktop/updater.js) then picks up the new release automatically.
#
# Windows runs electron-builder --publish always (releaseType "release" in package.json), which
# uploads straight to the published v<tag> release. macOS builds first and uploads afterwards
# with `gh`, because its .dmg is signed with the Developer ID certificate and notarized by Apple
# — and stapling the notarization ticket rewrites the file, so it can't be uploaded until that's
# done. Both land on the same release. Without the signing secrets below the macOS job still
# produces the old unsigned build. See RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: builds, signs, notarizes and staples the macOS .dmg and publishes nothing.
  # Everything that uploads — the Windows job (electron-builder --publish always), the server
  # image, the `gh release` step — is gated on a tag below, so a dispatch run can't create or
  # touch a release. The finished .dmg comes back as a build artifact instead. This is how you
  # prove the whole signing chain end to end without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets
  packages: write # push the server image (see the server-image job)

jobs:
  # Fail fast if the tag and the version files disagree — otherwise electron-builder
  # builds/publishes under the wrong version and the tagged release ends up empty (v0.4.0).
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No tag on a dispatch run, so there's nothing to match against — an empty TAG makes the
      # script check only that the three version files agree with each other.
      - name: Assert version files match the tag
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/check_release_version.py

  # Build the server image here rather than from a `tags:` filter in image.yml: that
  # workflow's `paths` filter applies to the whole push event, so a tag whose diff touched
  # none of those paths would silently ship a release with no image for server-mode VMs
  # to pull. Releases are the channel `:latest` tracks, so this job must not be optional.
  server-image:
    if: startsWith(github.ref, 'refs/tags/') # nothing to ship on a rehearsal run
    needs: version-check
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # Prove the signing + notarization credentials before the macOS job spends ten minutes on Go,
  # uv, PyInstaller and a dashboard build to reach the step that uses them. Four v1.4.0 builds
  # died that way on a certificate secret that was simply unset. Runs on its own from the
  # Actions tab too — that's the point, it's the dry run a `v*`-only workflow can't give you.
  # `secrets: inherit`: a called workflow gets none of the repo's secrets otherwise.
  mac-preflight:
    needs: version-check
    uses: ./.github/workflows/mac-signing-preflight.yml
    secrets: inherit

  macos:
    needs: mac-preflight # which needs version-check, so both gates still apply
    runs-on: macos-14 # Apple Silicon → arm64 .dmg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/funnel-sidecar/go.mod

      - name: Build the Tailscale Funnel helper
        run: |
          cd desktop/funnel-sidecar
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../resources/olisar-funnel .

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the dashboard
        run: |
          cd web
          npm ci
          npm run build

      - name: Package the backend (PyInstaller)
        run: uv run pyinstaller desktop/backend.spec --noconfirm --clean

      # Signs the .app + the .dmg with the Developer ID certificate, notarizes both with
      # Apple, staples the tickets, and verifies the result (codesign / stapler / spctl).
      # Every secret below is optional: with none of them set electron-builder logs a
      # warning and builds the same unsigned .dmg as before, so forks and a repo without
      # the certificate still cut releases.
      - name: Build, sign & notarize the desktop app
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }} # base64 of the Developer ID .p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }} # its export password
          APPLE_ID: ${{ secrets.APPLE_ID }} # Apple ID on the developer team
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A set-but-empty CSC_LINK is worse than an absent one: electron-builder takes ""
          # for a file path and dies on "<dir> not a file" before it builds anything. An empty
          # MACOS_CERTIFICATE cost four v1.4.0 release builds that way, each failing with an
          # error that named neither the secret nor signing. Unset it so an empty secret
          # degrades exactly like an unset one — build-continues-unsigned, which is what the
          # comment above promises. notarize-dmg.js already skips an unsigned image on its own.
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning title=Unsigned macOS build::MACOS_CERTIFICATE is empty or unset — building an UNSIGNED, un-notarized .dmg. Set the secret to a base64 Developer ID .p12 to sign (RELEASING.md §2)."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm install
          npm run release:mac

      # macOS can't publish through electron-builder (see the note at the top), so upload the
      # finished .dmg here. The Windows job may have created the release already — whichever
      # job gets there first wins, and the other just adds its asset.
      #
      # `dist:mac` passes --publish never for that reason. Without it electron-builder still
      # schedules an upload of its own — and since this step's env deliberately carries no
      # GH_TOKEN (it was dropped when signing moved publishing down here), the build died on
      # "GitHub Personal Access Token is not set" *after* signing and notarizing successfully.
      - name: Publish the .dmg to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ github.ref_name }}'
          gh release create "$TAG" --title "$TAG" --notes '' || true
          gh release upload "$TAG" desktop/out/*.dmg --clobber

      # A rehearsal run publishes nothing, so hand the .dmg back as an artifact — the same file
      # a tag would have released, signed and stapled, there to be mounted and checked by hand.
      - name: Keep the .dmg as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Olisar-macos-dmg
          path: desktop/out/*.dmg
          retention-days: 7

  windows:
    # Skipped on a rehearsal run: it publishes through electron-builder --publish always, which
    # would create a release — the one thing a rehearsal must not do.
    if: startsWith(github.ref, 'refs/tags/')
    needs: version-check
    runs-on: windows-latest # x64 NSIS .exe
    defaults:
      run:
        shell: bash # uniform shell for the build commands (git-bash ships on the runner)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/funnel-sidecar/go.mod

      - name: Build the Tailscale Funnel helper
        run: |
          cd desktop/funnel-sidecar
          # -H windowsgui: GUI subsystem so the helper doesn't pop a console window
          # (its stdout is still captured by the backend's pipe).
          go build -ldflags="-s -w -H windowsgui" -o ../resources/olisar-funnel.exe .

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          # 3.12, not 3.13: quickjs 1.19.4 ships a cp312 win_amd64 wheel but no cp313 one,
          # so on 3.13 uv builds it from source and MSVC rejects its GCC-only compile flags.
          # (macOS stays on 3.13 — clang builds quickjs from source fine.)
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the dashboard
        run: |
          cd web
          npm ci
          npm run build

      - name: Package the backend (PyInstaller)
        run: uv run pyinstaller desktop/backend.spec --noconfirm --clean

      - name: Build & publish the desktop app
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run release
