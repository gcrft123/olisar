# Point the server image's `latest` tag at a stable release that's already been built.
#
# `latest` normally moves by itself when a stable release is tagged (image.yml). This is for
# putting it back: after a bad stable release, or after v2.0.beta-1 moved it by mistake. It
# copies the release's multi-arch manifest, so nothing is rebuilt and the release's own tag
# keeps its digest — a rebuild would give every VM pinned to that release a new digest to
# "update" to.
#
# Only `latest` moves. Managed VMs never read it (olisar-update.sh pins a release by tag and
# digest); it's for anyone running deploy/docker-compose.yml by hand.
name: Point :latest at a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, e.g. v2.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a beta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            *.beta-*) echo "::error::$TAG is a beta; latest only ever points at a stable release." ; exit 1 ;;
            v[0-9]*) ;;
            *) echo "::error::$TAG isn't a release tag." ; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the release's manifest to latest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:latest"
