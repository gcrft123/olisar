# Build and publish the multi-arch server image to GHCR, so the deploy bootstrap pulls
# a prebuilt image instead of building on a tiny free VM.
#
# Tags:  v<tag> + latest  (releases — what servers actually run)
#        main + <sha>     (tip of main — a canary nothing auto-deploys)
#
# `latest` deliberately tracks *releases*, not main. It used to move on every push to main,
# which meant server-mode operators silently ran unreleased code while the desktop app was
# on tagged releases — the two halves of the same product on opposite channels.
name: Server image

on:
  push:
    branches: [main]
    paths:
      - "olisar/**"
      - "api/**"
      - "bot/**"
      - "scripts/**"
      - "web/**"
      - "deploy/Dockerfile"
      - "desktop/funnel-sidecar/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/image.yml"
  # Releases come in through release.yml, NOT a `tags:` filter here: `paths` applies to the
  # whole push event, so a tag whose diff touched none of the paths above would skip the
  # build and ship a release with no server image.
  workflow_call:
  workflow_dispatch:

# Merging a batch of PRs otherwise starts one multi-arch build per merge, each ~10
# minutes of QEMU-emulated arm64, all but the last already obsolete — main has moved on
# by the time they finish. Keep one build per ref and cancel the ones overtaken: a build
# started later is built from a commit that already contains the earlier merges, so
# nothing is lost by dropping them. Tags get their own group and are never cancelled,
# since a release image has to exist for its own tag.
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 emulation for the multi-arch build
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
