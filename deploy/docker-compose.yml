# Olisar server — run the bot's backend 24/7 on a Linux VM.
#
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d
#   3. docker compose logs -f   → copy the printed https://…ts.net URL
#
# This file is for building/running from a clone. A *managed* VM (deployed by the desktop
# app or by bootstrap.sh) does not use it: olisar-update.sh generates the compose file
# there, pinned to an immutable digest, so what's deployed is a fact on disk rather than
# whatever :latest resolved to at the time.
#
# `:latest` now tracks the newest *release*, not the tip of main — use `:main` if you
# actually want the canary.
services:
  olisar:
    image: ghcr.io/gcrft123/olisar:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - olisar-data:/var/lib/olisar   # SQLite DB, knowledge uploads, Tailscale node state
    restart: unless-stopped
    # No published ports — Tailscale Funnel handles public ingress. Uncomment to reach
    # the dashboard locally on the VM (e.g. over an SSH tunnel) for debugging:
    # ports: ["127.0.0.1:8000:8000"]

volumes:
  olisar-data:
